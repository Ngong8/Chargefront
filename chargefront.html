function squadHasClearedFacility() {
    if (player.pos.y > 608) return false;
    return squadMembers.every(m => m.downed || m.pos.y < 614);
}

class Infested extends LJS.ThreeJSObject {
    constructor(type, pos, target) {
        const mesh = makeInfested(type);
        super(pos, LJS.vec2(1), mesh, terrainHeight(pos.x, pos.y));
        this.type = type;
        this.target = target;             // relay object or player
        /* hit radii now match the big 1.8-2.2x models (bug #2) */
        this.hitRadius = type === 'boss' ? 3.0 : type === 'brute' ? 2.4 : type === 'spitter' ? 1.6 : type === 'runner' ? 1.1 : type === 'screecher' ? 1.3 : type === 'drone' ? 1.2 : 1.3;
        const stats = ENEMY_STATS[type] || ENEMY_STATS.skitter;
        this.hp = stats.hp; this.speed = stats.speed; this.dmg = stats.dmg; this.attackRange = stats.meleeRange; this.attackCd = stats.meleeCd;
        this.rangedRange = stats.rangedRange || 0;
        this.attackT = 0; this.spitT = 0;
        this.mesh.castShadow = true;
        this.animT = rand(TAU);
        this.sep = LJS.vec2();
        this.dead = false; this.dying = false; this.dieT = 0;
        this.aggroT = 0;
        enemyTypeCounts[type]++;
        enemies.push(this);
        this.scatter = null;              // set when horde scatters (flee)
        this.fleeT = 0;
        this.stuckT = 0; this.stuckSide = undefined;   // wall-slide steering (bug #8)
        this.swoopT = 0;                                 // screecher dive timer
        this.ambient = false;             // wild wanderer roaming off the route
        this.home = this.pos.copy();
        this.wanderT = 3 + rand(3);
        this.wanderPos = this.pos.copy();
        this.unburrowing = false;         // emerging from the ground — no move/attack until done
        this.unburrowDur = rand(0.7, 1.0);
        this.unburrowT = 0;
        this.waitingForExit = false;
        this.finalScale = this.mesh.scale.x;
        this.focus = player;              // primary target (the horde may retarget a squadmate)
        this.canSeeTarget = true;         // last LOS result toward the current chase target
        this.lastSeen = null;             // where the AI last saw its target (for pathfinding)
        this.losT = rand(0.3);            // LOS re-check cadence
    }
    setSpawnScale(scale) {                // spawners call this instead of mesh.scale.multiplyScalar
        this.finalScale = this.mesh.scale.x * scale;   // model built-in size × spawn multiplier
        this.mesh.scale.setScalar(0.01);  // burrowed — tiny, then it grows out of the ground
        this.unburrowing = true;
        this.unburrowT = this.unburrowDur;
    }
    takeDamage(dmg) {
        if (this.dead || this.dying) return;
        const firstAggro = this.aggroT <= 0;
        this.hp -= dmg;
        this.aggroT = 4;                  // recent damage pulls it toward the player
        if (this.type === 'drone') playFileSfx('droneHit', 0.45, rand(0.95, 1.05), this.pos.x, this.pos.y);
        else if (firstAggro) playFileSfx('creature', 0.35, rand(0.9, 1.1), this.pos.x, this.pos.y);   // audio cue when it first aggroes
        if (this.hp <= 0) this.die();
    }
    die() {
        if (this.dead) return;
        this.dead = true; this.dying = true; this.dieT = 0.9;
        kills++;                            // total squad kills (player + teammates)
        playFileSfx('enemyDie', 0.6, rand(0.9, 1.1), this.pos.x, this.pos.y);
        spawnImpact(this.pos.x, this.pos.y, this.z + 0.6, 0xbb44ff, 3);
        logCombat('KILLED ' + this.type.toUpperCase(), '#ff88ff');
        if (Math.random() < 0.32) {
            const n = 1 + randInt(2);   // 1-2 scrap pickups
            for (let i = 0; i < n; i++) {
                spawnPickup(this.pos.copy().add(LJS.vec2(rand(-1.4, 1.4), rand(-1.4, 1.4))), 'scrap');
            }
            if (Math.random() < 0.08) spawnPickup(this.pos.copy().add(LJS.vec2(rand(-1, 1), rand(-1, 1))), 'power');
            if (Math.random() < 0.06) spawnPickup(this.pos.copy().add(LJS.vec2(rand(-1, 1), rand(-1, 1))), 'grenade');
        }
    }
    update() {
        /* Ground rings read at distance and fade out up close instead of obscuring the model. */
        const threatRing = this.mesh.getObjectByName('threatRing');
        if (threatRing && threatRing.material) {
            const d = Math.hypot(player.pos.x - this.pos.x, player.pos.y - this.pos.y);
            threatRing.material.opacity = clamp((d - 2.5) / 13, 0, 1) * (0.18 + 0.12 * (0.5 + 0.5 * Math.sin(LJS.time * 5 + this.animT)));
        }
        if (this.dying) {
            this.dieT -= LJS.timeDelta;
            const s = clamp(this.dieT / 0.9, 0, 1);
            this.mesh.scale.setScalar(Math.max(0.01, s));
            this.z = terrainHeight(this.pos.x, this.pos.y) + 0.1;
            if (this.dieT <= 0) this.destroy();
            super.update();
            return;
        }
        const dt = LJS.timeDelta;
        if (this.unburrowing) {
            if (this.waitingForExit) {
                if (!squadHasClearedFacility()) { this.z = terrainHeight(this.pos.x, this.pos.y); super.update(); return; }
                this.waitingForExit = false;
                this.unburrowT = this.unburrowDur;
                notify('THE HARVESTER ERUPTS FROM THE WASTES', '#ff55aa');
                playFileSfx('bossRoar', 0.9, 1, this.pos.x, this.pos.y);
            }
            /* horde unburrows immediately; wild wanderers wait until the squad is close */
            if (this.unburrowT >= this.unburrowDur) {
                let close = this.aggroT > 0 || !this.ambient || Math.hypot(player.pos.x - this.pos.x, player.pos.y - this.pos.y) < 38;
                if (!close) {
                    for (const sq of squadMembers) {
                        if (!sq.downed && Math.hypot(sq.pos.x - this.pos.x, sq.pos.y - this.pos.y) < 38) { close = true; break; }
                    }
                }
                if (!close) { this.z = terrainHeight(this.pos.x, this.pos.y); super.update(); return; }
            }
            /* unburrowing — grows out of the ground; NO movement and NO attacks until done */
            this.unburrowT -= dt;
            const p = 1 - clamp(this.unburrowT / this.unburrowDur, 0, 1);
            this.mesh.scale.setScalar(Math.max(0.01, this.finalScale * (p * p)));
            this.z = terrainHeight(this.pos.x, this.pos.y);
            if (this.unburrowT <= 0) {
                this.unburrowing = false;
                this.mesh.scale.setScalar(this.finalScale);
                playFileSfx('unburrow', 0.5, rand(0.9, 1.1), this.pos.x, this.pos.y);
                spawnImpact(this.pos.x, this.pos.y, this.z + 0.3, 0x9a7a5a, 1.2);   // dirt burst
            }
            super.update();
            return;
        }
        if (debugNoAggro) {               // playtest: visible + facing the player, but no chase/attack
            this.z = terrainHeight(this.pos.x, this.pos.y) + (this.type === 'drone' ? 3.2 : this.type === 'screecher' ? 6 : 0);
            this.angle = -Math.atan2(player.pos.y - this.pos.y, player.pos.x - this.pos.x);
            this.mesh.rotation.x += (0 - this.mesh.rotation.x) * 0.08;
            super.update();
            return;
        }
        let tx, ty;
        if (this.scatter) {               // horde broken: run away (NEVER despawn)
            this.fleeT += dt;
            tx = this.scatter.x; ty = this.scatter.y;
            if (Math.hypot(tx - this.pos.x, ty - this.pos.y) < 2.5) this.scatter = null;   // reached flee point → resume behavior
        } else if (this.ambient && this.aggroT <= 0) {   // wild wanderer: patrol until spooked
            this.wanderT -= dt;
            if (this.wanderT <= 0) {
                this.wanderT = 3 + rand(4);
                this.wanderPos.x = clamp(this.home.x + rand(-45, 45), 20, WORLD - 20);
                this.wanderPos.y = clamp(this.home.y + rand(-45, 45), 20, WORLD - 20);
            }
            tx = this.wanderPos.x; ty = this.wanderPos.y;
        } else {
            const tf = this.focus || player;
            const tfDown = tf !== player && (tf.downed || tf.dead);
            const tgt = tfDown ? player : tf;
            tx = tgt.pos.x; ty = tgt.pos.y;
        }
        /* aggro to player when close or recently shot */
        if (this.aggroT > 0) this.aggroT -= dt;
        const dPlayer = Math.hypot(player.pos.x - this.pos.x, player.pos.y - this.pos.y);
        if (this.ambient && this.aggroT <= 0 && dPlayer < 26) {
            this.aggroT = 5;
            if (this.type === 'drone') playFileSfx('droneHit', 0.4, rand(0.95, 1.05), this.pos.x, this.pos.y);
            else playFileSfx('creature', 0.35, rand(0.9, 1.1), this.pos.x, this.pos.y);
            if (wildAlertT <= 0 && this.type !== 'drone') { wildAlertT = 6; logCombat('WILD CREATURE ATTACK', '#ff8866'); }
        }
        if (this.ambient && this.aggroT > 0) { tx = player.pos.x; ty = player.pos.y; }
        else if (this.type === 'spitter' && this.aggroT > 0 && dPlayer < 45) { tx = player.pos.x; ty = player.pos.y; }
        else if (this.aggroT > 0 && dPlayer < 16) { tx = player.pos.x; ty = player.pos.y; }

        /* last-seen memory: when hunting a target the AI can't see right now, pathfind
           to where it last saw them (routes around walls instead of beelining) */
        const chasing = !this.scatter && !(this.ambient && this.aggroT <= 0);
        if (chasing) {
            this.losT -= dt;
            if (this.losT <= 0) {
                this.losT = 0.3 + rand(0.2);
                this.canSeeTarget = hasLOS(this.pos.x, this.pos.y, tx, ty, 0.8);
                if (this.canSeeTarget) this.lastSeen = LJS.vec2(tx, ty);
            }
            if (!this.canSeeTarget && this.lastSeen) {
                const dLS = Math.hypot(this.lastSeen.x - this.pos.x, this.lastSeen.y - this.pos.y);
                if (dLS < 3) this.lastSeen = null;   // searched the last-seen spot, fall back to beelining
                else { tx = this.lastSeen.x; ty = this.lastSeen.y; }
            }
        }

        const dTarget = Math.hypot(tx - this.pos.x, ty - this.pos.y);
        const facing = Math.atan2(ty - this.pos.y, tx - this.pos.x);
        this.angle = -facing;

        let attackTg = (this.aggroT > 0 && dPlayer < 16) ? player : (this.focus || player);
        if (attackTg !== player && (attackTg.downed || attackTg.dead)) attackTg = player;
        const isSolidTg = !!(attackTg && attackTg !== player && attackTg.takeDamage && attackTg.R);   // relays only — squadmates get fair melee range
        const stopDist = this.attackRange + (isSolidTg ? 2.4 : 0.5);
        let moveFacing = facing;
        let wantsToMove = dTarget > stopDist;
        if (this.rangedRange && !this.scatter) {
            if (dTarget > this.rangedRange + 2) wantsToMove = true;
            else if (dTarget < this.rangedRange - 3) { wantsToMove = true; moveFacing = facing + Math.PI; }
            else wantsToMove = false;
        }

        /* The Harvester cannot be safely focus-fired while it closes: it spits a heavy
           tracking glob from mid-range, then transitions to its faster melee attacks. */
        if (this.type === 'boss' && !this.scatter) {
            this.spitT -= dt;
            if (this.spitT <= 0 && dTarget > stopDist + 1 && dTarget < 38 && this.canSeeTarget) {
                this.spitT = 2.2 + rand(0.5);
                const glob = spawnAcid(this.pos.x, this.pos.y, this.z + 1.6, attackTg, { homing: false });
                glob.dmg = 18;
                glob.scale.setScalar(1.45);
                playSnd(sfx.spit, 0.75, rand(0.82, 0.92));
                logCombat('HARVESTER SPIT', '#ff66dd');
            }
        }

        if (wantsToMove) {
            const sp = this.scatter ? this.speed * 1.4 : this.speed;
            let nx = this.pos.x + Math.cos(moveFacing) * sp * dt;
            let ny = this.pos.y + Math.sin(moveFacing) * sp * dt;
            const curZ = terrainHeight(this.pos.x, this.pos.y);
            if (terrainHeight(nx, ny) <= curZ + MAX_STEP) { this.pos.x = nx; this.pos.y = ny; }
            this.sep.set(0, 0);
            /* simple separation */
            for (let i = 0; i < enemies.length; i++) {
                const o = enemies[i];
                if (o === this || o.dying) continue;
                const ddx = this.pos.x - o.pos.x, ddy = this.pos.y - o.pos.y;
                const d2 = ddx * ddx + ddy * ddy;
                if (d2 < 1.6 && d2 > 0.0001) {
                    const d = Math.sqrt(d2);
                    this.sep.x += (ddx / d) * (1.6 - d) * 0.5;
                    this.sep.y += (ddy / d) * (1.6 - d) * 0.5;
                }
            }
            this.pos.x += this.sep.x * dt * 6;
            this.pos.y += this.sep.y * dt * 6;
            const preX = this.pos.x, preY = this.pos.y;
            resolveCircle(this.pos, 0.4);
            /* wall-slide steering (bug #8): when forward motion is blocked, slide tangentially */
            const moved = Math.hypot(this.pos.x - preX, this.pos.y - preY);
            if (moved < sp * dt * 0.35) {
                this.stuckT += dt;
                if (this.stuckT > 0.25) {
                    if (this.stuckSide === undefined) this.stuckSide = Math.random() < 0.5 ? 1 : -1;
                    const a2 = moveFacing + this.stuckSide * Math.PI / 2;
                    const sx2 = this.pos.x + Math.cos(a2) * sp * dt;
                    const sy2 = this.pos.y + Math.sin(a2) * sp * dt;
                    if (terrainHeight(sx2, sy2) <= terrainHeight(this.pos.x, this.pos.y) + MAX_STEP && !isInsideSolid(sx2, sy2)) {
                        this.pos.x = sx2; this.pos.y = sy2;
                        resolveCircle(this.pos, 0.4);
                    }
                    if (this.stuckT > 0.7) this.stuckSide = undefined;
                }
            } else {
                this.stuckT = 0; this.stuckSide = undefined;
            }
            this.z = terrainHeight(this.pos.x, this.pos.y);
            /* screecher flight: hover high, swoop low when the player gets close (content #19) */
            if (this.type === 'screecher') {
                const gh = terrainHeight(this.pos.x, this.pos.y);
                this.swoopT -= dt;
                const dP = Math.hypot(player.pos.x - this.pos.x, player.pos.y - this.pos.y);
                const swooping = false;
                this.z = swooping ? gh + 0.9 : gh + 6 + Math.sin(LJS.time * 2 + this.animT) * 1.5;
                this.mesh.rotation.x = swooping ? -0.8 : 0.1;
            } else if (this.type === 'drone') {
                /* drone flight: hover low near the facility, lunge in when the squad gets close */
                const gh = terrainHeight(this.pos.x, this.pos.y);
                const dP = Math.hypot(player.pos.x - this.pos.x, player.pos.y - this.pos.y);
                const lunging = false;
                this.z = gh + (lunging ? 1.0 : 3.2) + Math.sin(LJS.time * 3 + this.animT) * (lunging ? 0.3 : 0.6);
                this.mesh.rotation.x = lunging ? -0.5 : Math.sin(this.animT * 2) * 0.06;
            } else {
                this.z = terrainHeight(this.pos.x, this.pos.y);
            }
            /* footstep / breath anim */
            this.animT += dt * (this.type === 'drone' ? 16 : this.type === 'skitter' ? 14 : this.type === 'screecher' ? 20 : 7);
            this.mesh.rotation.x = Math.sin(this.animT) * 0.12;
        } else {
            const egh = terrainHeight(this.pos.x, this.pos.y);
            this.z = this.type === 'drone' ? egh + 3.2 + Math.sin(LJS.time * 3 + this.animT) * 0.6 : this.type === 'screecher' ? egh + 6 + Math.sin(LJS.time * 2 + this.animT) * 1.5 : egh;
            /* attack target */
            this.attackT -= dt;
            if (this.attackT <= 0) {
                this.attackT = this.attackCd + rand(0.3);
                if (this.ambient && this.aggroT <= 0) {
                    /* calm wild creature: postures, but won't attack until spooked */
                    this.mesh.rotation.x = -0.35;
                } else if (this.type === 'spitter') {
                    const stg = attackTg && !attackTg.R ? attackTg : player;
                    spawnAcid(this.pos.x, this.pos.y, this.z + 0.9, stg, { homing: false, poolOnGround: true, poolDamage: 8 });
                    playSnd(sfx.spit, 0.5, rand(0.9, 1.1));
                } else if (this.type === 'screecher') {
                    const stg = attackTg && !attackTg.R ? attackTg : player;
                    spawnEnemyShot(this.pos.x, this.pos.y, this.z + 0.4, stg, { kind: 'screechRing', color: 0xff3de8, dmg: this.dmg, speed: 20, size: 0.23, ring: true, homing: false });
                    playFileSfx('screech', 0.55, rand(0.95, 1.05), this.pos.x, this.pos.y);
                } else if (this.type === 'drone') {
                    const stg = attackTg && !attackTg.R ? attackTg : player;
                    spawnEnemyShot(this.pos.x, this.pos.y, this.z + 0.2, stg, { kind: 'droneLaser', color: 0x55cfff, dmg: this.dmg, speed: 31, size: 0.12, ring: false, homing: false });
                    playFileSfx('laserShot', 0.32, rand(1.12, 1.25), this.pos.x, this.pos.y);
                } else if (attackTg === player) {
                    /* melee must use the REAL distance to the player — dTarget is the distance
                       to the movement target (a wander point for wild creatures) and can be ~0
                       while the creature is still far away (bug: invisible hits from across the map) */
                    if (dPlayer < stopDist + 0.4) { playerTakeDamage(this.dmg, true); noteAttacker(this.pos.x, this.pos.y, this.type); }
                    /* the swarm also claws nearby squadmates — it fights the whole team */
                    let bestSq = null, bestSqD = 5.2;
                    for (const m of squadMembers) {
                        if (m.downed) continue;
                        const sd = Math.hypot(m.pos.x - this.pos.x, m.pos.y - this.pos.y);
                        if (sd < bestSqD) { bestSqD = sd; bestSq = m; }
                    }
                    if (bestSq) { bestSq.takeDamage(this.dmg); }   // squad hits now play unitHit (inside takeDamage)
                } else if (attackTg && attackTg.takeDamage) {
                    if (dTarget < stopDist + 0.6) {
                        attackTg.takeDamage(this.dmg);
                        if (attackTg.R) playFileSfx('armorHit', 0.4, 1, attackTg.pos.x, attackTg.pos.y);   // relays only — squad hits use unitHit
                    }
                }
                this.mesh.rotation.x = -0.35;   // lunge
            }
        }
        this.mesh.rotation.x += (0 - this.mesh.rotation.x) * 0.08;
        animateInfestedVisuals(this, dTarget > stopDist);
        super.update();
    }
    destroy(immediate) {
        const i = enemies.indexOf(this);
        if (i >= 0) enemies.splice(i, 1);
        enemyTypeCounts[this.type]--;
        super.destroy(immediate);
    }
}

function animateInfestedVisuals(enemy, walking) {
    const legs = enemy.mesh.userData.legs || [];
    const gait = Math.sin(LJS.time * (enemy.type === 'runner' ? 16 : enemy.type === 'boss' ? 7 : 10));
    for (const leg of legs) leg.rotation.y = walking ? gait * 0.34 * Math.cos(leg.userData.phase || 0) : 0;
    const wings = enemy.mesh.userData.wings || [];
    for (const wing of wings) wing.rotation.x = Math.sin(LJS.time * 18 + wing.userData.phase) * 0.62;
    if (enemy.type === 'drone') {
        const rotors = enemy.mesh.getObjectByName('rotors');
        if (rotors) for (const rotor of rotors.children) rotor.rotation.z += LJS.timeDelta * 42;
    }
}

const acid = [];
class Acid extends THREE.Group {
    constructor(x, y, z, target, options = {}) {
        super();
        this.target = target;
        this.homing = options.homing !== false;
        this.poolOnGround = !!options.poolOnGround;
        this.poolDamage = options.poolDamage || 8;
        const targetZ = target === player ? player.zPos + 1.4 : target && target.pos ? terrainHeight(target.pos.x, target.pos.y) + 1.4 : z + 0.9;
        this.vel = new THREE.Vector3(target.pos.x - x, target.pos.y - y, targetZ - (z + 0.9)).normalize().multiplyScalar(16);
        this.gravity = this.poolOnGround ? 12 : 0;
        if (this.poolOnGround && target && target.pos) {
            const dx = target.pos.x - x, dy = target.pos.y - y;
            const distance = Math.max(0.1, Math.hypot(dx, dy));
            const horizontalSpeed = 15;
            const travelTime = Math.max(0.2, distance / horizontalSpeed);
            const groundZ = terrainHeight(target.pos.x, target.pos.y) + 0.04;
            this.vel.set(dx / distance * horizontalSpeed, dy / distance * horizontalSpeed, (groundZ - (z + 0.9) + 0.5 * this.gravity * travelTime * travelTime) / travelTime);
        }
        this.life = 3.0;
        this.dmg = 10;
        this.mat = mat(0x66ff88, { emissive: 0x33dd66, emissiveIntensity: 1.4, transparent: true, opacity: 0.9 });
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.22, 7, 6), this.mat);
        this.add(ball);
        this.position.set(x, y, z + 0.9);
        scene.add(this);
        acid.push(this);
    }
    update(dt) {
        this.life -= dt;
        if (this.life <= 0) { this.removeSelf(); return; }
        const tgt = this.target;
        if (this.homing && tgt) {
            const tz = (tgt === player) ? player.zPos + 1.4 : tgt.pos ? terrainHeight(tgt.pos.x, tgt.pos.y) + 1.4 : 1.4;
            const dir = new THREE.Vector3(tgt.pos.x - this.position.x, tgt.pos.y - this.position.y, tz - this.position.z).normalize();
            this.vel.lerp(dir.multiplyScalar(16), 0.12);
        }
        if (this.gravity) this.vel.z -= this.gravity * dt;
        this.position.addScaledVector(this.vel, dt);
        if (isInsideSolid(this.position.x, this.position.y)) {
            spawnImpact(this.position.x, this.position.y, this.position.z, 0x66ff88, 2);
            playSnd(sfx.impact, 0.3);
            this.removeSelf(); return;
        }
        if (this.position.z < terrainHeight(this.position.x, this.position.y) + 0.1) {
            const groundZ = terrainHeight(this.position.x, this.position.y);
            spawnImpact(this.position.x, this.position.y, groundZ + 0.2, 0x66ff88, 2);
            if (this.poolOnGround) spawnAcidPool(this.position.x, this.position.y, groundZ + 0.03, this.poolDamage);
            playSnd(sfx.impact, 0.3);
            this.removeSelf(); return;
        }
        if (tgt === player) {
            const d = Math.hypot(this.position.x - player.pos.x, this.position.y - player.pos.y);
            if (d < 0.9 && Math.abs(this.position.z - (player.zPos + 1.3)) < 1.2) {
                playerTakeDamage(this.dmg, true);
                noteAttacker(this.position.x, this.position.y, 'acid');
                spawnImpact(this.position.x, this.position.y, this.position.z, 0x66ff88, 2);
                this.removeSelf(); return;
            }
        }
        if (tgt && tgt !== player && tgt.takeDamage) {
            const d = Math.hypot(this.position.x - tgt.pos.x, this.position.y - tgt.pos.y);
            if (d < 2.6) { tgt.takeDamage(this.dmg); spawnImpact(this.position.x, this.position.y, this.position.z, 0x66ff88, 2); this.removeSelf(); return; }
        }
    }
    removeSelf() {
        const i = acid.indexOf(this);
        if (i >= 0) acid.splice(i, 1);
        scene.remove(this);
        this.mat.dispose();
    }
}
function spawnAcid(x, y, z, target, options) { return new Acid(x, y, z, target, options); }

const acidPools = [];
class AcidPool extends THREE.Group {
    constructor(x, y, z, dmg = 8) {

    }

}

}
function spawnEnemyShot(x, y, z, target, style) { return new EnemyShot(x, y, z, target, style); }

/* ─── horde spawner (objective driven, not endless) ─────────────────────── */
let hordeSpawnT = 2.5;
function updateHorde(dt) {
    const active = isDefensePhase(phase) ? relayByPhase() : null;
    if (!active) return;
    hordeSpawnT -= dt;
    if (hordeSpawnT > 0) return;
    if (active.powering) {
        const diff = active.diff || 0;   // diff was missing on runtime relays → NaN scale bug (now guarded)
        if (active.budgetLeft > 0) {
            /* spread the whole budget across the full defense instead of dumping it up-front */
            hordeSpawnT = clamp((1.6 * active.dur) / Math.max(4, active.budgetLeft), 1.1, 4.5);
            const n = Math.min(active.budgetLeft, 1 + randInt(2));
            spawnGroup(active.pos, 26, 50, n, 1 + diff * 0.4, diff, player);
            active.budgetLeft -= n;
        } else {
            /* budget spent — occasional stragglers so the ground doesn't go quiet early */
            hordeSpawnT = 3 + rand(4);
            if (Math.random() < 0.5) spawnGroup(active.pos, 26, 50, 1, 1 + diff * 0.4, diff, player);
        }
    } else {
        hordeSpawnT = 1.5 + rand(1.4);
    }
}

/* wild alien creatures roaming the map between path segments (travel phases) */
let ambientSpawnT = 6;
const AMBIENT_CAP = 8;   // no-despawn balance: fewer wild wanderers (they persist now)
function updateAmbient(dt) {
    if (isDefensePhase(phase) || phase === P.FINALE) return;
    if (phase !== P.DEPLOY && phase !== P.MOVE_R1 && phase !== P.MOVE_R2 && phase !== P.MOVE_R3 && phase !== P.MOVE_FAC && phase !== P.SEARCH) return;
    ambientSpawnT -= dt;
    if (ambientSpawnT > 0) return;
    ambientSpawnT = 4 + rand(6);
    let ambient = 0;
    for (const e of enemies) if (e.ambient && !e.dead && !e.dying) ambient++;
    if (ambient >= AMBIENT_CAP || enemies.length >= 80) return;
    for (let tries = 0; tries < 24; tries++) {
        const wx = rand(30, WORLD - 30), wy = rand(30, WORLD - 30);
        const d = distToRoute(wx, wy);
        if (d < 12 || d > 60) continue;               // close enough to be clearly visible from the path
        if (Math.hypot(wx - FACILITY.x, wy - FACILITY.y) < 110) continue;   // wild creatures stay away from the facility
        const h = terrainHeight(wx, wy);
        if (h < 1.5 || h > 18) continue;              // not cliff tops / high hills
        if (isInsideSolid(wx, wy)) continue;
        const roll = Math.random();
        const type = roll < 0.5 ? 'skitter' : roll < 0.75 ? 'runner' : roll < 0.9 ? 'spitter' : 'screecher';
        const e = new Infested(type, LJS.vec2(wx, wy), player);
        e.ambient = true;
        e.setSpawnScale(1.25);            // a touch bigger so they read at range + unburrow
        logCombat('Wild creature appeared (' + type + ')', '#ffdd66');
        return;
    }
}
/* facility security drones — hover around the abandoned facility and harry the squad */
let droneSpawnT = 5;
const DRONE_CAP = 4;
function updateDrones(dt) {
    if (phase !== P.MOVE_FAC && phase !== P.SEARCH) return;   // FINALE waves are handled by updateFinaleDrones
    droneSpawnT -= dt;
    if (droneSpawnT > 0) return;
    let count = 0;
    for (const e of enemies) if (e.type === 'drone' && !e.dead && !e.dying) count++;
    if (count >= DRONE_CAP || enemies.length >= 80) { droneSpawnT = 5; return; }
    droneSpawnT = 8 + rand(6);
    const p = findSpawnPoint(FACILITY, 12, 55, 4);
    if (!p) return;
    const e = new Infested('drone', p, player);
    e.ambient = true;                      // patrol the facility (around and within it)
    logCombat('Drone detected near the facility', '#88ccff');
    playFileSfx('droneAlert', 0.6, 1, p.x, p.y);   // audible drone-detected alert (spatial)
}

/* FINALE evacuation: security drones chase the fleeing squad in periodic waves */
function updateFinaleDrones(dt) {
    if (phase !== P.FINALE) return;
    finaleDroneWaveT -= dt;
    if (finaleDroneWaveT > 0) return;
    finaleDroneWaveT = 20;                 // a new wave every 20 seconds
    spawnDroneWave();
}
function spawnDroneWave() {
    let spawned = 0;
    for (let i = 0; i < 4; i++) {          // up to 4 drones per wave
        if (enemies.length >= 80) break;
        const p = findSpawnPoint(FACILITY, 18, 70, 5);
        if (!p) continue;
        const e = new Infested('drone', p, player);
        e.ambient = false;                 // chase the squad, not patrol
        e.aggroT = 10;
        if (squadMembers.length && Math.random() < 0.4) {
            const sq = squadMembers[randInt(squadMembers.length)];
            if (sq && !sq.downed) e.focus = sq;
        }
        spawned++;
    }
    if (spawned > 0) {
        logCombat('Security drones inbound (' + spawned + ')', '#88ccff');
        playFileSfx('droneAlert', 0.65, 1, FACILITY.x, FACILITY.y);   // alert when the drone wave spawns
    }
}

/* one-time facility security presence: a few drones inside/around the compound */
function spawnInitialFacilityDrones() {
    const spots = [[360, 645], [370, 638], [350, 632], [398, 674]];
    for (const s of spots) {
        const e = new Infested('drone', LJS.vec2(s[0], s[1]), player);
        e.ambient = true;
        e.home = e.pos.copy();
        e.wanderPos = e.pos.copy();
        e.wanderT = 4 + rand(4);
    }
}

/* find a spawn point: not inside solids, not stacked on other enemies/player,
   and on walkable terrain — so the horde/drones don't clump inside walls */
function findSpawnPoint(center, rMin, rMax, minDist) {
    for (let tries = 0; tries < 60; tries++) {
        const a = rand(TAU), r = rand(rMin, rMax);
        const x = clamp(center.x + Math.cos(a) * r, 10, WORLD - 10);
        const y = clamp(center.y + Math.sin(a) * r, 10, WORLD - 10);
        if (isInsideSolid(x, y, 0.8)) continue;
        const h = terrainHeight(x, y);
        if (h < 0.2 || h > 55) continue;
        if (Math.hypot(x - player.pos.x, y - player.pos.y) < minDist + 6) continue;
        let ok = true;
        for (const e of enemies) {
            if (e.dead || e.dying) continue;
            if (Math.hypot(x - e.pos.x, y - e.pos.y) < minDist) { ok = false; break; }
        }
        if (!ok) continue;
        return LJS.vec2(x, y);
    }
    /* relaxed fallback — just avoid solids */
    for (let tries = 0; tries < 40; tries++) {
        const a = rand(TAU), r = rand(rMin, rMax);
        const x = clamp(center.x + Math.cos(a) * r, 10, WORLD - 10);
        const y = clamp(center.y + Math.sin(a) * r, 10, WORLD - 10);
        if (isInsideSolid(x, y, 0.8)) continue;
        return LJS.vec2(x, y);
    }
    return LJS.vec2(clamp(center.x + rand(-rMax, rMax), 10, WORLD - 10), clamp(center.y + rand(-rMax, rMax), 10, WORLD - 10));
}

function spawnGroup(center, rMin, rMax, n, scale, diff, targetOverride) {
    for (let i = 0; i < n; i++) {
        if (enemies.length >= 80) return;
        const p = findSpawnPoint(center, rMin, rMax, 4.5);
        if (!p) continue;
        const roll = Math.random();
        const type = roll < 0.45 - diff * 0.05 ? 'skitter' : roll < 0.45 - diff * 0.05 + 0.22 ? 'brute' : roll < 0.78 ? 'spitter' : roll < 0.9 ? 'runner' : 'screecher';
        const e = new Infested(type, p, targetOverride || player);
        e.setSpawnScale(scale);   // preserve the model's built-in size boost + start unburrow
        resolveCircle(e.pos, 0.6);   // nudge out of any wall edge it spawned on
        if (squadMembers.length && Math.random() < 0.4) {   // the horde sometimes hunts a squadmate
            const sq = squadMembers[randInt(squadMembers.length)];
            if (sq && !sq.downed) e.focus = sq;
        }
    }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SQUAD (AI teammates with commands)
   ═══════════════════════════════════════════════════════════════════════════ */
const SQUAD_DEFS = [
    /* ROOK — shotgun-like laser: 8 pellets per trigger pull, wide spread, shorter effective range */
    { name: 'ROOK', role: 'heavy', color: 0x4a8a3a, dmg: 5, cd: 0.55, range: 42, acc: 0.09, hp: 130, magSize: 30, reserve: 4, pellets: 8 },
    /* VEX — SMG-like laser: fast fire, lighter damage, high-capacity magazine */
    { name: 'VEX',  role: 'medic', color: 0xd84a7a, dmg: 9, cd: 0.12, range: 42, acc: 0.03, hp: 100, magSize: 70, reserve: 4 },
    /* KADE — standard rifleman: same rifle loadout as before */
    { name: 'KADE', role: 'rifle', color: 0x4a7ad8, dmg: 12, cd: 0.18, range: 70, acc: 0.016, hp: 110, magSize: 50, reserve: 4 },
];
class SquadMember extends LJS.ThreeJSObject {
    constructor(def, slotIndex) {
        const mesh = makeSoldier(def.color, def.role);
        const pos = LZ.copy().add(LJS.vec2(rand(-2, 2), rand(-3, -1)));
        super(pos, LJS.vec2(0.6), mesh, terrainHeight(pos.x, pos.y));
        this.def = def;
        this.slot = slotIndex;
        this.hp = def.hp; this.maxHp = def.hp;
        /* squad shield: same rechargeable energy pool as the player (60% absorb, regen after 10 s) */
        this.maxShield = Math.round(def.hp * 0.8);
        this.shield = this.maxShield;
        this.shieldDelayT = 0; this.hpDelayT = 0;   // regen timers — 0 = ready; reset to SHIELD/HP_REGEN_DELAY on damage
        this.downed = false;
        this.fireT = rand(0.5);
        this.mag = def.magSize; this.magSize = def.magSize; this.reserve = def.reserve;
        this.reloading = false; this.reloadT = 0;
        this.holdPos = pos.copy();
        this.target = null;
        this.targetT = 0;
        this.animT = rand(TAU);
        this.idleT = 0; this.idleLookT = 0; this.idleLookAngle = 0;   // idle look-around behaviour
        this.lastMoveAngle = Math.atan2(player.pos.y - this.pos.y, player.pos.x - this.pos.x);   // face the player until they first move
        this.mesh.castShadow = true;
        this.reviveT = 0;
        /* weapon lights: a dim glow from the glowing gun parts + a forward flashlight cone */
        this.weaponGlow = new THREE.PointLight(0x7fd4ff, 2.4, 9, 1.8);
        this.weaponGlow.position.set(0.32, 0.12, 1.05);
        this.mesh.add(this.weaponGlow);
        this.flashlight = new THREE.SpotLight(0xcfe6ff, 22, 34, 0.55, 0.45, 1.6);
        this.flashlight.position.set(0.32, 0.12, 1.02);
        this.flashlight.target.position.set(13, 0.0, 1.0);
        this.mesh.add(this.flashlight);
        this.mesh.add(this.flashlight.target);
        this.engageT = 0; this.engageTarget = null; this.lastSeenTarget = null; this.breakT = 0;   // break-off + pathfind-to-last-seen
        this.evadeT = 0; this.evadeCd = rand(0.3, 0.9); this.evadePos = null;
        squadMembers.push(this);
    }
    takeDamage(dmg) {
        if (this.downed) return;
        /* the shield absorbs 100% of incoming damage; leftover body damage is 40% reduced */
        const absorbed = Math.min(this.shield, dmg);
        this.shield -= absorbed;
        this.hp -= (dmg - absorbed) * 0.6;
        /* a hit interrupts both regen timers */
        this.shieldDelayT = SHIELD_REGEN_DELAY;
        this.hpDelayT = HP_REGEN_DELAY;
        /* any attack on a squadmate uses the unit-hit audio (spatial awareness) */
        playFileSfx('unitHit', 0.7, rand(0.9, 1.1), this.pos.x, this.pos.y);
        if (this.hp <= 0) { this.hp = 0; this.downed = true; notify(this.def.name + ' is DOWN — revive them!', '#ff7766'); }
    }
    revive() { this.downed = false; this.hp = Math.round(this.maxHp * 0.55); this.shield = this.maxShield; this.shieldDelayT = 0; this.hpDelayT = 0; this.mesh.rotation.x = 0; }
    formationSpot() {
        const a = LJS.vec2();
        if (this.downed) return a;
        if (squadCommand === 'hold') return this.holdPos;
        const cx = player.pos.x, cy = player.pos.y;
        let slot;
        if (squadCommand === 'spread') {
            const angles = [0.3, 2.6, 4.9];   // fixed world angles — positions don't rotate with mouse look
            const rad = 13;
            const ang = angles[this.slot];
            slot = LJS.vec2(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad);
        } else {   // assist: tight, close wedge right behind the player (anchored to last movement, not mouse look)
            const backs = [-1.4, 1.4, 0];
            const dists = [1.6, 1.6, 2.8];
            const fy = (player.lastMoveYaw !== undefined && player.lastMoveYaw !== null) ? player.lastMoveYaw : player.yaw;
            const bx = -Math.cos(fy) * dists[this.slot] + Math.cos(fy + Math.PI / 2) * backs[this.slot];
            const by = -Math.sin(fy) * dists[this.slot] + Math.sin(fy + Math.PI / 2) * backs[this.slot];
            slot = LJS.vec2(cx + bx, cy + by);
        }
        /* when defending a relay, spread around it instead */
        const rel = relayByPhase();
        if (rel && rel.powering && squadCommand === 'spread') {
            const ang = [0.9, 2.1, 3.3][this.slot];
            const rad = 11;
            slot = LJS.vec2(rel.pos.x + Math.cos(ang) * rad, rel.pos.y + Math.sin(ang) * rad);
        }
        return slot;
    }
    update() {
        const dt = LJS.timeDelta;
        if (this.downed) {
            this.mesh.rotation.x = lerp(this.mesh.rotation.x, 1.35, 0.1);
            this.z = terrainHeight(this.pos.x, this.pos.y) + 0.2;
            this.angle = 0;
            super.update();
            return;
        }
        this.targetT -= dt;
        if (this.breakT > 0) {
            this.breakT -= dt;            // cool-down after disengaging — rejoin the player first
            this.target = null;
        } else if (this.targetT <= 0) {
            this.targetT = 0.3; this.acquireTarget();
        }

        /* only shoot enemies we can actually see AND that have emerged — stop wasting fire on
           burrowed (still underground) creatures or targets that went behind cover. If we lose
           sight, remember where the target was last seen and pathfind there to re-engage. */
        if (this.target) {
            if (this.target.dead || this.target.dying || this.target.unburrowing) {
                this.target = null;
                this.lastSeenTarget = null;
            } else if (!hasLOS(this.pos.x, this.pos.y, this.target.pos.x, this.target.pos.y, 0.6)) {
                if (!this.lastSeenTarget) this.lastSeenTarget = this.target.pos.copy();
                this.target = null;
            } else {
                this.lastSeenTarget = null;
            }
        }

        const spot = this.formationSpot();
        if (this.updateEvasion(dt)) {
            this.z = terrainHeight(this.pos.x, this.pos.y);
            this.animT += dt * 13;
            const stride = Math.sin(this.animT) * 0.38;
            const legs = this.mesh.userData.legs || [];
            for (let i = 0; i < legs.length; i++) legs[i].rotation.y = i ? -stride : stride;
            const rifle = this.mesh.getObjectByName('squadRifle');
            if (rifle) { rifle.rotation.y = lerp(rifle.rotation.y, Math.PI / 2, 0.22); rifle.position.z = lerp(rifle.position.z, 1.0, 0.22); }
            super.update();
            return;
        }
        const playerDist = Math.hypot(player.pos.x - this.pos.x, player.pos.y - this.pos.y);
        /* de-engage range by command: assist breaks off sooner when the player moves away,
           spread keeps the default range; hold never chases and stands its ground */
        const deEngageRange = squadCommand === 'assist' ? 34 : 70;
        const breaking = squadCommand !== 'hold' && this.target && (this.engageT > 6 || playerDist > deEngageRange);
        if (this.target && !this.target.dead && !breaking) {
            /* engage */
            if (this.target !== this.engageTarget) { this.engageTarget = this.target; this.engageT = 0; }
            this.engageT += dt;
            this.idleT = 0; this.idleLookT = 0;
            const d = Math.hypot(this.target.pos.x - this.pos.x, this.target.pos.y - this.pos.y);
            const facing = Math.atan2(this.target.pos.y - this.pos.y, this.target.pos.x - this.pos.x);
            this.turnTo(-facing);
            if (d < this.def.range) {
                if (this.reloading) {
                    this.reloadT -= dt;
                    if (this.reloadT <= 0) { if (this.reserve > 0) { this.reserve--; this.mag = this.magSize; } this.reloading = false; }
                } else {
                    this.fireT -= dt;
                    if (this.fireT <= 0) {
                        if (this.mag > 0) { this.fireT = this.def.cd * rand(0.9, 1.2); this.shoot(); }
                        else if (this.reserve > 0) { this.reloading = true; this.reloadT = 2.0; playFileSfx('reload', 0.7, rand(0.95, 1.05), this.pos.x, this.pos.y); }
                    }
                }
            }
            if (d > this.def.range * 0.8 && squadCommand !== 'hold') this.moveToward(this.target.pos, dt);
        } else {
            if (breaking) { this.engageT = 0; this.engageTarget = null; this.lastSeenTarget = null; this.breakT = 2.5; }
            if (squadCommand === 'hold') this.lastSeenTarget = null;   // HOLD: stand your ground, never give chase
            this.target = null;
            /* pathfind to a target we lost sight of, then fall back to formation */
            if (this.lastSeenTarget) {
                const dLS = Math.hypot(this.lastSeenTarget.x - this.pos.x, this.lastSeenTarget.y - this.pos.y);
                this.idleT = 0; this.idleLookT = 0;
                if (dLS < 3) this.lastSeenTarget = null;
                else this.moveToward(this.lastSeenTarget, dt);
            } else {

                const d = Math.hypot(spot.x - this.pos.x, spot.y - this.pos.y);
                if (d > 1.1) {
                    this.idleT = 0; this.idleLookT = 0;
                    this.moveToward(spot, dt);

                    if (this.idleT > 5) {
                        /* stopped 5s+ → idle behaviour: randomly look around */
                        this.idleLookT -= dt;
                        if (this.idleLookT <= 0) { this.idleLookT = 1.5 + rand(2.5); this.idleLookAngle = rand(TAU); }
                        this.turnTo(-this.idleLookAngle);
                    } else {
                        /* face where we last moved (not the player) */
                        this.turnTo(-this.lastMoveAngle);

                /* idle sway */
                this.animT += dt * 2;
                this.mesh.rotation.x = Math.sin(this.animT) * 0.02;
            }

        this.z = terrainHeight(this.pos.x, this.pos.y);
        const walking = (this.target && Math.hypot(this.target.pos.x - this.pos.x, this.target.pos.y - this.pos.y) > this.def.range * 0.8) || (!this.target && Math.hypot(spot.x - this.pos.x, spot.y - this.pos.y) > 1.1);
        this.animT += dt * (walking ? 10 : 3);
        const stride = walking ? Math.sin(this.animT) * 0.34 : 0;
        const legs = this.mesh.userData.legs || [];
        for (let i = 0; i < legs.length; i++) legs[i].rotation.y = i ? -stride : stride;
        const rifle = this.mesh.getObjectByName('squadRifle');
        const aiming = !!this.target && !this.reloading;
        if (rifle) {
            rifle.rotation.y = lerp(rifle.rotation.y, aiming ? 0 : Math.PI / 2, 0.18);
            rifle.position.z = lerp(rifle.position.z, aiming ? 1.20 : 1.0, 0.18);
        }
        super.update();
    }
    turnTo(ang) {                    // smoothly rotate toward a target facing (shortest arc)
        let diff = ang - this.angle;
        diff = ((diff % TAU) + TAU) % TAU;

        this.turnTo(-facing);
        const sp = Math.max(4.8, (player.lastSpeed || 5.2) * 0.94) * speedMult;   // nearly keep pace with the player (incl. sprint)
        let nx = this.pos.x + Math.cos(facing) * sp * dt;
        let ny = this.pos.y + Math.sin(facing) * sp * dt;
        const curZ = terrainHeight(this.pos.x, this.pos.y);
        if (terrainHeight(nx, ny) <= curZ + MAX_STEP) { this.pos.x = nx; this.pos.y = ny; }

    incomingThreat() {

        for (const grenade of grenades) if (grenade.life < 1.2) consider(grenade.position.x, grenade.position.y, 14);
        for (const shot of enemyShots) consider(shot.position.x, shot.position.y, 7);
        for (const glob of acid) consider(glob.position.x, glob.position.y, 7);
        for (const pool of acidPools) consider(pool.position.x, pool.position.y, pool.radius + 2.2);
        for (const enemy of enemies) {
            if (enemy.dead || enemy.dying || !enemy.meleeRange || enemy.attackT > 0.55) continue;
            consider(enemy.pos.x, enemy.pos.y, enemy.meleeRange + 2.4);

    }

        if (squadCommand === 'hold') { this.evadeT = 0; return false; }

            this.evadeT -= dt;

        if (!threat || this.evadeCd > 0) return false;
        this.evadeCd = 0.8 + rand(0.7);
        if (Math.random() > 0.55) return false;   // deliberate imperfection: they evade only sometimes
        const away = Math.atan2(this.pos.y - threat.y, this.pos.x - threat.x) + rand(-0.55, 0.55);
        const distance = 4.5 + rand(2.5);
        const x = clamp(this.pos.x + Math.cos(away) * distance, 2, WORLD - 2);
        const y = clamp(this.pos.y + Math.sin(away) * distance, 2, WORLD - 2);
        this.evadePos = isInsideSolid(x, y) ? LJS.vec2(this.pos.x - Math.cos(away) * distance, this.pos.y - Math.sin(away) * distance) : LJS.vec2(x, y);

    }
    acquireTarget() {

        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (e.dead || e.dying || e.unburrowing) continue;   // ignore still-burrowed creatures
            const d = Math.hypot(e.pos.x - this.pos.x, e.pos.y - this.pos.y);
            if (d < bestD && hasLOS(this.pos.x, this.pos.y, e.pos.x, e.pos.y, 0.6)) { bestD = d; best = e; }

        this.mag--;
        const pellets = this.def.pellets || 1;   // shotguns fire a spread of pellets per trigger pull
        const ox = this.pos.x, oy = this.pos.y, oz = this.z + 1.25;
        const horizontal = Math.hypot(e.pos.x - ox, e.pos.y - oy);
        const targetZ = e.z + (e.type === 'boss' ? 2.4 : e.type === 'drone' ? 1.2 : 0.8);
        const baseFacing = Math.atan2(e.pos.y - this.pos.y, e.pos.x - this.pos.x);
        const basePitch = Math.atan2(targetZ - oz, horizontal);
        const spread = this.def.acc * (pellets > 1 ? 2.6 : 1);   // shotgun pellets scatter widely
        for (let i = 0; i < pellets; i++) {
            const facing = baseFacing + rand(-spread, spread);
            const pitch = basePitch + rand(-spread, spread) * 0.45;
            const dx = Math.cos(facing) * Math.cos(pitch), dy = Math.sin(facing) * Math.cos(pitch), dz = Math.sin(pitch);
            spawnShot(ox, oy, oz, dx, dy, dz, this.def.dmg * rand(0.9, 1.1), this.def.color, 'squad');
        }
        playFileSfx('laserShot', 0.4, rand(0.95, 1.05), this.pos.x, this.pos.y);
    }
    destroy(immediate) {
        const i = squadMembers.indexOf(this);
        if (i >= 0) squadMembers.splice(i, 1);
        super.destroy(immediate);
    }
}

function segIntersectsRect(ax, ay, bx, by, rx0, ry0, rx1, ry1) {
    /* Liang-Barsky 2D segment-AABB intersection */
    let t0 = 0, t1 = 1;
    const dx = bx - ax, dy = by - ay;
    const p = [-dx, dx, -dy, dy], q = [ax - rx0, rx1 - ax, ay - ry0, ry1 - ay];
    for (let i = 0; i < 4; i++) {
        if (p[i] === 0) { if (q[i] < 0) return false; }
        else {
            const t = q[i] / p[i];
            if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
            else { if (t < t0) return false; if (t < t1) t1 = t; }
        }
    }
    return true;
}

function hasLOS(x0, y0, x1, y1, margin) {
    const d = Math.hypot(x1 - x0, y1 - y0);
    if (d < 1) return true;
    /* solid structures (walls, relays, trees) block line of sight */
    for (let i = 0; i < SOLIDS.length; i++) {
        const s = SOLIDS[i];
        if (segIntersectsRect(x0, y0, x1, y1, s.x0, s.y0, s.x1, s.y1)) return false;
    }
    const steps = Math.ceil(d / 4);
    for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const x = lerp(x0, x1, t), y = lerp(y0, y1, t);
        const th = terrainHeight(x, y);
        const h = lerp(terrainHeight(x0, y0) + 1.5, terrainHeight(x1, y1) + 1.5, t);
        if (th > h + margin) return false;
    }
    return true;
}

function issueCommand(cmd) {
    squadCommand = cmd;

    if (cmd === 'assist') notify('SQUAD: form up — ASSIST PLAYER', '#7ad87a');
    else if (cmd === 'spread') notify('SQUAD: break and SPREAD', '#7ad8d8');
    else notify('SQUAD: HOLD POSITION', '#d8d87a');

}

/* ═══════════════════════════════════════════════════════════════════════════
   EFFECTS (impacts, ship)
   ═══════════════════════════════════════════════════════════════════════════ */
const impacts = [];
function spawnImpact(x, y, z, colorHex, size = 1) {
    if (impacts.length > 40) return;
    const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 });
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.22 * size, 6, 5), mat);
    m.position.set(x, y, z);
    scene.add(m);
    impacts.push({ mesh: m, mat, life: 0.35, base: 0.22 * size });
    emitSparks(x, y, z, colorHex, size > 1 ? 7 : 4);   // bright sparks instead of a big hit-flash
}
function updateImpacts(dt) {
    for (let i = impacts.length - 1; i >= 0; i--) {
        const f = impacts[i];
        f.life -= dt;
        if (f.life <= 0) {
            scene.remove(f.mesh); f.mat.dispose();
            impacts.splice(i, 1);
            continue;
        }
        const t = f.life / 0.35;
        f.mesh.scale.setScalar(1 + (1 - t) * 3);
        f.mat.opacity = t;
    }
}

/* impact sparks — short bright streaks that burst outward and fade (replaces the big hit-flash) */
const sparks = [];
function emitSparks(x, y, z, colorHex, n = 5) {
    for (let i = 0; i < n && sparks.length < 160; i++) {
        let vx = rand(-1, 1), vy = rand(-1, 1), vz = rand(-1, 1);
        const vl = Math.max(0.001, Math.hypot(vx, vy, vz));
        vx /= vl; vy /= vl; vz /= vl;
        const sp = rand(3, 8);
        const line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
            new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 1 })
        );
        line.position.set(x, y, z);
        scene.add(line);
        sparks.push({ line, vx: vx * sp, vy: vy * sp, vz: vz * sp, life: 0.28 });
    }
}
function updateSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.life -= dt;
        if (s.life <= 0) {
            scene.remove(s.line); s.line.geometry.dispose(); s.line.material.dispose();
            sparks.splice(i, 1);
            continue;
        }
        s.line.position.x += s.vx * dt;
        s.line.position.y += s.vy * dt;
        s.line.position.z += s.vz * dt;
        const pos = s.line.geometry.attributes.position;
        pos.setXYZ(0, -s.vx * 0.05, -s.vy * 0.05, -s.vz * 0.05);
        pos.setXYZ(1, s.vx * 0.05, s.vy * 0.05, s.vz * 0.05);
        pos.needsUpdate = true;
        s.line.material.opacity = clamp(s.life / 0.28, 0, 1);
    }
}

/* throwable grenades — homing electricshock projectiles with a 16 m sky-blue AoE burst */
const grenades = [];
/* jagged sky-blue lightning arcs radiating from an electric blast */
const electricArcs = [];
function emitElectricArcs(x, y, z, n, radius, colorHex) {
    for (let i = 0; i < n && electricArcs.length < 40; i++) {
        const ang = rand(TAU), tilt = rand(-0.6, 0.6);
        const c = Math.cos(tilt);
        const dir = new THREE.Vector3(Math.cos(ang) * c, Math.sin(ang) * c, Math.sin(tilt));
        const segs = 5, step = radius / segs;
        const pts = [new THREE.Vector3()];
        for (let s = 1; s <= segs; s++) {
            pts.push(new THREE.Vector3(
                dir.x * step * s + rand(-0.4, 0.4),
                dir.y * step * s + rand(-0.4, 0.4),
                dir.z * step * s + rand(-0.25, 0.25)
            ));
        }
        const line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 1 })
        );
        line.position.set(x, y, z);
        scene.add(line);
        electricArcs.push({ line, life: 0.32, maxLife: 0.32 });
    }
}
function updateElectricArcs(dt) {
    for (let i = electricArcs.length - 1; i >= 0; i--) {
        const a = electricArcs[i];
        a.life -= dt;
        if (a.life <= 0) {
            scene.remove(a.line); a.line.geometry.dispose(); a.line.material.dispose();
            electricArcs.splice(i, 1);
            continue;
        }
        a.line.material.opacity = clamp(a.life / a.maxLife, 0, 1);
    }
}
class Grenade extends THREE.Group {
    constructor(x, y, z, vx, vy, vz) {
        super();
        this.vx = vx; this.vy = vy; this.vz = vz;
        this.life = 2.0;
        this.homeT = 0.18;   // brief delay before homing kicks in so the throw feels natural
        /* electricshock grenade — sky-blue emissive body + pulsing charge glow */
        this.mat = mat(0x2f6a8a, { metalness: 0.5, roughness: 0.35, emissive: 0x1f9fd0, emissiveIntensity: 1.3 });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), this.mat);
        this.add(body);
        this.glow = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), mat(0x66e0ff, { emissive: 0x55ddff, emissiveIntensity: 2.2, transparent: true, opacity: 0.5, depthWrite: false }));
        this.add(this.glow);
        this.position.set(x, y, z);
        scene.add(this);
        grenades.push(this);
    }
    nearestTarget() {
        let best = null, bestD = 45;
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (e.dead || e.dying) continue;
            const d = Math.hypot(e.pos.x - this.position.x, e.pos.y - this.position.y);
            if (d < bestD) { bestD = d; best = e; }
        }
        return best;
    }
    update(dt) {
        this.life -= dt;
        this.homeT -= dt;
        const tgt = this.nearestTarget();
        if (tgt && this.homeT <= 0) {
            /* home in on the nearest hostile (horizontal + vertical steering) */
            const dx = tgt.pos.x - this.position.x;
            const dy = tgt.pos.y - this.position.y;
            const dz = (tgt.z + 0.6) - this.position.z;
            const d = Math.max(0.001, Math.hypot(dx, dy, dz));
            const steer = 14;
            this.vx += (dx / d) * steer * dt;
            this.vy += (dy / d) * steer * dt;
            this.vz += (dz / d) * steer * dt;
            const sp = Math.hypot(this.vx, this.vy, this.vz);
            const maxSp = 26;
            if (sp > maxSp) { this.vx *= maxSp / sp; this.vy *= maxSp / sp; this.vz *= maxSp / sp; }
        }
        this.vz -= 24 * dt;
        this.position.x += this.vx * dt;
        this.position.y += this.vy * dt;
        this.position.z += this.vz * dt;
        const gh = terrainHeight(this.position.x, this.position.y) + 0.14;
        if (this.position.z < gh) { this.position.z = gh; this.vz *= -0.35; this.vx *= 0.65; this.vy *= 0.65; }
        this.glow.material.opacity = 0.35 + Math.sin(LJS.time * 22) * 0.15;
        if (isInsideSolid(this.position.x, this.position.y) || this.life <= 0) this.explode();
    }
    explode() {
        const x = this.position.x, y = this.position.y, z = this.position.z;
        /* sky-blue electric burst */
        const RAD = 16;
        const ENEMY_DAMAGE = 400;
        const FRIENDLY_DAMAGE = 15;
        const MIN_DAMAGE_SCALE = 0.25;
        const blastDamage = (base, distance) => Math.round(base * (1 - (1 - MIN_DAMAGE_SCALE) * distance / RAD));
        spawnImpact(x, y, z, 0x66e0ff, 5);
        emitSparks(x, y, z, 0x99eeff, 28);
        emitElectricArcs(x, y, z, 14, RAD, 0x9ff2ff);
        playFileSfx('explode', 0.9, 1, x, y);
        player.kick += 0.05;   // small camera shake
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (e.dead || e.dying) continue;
            const d = Math.hypot(e.pos.x - x, e.pos.y - y);
            if (d < RAD) e.takeDamage(blastDamage(ENEMY_DAMAGE, d));
        }
        const pd = Math.hypot(player.pos.x - x, player.pos.y - y);
        if (pd < RAD) playerTakeDamage(blastDamage(FRIENDLY_DAMAGE, pd), false);
        for (const member of squadMembers) {
            if (member.downed) continue;
            const d = Math.hypot(member.pos.x - x, member.pos.y - y);
            if (d < RAD) member.takeDamage(blastDamage(FRIENDLY_DAMAGE, d));
        }
        const i = grenades.indexOf(this);
        if (i >= 0) grenades.splice(i, 1);
        scene.remove(this);
    }
}
function updateGrenades(dt) {
    for (let i = grenades.length - 1; i >= 0; i--) grenades[i].update(dt);
}
function throwGrenade() {
    if (player.grenadeCd > 0) return;
    if (player.grenades <= 0) { notify('No grenades left', '#ffaa44'); playFileSfx('accessDeny', 0.4); return; }
    player.grenades--;
    player.grenadeCd = 0.6;
    playSnd(sfx.grenade, 0.6);
    const fwdX = Math.cos(player.yaw) * Math.cos(player.pitch);
    const fwdY = Math.sin(player.yaw) * Math.cos(player.pitch);
    const fwdZ = Math.sin(player.pitch);
    new Grenade(player.pos.x + fwdX * 0.6, player.pos.y + fwdY * 0.6, camera.position.z - 0.2, fwdX * 15, fwdY * 15, fwdZ * 15 + 7);
}

/* fast projectile bolts (replaces hit-scan for player + squad laser fire) */
const shots = [];
function spawnShot(ox, oy, oz, dx, dy, dz, dmg, color, owner) {
    const dir = new THREE.Vector3(dx, dy, dz).normalize();
    const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 }));
    bolt.scale.set(1, 1, 8);
    const up = new THREE.Vector3(0, 0, 1);
    if (Math.abs(up.dot(dir)) > 0.9999) bolt.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), dir.z < 0 ? Math.PI : 0);
    else bolt.quaternion.setFromUnitVectors(up, dir);
    scene.add(bolt);
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 5), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 }));
    scene.add(glow);
    shots.push({ x: ox, y: oy, z: oz, px: ox, py: oy, dx: dir.x, dy: dir.y, dz: dir.z, speed: 85, life: 1.8, dmg, color, owner, bolt, glow });
}
function updateShots(dt) {
    for (let i = shots.length - 1; i >= 0; i--) {
        const s = shots[i];
        const step = s.speed * dt;
        s.px = s.x; s.py = s.y;
        s.x += s.dx * step; s.y += s.dy * step; s.z += s.dz * step;
        s.life -= dt;
        s.bolt.position.set(s.x, s.y, s.z);
        s.glow.position.set(s.x, s.y, s.z);
        let dead = s.life <= 0;
        if (s.z < terrainHeight(s.x, s.y) + 0.12) {
            spawnImpact(s.x, s.y, terrainHeight(s.x, s.y) + 0.15, s.color, 1);
            boltImpactSfx(s.x, s.y);
            dead = true;
        }
        /* solid obstacle hit (bug #1) — walls, relays, structures */
        if (!dead && (isInsideSolid(s.x, s.y) || isInsideSolid((s.px + s.x) / 2, (s.py + s.y) / 2))) {
            spawnImpact(s.x, s.y, s.z, s.color, 1);
            boltImpactSfx(s.x, s.y);
            dead = true;
        }
        if (!dead) {
            let hit = null, bestD = 1e9;
            for (const e of enemies) {
                if (e.dead || e.dying) continue;
                const d = Math.hypot(e.pos.x - s.x, e.pos.y - s.y) + Math.abs(e.z + 0.8 - s.z) * 0.6;
                if (d < e.hitRadius + 0.4 && d < bestD) { bestD = d; hit = e; }
            }
            if (hit) {
                hit.takeDamage(s.dmg);
                if (s.owner === 'player') hitMarkerT = 0.22;
                spawnImpact(s.x, s.y, s.z, 0xbb44ff, 1);
                boltImpactSfx(s.x, s.y);
                dead = true;
            }
        }
        if (dead) {
            scene.remove(s.bolt); s.bolt.geometry.dispose(); s.bolt.material.dispose();
            scene.remove(s.glow); s.glow.geometry.dispose(); s.glow.material.dispose();
            shots.splice(i, 1);
        }
    }
}

const ship = { group: null, state: 'none', t: 0, lights: [] };
function buildShipModel() {
    /* VTOL gunship / dropship — built in a local frame where +x = forward, +y = up,
       +z = right; an inner orient group tilts it so the belly faces the ground */
    const g = new THREE.Group();
    const hull = 0x8b8fa5, hullD = 0x69718c, dark = 0x2b2f3d;
    const HM = (o) => mat(hull, Object.assign({ metalness: 0.55, roughness: 0.42 }, o));

    const body = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.85, 9.5, 4, 1), HM({}));
    body.rotation.z = -Math.PI / 2;       // axis → +x (top = nose end)
    body.rotation.y = Math.PI / 4;        // flat facets with dorsal/ventral ridges
    body.scale.set(1, 1, 1.2);            // a touch wider than tall

    /* sleek 4-sided nose cone */

        nav.position.set(-2.75, -0.16, s * 4.3);

        const sideStrip = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.07, 0.09), mat(0x80d8ff, { emissive: 0x258dff, emissiveIntensity: 1.8, roughness: 0.25 }));

        const rearNav = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), mat(side < 0 ? 0xff4455 : 0x5affcc, { emissive: side < 0 ? 0xff1122 : 0x20ddaa, emissiveIntensity: 2.4 }));
        rearNav.position.set(-5.9, 0.2, side * 1.9); ship.add(rearNav);
    }
    const cockpitStrip = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 0.16), mat(0x9ae8ff, { emissive: 0x3a9dff, emissiveIntensity: 2.0, roughness: 0.2 }));
    cockpitStrip.position.set(3.0, 1.5, 0); ship.add(cockpitStrip);
    const sensor = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), mat(0x66ccff, { emissive: 0x2288cc, emissiveIntensity: 1.4 }));
    sensor.position.set(3.7, 1.55, 0);
    ship.add(sensor);
    const comms = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.15, 6), HDM({ metalness: 0.85, roughness: 0.22 }));
    comms.position.set(-2.4, 2.22, 0); ship.add(comms);
    const commsLight = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), mat(0x76d8ff, { emissive: 0x2f9dff, emissiveIntensity: 1.9 }));
    commsLight.position.set(-2.4, 2.84, 0); ship.add(commsLight);
    const light = new THREE.PointLight(0x88ccff, 2.2, 90, 1.6);
    light.position.set(0, -1.3, 0);
    ship.add(light);
    const beam = new THREE.Mesh(new THREE.ConeGeometry(1.4, 9, 12), mat(0x88ccff, { transparent: true, opacity: 0.2, emissive: 0x66aaff, emissiveIntensity: 0.5, depthWrite: false }));
    beam.rotation.x = Math.PI;            // apex → -y (down)
    beam.position.set(0, -5.0, 0);
    ship.add(beam);
    /* orient: local +y (up) → world +z (up), belly faces the ground */
    const orient = new THREE.Group();
    orient.rotation.x = Math.PI / 2;
    orient.add(ship);
    g.add(orient);
    g.userData.engineGlows = engineGlows;
    return g;
}
function setShipThrusters(shipGroup, active) {
    if (!shipGroup) return;
    for (const flame of (shipGroup.userData.engineGlows || [])) flame.visible = active;
}
function updateShip(dt) {
    if (ship.state === 'none') return;
    if (ship.state === 'descend') {
        ship.t += dt;
        const t = clamp(ship.t / 9, 0, 1);
        ship.group.position.z = lerp(120, 8, smooth(t));
        if (t >= 1) { ship.state = 'hold'; ship.t = 0; }
    } else if (ship.state === 'hold') {
        ship.t += dt;
        if (ship.t > 6) { ship.state = 'leave'; ship.t = 0; }
    } else if (ship.state === 'leave') {
        ship.t += dt;
        const t = clamp(ship.t / 6, 0, 1);
        ship.group.position.z = lerp(8, 130, smooth(t));
        ship.group.rotation.z = t * 0.5;
        if (t >= 1) { ship.state = 'none'; }
    }
    setShipThrusters(ship.group, ship.state === 'descend' || ship.state === 'leave');
}

/* ═══════════════════════════════════════════════════════════════════════════
   RELAYS + OBJECTIVES
   ═══════════════════════════════════════════════════════════════════════════ */
function startDefense(relay) {
    if (relay.powering || relay.powered || relay.offline) return;
    relay.powering = true;
    relay.progress = 0;
    relay.defenseT = relay.R.dur;
    relay.budgetLeft = relay.R.budget;
    activeRelay = relay;
    if (relay.R.id === 1) phase = P.DEFEND_R1;
    else if (relay.R.id === 2) phase = P.DEFEND_R2;
    else phase = P.DEFEND_R3;
    /* The new, more driving track is reserved for the timed relay holds.
       The original combat cue remains available for the vial/extraction finale. */
    music.play('relayCombat', 0.85);
    notify(relay.R.name + ' POWERING UP — hold the ground!', '#ffaa44');
    playSnd(sfx.relayDone, 0.8);
    LJS.vibrate && LJS.vibrate(120);
}
function updateRelays(dt) {
    for (let i = 0; i < relays.length; i++) {
        const r = relays[i];
        r.ringAngle += dt * (r.powering ? 2.4 : 0.4);
        r.model.ring.rotation.z = r.ringAngle;
        if (r.powering) {
            r.defenseT -= dt;
            r.progress = 1 - clamp(r.defenseT / r.R.dur, 0, 1);
            /* pulse light */
            const pulse = 0.6 + Math.sin(LJS.time * 6) * 0.5;
            r.model.core.material.emissiveIntensity = 0.6 + r.progress * 2.0 + pulse * 0.4;
            r.model.ring.material.emissiveIntensity = 0.4 + r.progress * 1.2;
            if (r.defenseT <= 0) {
                r.powering = false; r.powered = true;
                r.model.core.material.emissiveIntensity = 2.2;
                r.model.core.material.emissive.setHex(0x44ffcc);
                r.model.core.material.color.setHex(0x66ffcc);
                scatterHorde();
                playSnd(sfx.relayDone, 0.9);
                notify(r.R.name + ' POWERED — objective secure', '#66ffcc');
                onRelayComplete(r);
            }
        }
    }
}
function scatterHorde() {
    for (const e of enemies) {
        if (e.dead || e.dying || e.ambient) continue;   // only the defense horde breaks — wild wanderers keep their own behavior
        e.scatter = LJS.vec2(e.pos.x + rand(-1, 1), e.pos.y + rand(-1, 1)).add(
            LJS.vec2(Math.cos(rand(TAU)), Math.sin(rand(TAU))).scale(60));
        e.fleeT = 0;
    }
}
function onRelayComplete(r) {
    if (r.R.id === 1 && phase === P.DEFEND_R1) { phase = P.MOVE_R2; music.play('safe', 0.7); notify('RELAY ALPHA ONLINE — advance to Beta', '#66ffcc'); }
    else if (r.R.id === 2 && phase === P.DEFEND_R2) { phase = P.MOVE_R3; music.play('safe', 0.7); notify('RELAY BETA ONLINE — advance to Gamma', '#66ffcc'); }
    else if (r.R.id === 3 && phase === P.DEFEND_R3) { phase = P.MOVE_FAC; music.play('safe', 0.7); notify('RELAY GAMMA ONLINE — the facility is ahead', '#66ffcc'); }
    activeRelay = null;
}

/* ─── pickups ───────────────────────────────────────────────────────────── */
function updatePickups(dt) {
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        if (p.taken) continue;
        p.t += dt;
        p.group.position.z = terrainHeight(p.pos.x, p.pos.y) + 0.5 + Math.sin(p.t * 2) * 0.15;
        p.group.rotation.y += dt * 1.2;
        const d = Math.hypot(player.pos.x - p.pos.x, player.pos.y - p.pos.y);
        if (d < 1.6 && !player.dead) {
            p.taken = true;
            scene.remove(p.group);
            pickups.splice(i, 1);
            applyPickup(p.kind);
        }
    }
}
function applyPickup(kind) {
    cacheFound++;
    playSnd(sfx.pickup, 0.8);
    if (kind === 'scrap') {
        const n = randInt(2, 5);   // 2-4 scrap units per pickup
        craft.scraps += n;
        notify('+ SCRAP x' + n, '#e8c060');
    } else if (kind === 'power') {
        craft.powerCells += 1;
        notify('+ POWER CELL (rare)', '#66ffcc');
    } else if (kind === 'grenade') {
        player.grenades = Math.min(MAX_GRENADES, player.grenades + 2);
        notify('+ GRENADES x2', '#ffcc66');
    }
}

/* ─── crafting (materials → medkits & ammo cartridges) ─────────────────── */
const CRAFT_COSTS = { medkit: { s: 6, p: 0 }, ammo: { s: 4, p: 0 }, grenade: { s: 0, p: 1 } };

}
