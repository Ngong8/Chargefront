/* give 1 spare cartridge to a specific squadmate (aim at them + [T]) */
function giveSquadAmmo(m) {
    if (m.downed) { notify(m.def.name + ' is DOWN', '#ffaa44'); playFileSfx('accessDeny', 0.4); return; }
    if (player.weapon.reserve <= 0) { notify('No reserve cartridges to give', '#ffaa44'); playFileSfx('accessDeny', 0.4); return; }
    if (!(m.mag < m.magSize * 0.5 || m.reserve === 0)) { notify(m.def.name + ' is fully loaded', '#7ad87a'); playFileSfx('accessDeny', 0.4); return; }
    player.weapon.reserve--;
    m.reserve++;
    notify('Gave 1 cartridge to ' + m.def.name, '#7ad87a');
    playSnd(sfx.command, 0.7);
}
/* give 1 spare cartridge to the most depleted squadmate (gameplay #9) */
function shareAmmo() {
    let best = null, bestTotal = 1e9;
    for (const m of squadMembers) {
        if (m.downed) continue;
        const needsAmmo = m.mag < m.magSize * 0.5 || m.reserve === 0;   // genuinely low on ammo
        if (!needsAmmo) continue;
        const total = m.mag + m.reserve * m.magSize;                    // least total ammo = neediest
        if (total < bestTotal) { bestTotal = total; best = m; }
    }
    if (!best) { notify('Squad is fully loaded', '#7ad87a'); playFileSfx('accessDeny', 0.4); return; }
    giveSquadAmmo(best);
}

/* ═══════════════════════════════════════════════════════════════════════════
   GAME LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let deployT = 0, doneT = 0;

/* ═══════════════════════════════════════════════════════════════════════════
   INTRO CUTSCENE — a fixed cinematic camera watches the squad's dropship land
   at the Clone Restoration LZ while COMMAND briefs the team (CoD-style subtitles),
   then fades to black and hands control to the player
   ═══════════════════════════════════════════════════════════════════════════ */
const INTRO_SFX = { landing: 'SFX/SpaceshipLandingLoop.wav', landed: 'SFX/SpaceshipLanded.wav' };
const INTRO_BRIEF = [
    'Hostile lifeforms attack on sight. Watch your six.',
    'Infiltrate the bio-research facility. Secure the DNA sample.',
    'Automated drones still patrol inside.',
    'The vault is locked behind three relays: ALPHA, BETA, GAMMA.',
    'Each relay draws creatures when activated.',
    'Restore all relays, breach the vault, secure the sample.',
    'Extract with the vial at the landing zone.'
];
/* each briefing line is shown long enough to read it comfortably */
const INTRO_WPS = 3.2, INTRO_MIN_DUR = 2.8, INTRO_PAD = 0.5, INTRO_GAP = 0.3;
const INTRO_DIALOGUE_DELAY = 2.0;   // no dialogue in the first second — starts after the card crossfades to the ship
const INTRO_DUR = [];                                   // per-line on-screen duration
const INTRO_TIMES = (() => {                            // per-line start times
    const t = [];
    let acc = INTRO_DIALOGUE_DELAY;   // wait for the title card to fade before the first line (no overlap)
    for (let i = 0; i < INTRO_BRIEF.length; i++) {
        const words = INTRO_BRIEF[i].trim().split(/\s+/).length;
        const d = Math.max(INTRO_MIN_DUR, words / INTRO_WPS + INTRO_PAD);
        INTRO_DUR.push(d);
        t.push(acc);
        acc += d + INTRO_GAP;
    }
    return t;
})();
const INTRO_END = INTRO_TIMES[INTRO_TIMES.length - 1] + INTRO_DUR[INTRO_DUR.length - 1];
const INTRO_FADE_START = INTRO_END + 1.2, INTRO_FADE_END = INTRO_FADE_START + 1.5;
const TOUCHDOWN_T = Math.max(20, INTRO_FADE_START - 2.0);  // dropship touches down just before the fade
const INTRO_OBJECTIVE_HOLD = 1.3, INTRO_OBJECTIVE_FADE = 1.15;
const SHOT_TIMES = [0, 4, 8, 12, 16, 19.5, 23];   // exterior + cabin camera cuts (rescaled to the concise cutscene)
const SHIP_LAND_OFF = 2.3;   // parked dropship: center height so the landing skids rest on the ground
const LAND = LJS.vec2(LZ.x - 14, LZ.y + 10);   // the intro dropship touches down here
let intro = null;
let introSfxEl = null;
let introSkipFn = null;   // active during the cutscene — any key/click skips to gameplay
function playIntroSfx(src, loop, vol) {
    if (opts.soundMode === 'music') return;
    stopIntroSfx();
    const el = new Audio(src);
    el.loop = !!loop;
    el.volume = vol;
    const p = el.play(); if (p && p.catch) p.catch(() => {});
    introSfxEl = el;
}
function stopIntroSfx() {
    if (introSfxEl) { try { introSfxEl.pause(); } catch (e) { } introSfxEl = null; }
}
function startIntro() {
    /* start on the black title card (operation keyword + objective); the landing
       ship and its loop SFX only appear once the card fades into the cutscene */
    const g = buildShipModel();
    g.position.set(LAND.x, LAND.y, 130);
    scene.add(g);
    const cabin = buildIntroCabin();
    /* Objective copy starts over a live ship descent, then fades away into it. */
    intro = { t: 0, ship: g, cabin, landed: false, fade: 0, showIdx: -1, stageT: 0, cardAlpha: 1, cutFade: 0 };
    viewModel.visible = false;
    /* the squad only deploys AFTER the cutscene — keep them hidden until then */
    for (const m of squadMembers) m.mesh.visible = false;
    if (menuBackdrop) menuBackdrop.group.visible = false;
    camera.fov = opts.fov || 75; camera.updateProjectionMatrix();
    music.play('safe', 0.45);
    playIntroSfx(INTRO_SFX.landing, true, 0.7);
    const startEl = document.getElementById('start-screen');
    if (startEl) startEl.classList.add('hidden');
    LJS.setInputPreventDefault(true);
    /* any key/click skips the cutscene (listeners removed in endIntro) */
    if (!introSkipFn) {
        introSkipFn = (e) => { if (intro) { if (e && e.type === 'keydown') e.preventDefault(); endIntro(); } };
        /* The START GAME click is still bubbling when this function runs.  Adding
           the window pointer handler synchronously made that same click skip the
           entire intro immediately.  Register after the current event finishes. */
        setTimeout(() => {
            if (intro && introSkipFn) {
                window.addEventListener('keydown', introSkipFn);
                window.addEventListener('pointerdown', introSkipFn);
            }
        }, 0);
    }
}
function updateIntro(dt) {
    const I = intro;
    I.t += dt;
    const t = I.t;
    /* stage 1 — black title card: operation keyword + objective */
    /* stage 2 — the landing cutscene: the ship descends slowly while the camera
       cuts between several cinematic shots and COMMAND reads the briefings */
    I.stageT += dt;
    const lt = I.stageT;
    I.cardAlpha = clamp(1 - (lt - INTRO_OBJECTIVE_HOLD) / INTRO_OBJECTIVE_FADE, 0, 1);
    const landZ = terrainHeight(LAND.x, LAND.y) + SHIP_LAND_OFF;   // skids rest on the ground when parked
    if (I.ship) {
        I.ship.position.z = shipZAt(lt, landZ);
        /* landing gear: stowed while airborne, extends the landing pads when touching down */
        const gearT = clamp((lt - TOUCHDOWN_T) / 0.8, 0, 1);
        const gearPos = (1 - smooth(gearT)) * 1.35;
        for (const gear of (I.ship.userData.landingGear || [])) gear.position.y = gearPos;
        for (const flame of (I.ship.userData.engineGlows || [])) {
            flame.scale.x = 0.88 + Math.sin(LJS.time * 8.0 + flame.position.z) * 0.12;
            flame.material.opacity = 0.68 + Math.sin(LJS.time * 7.0) * 0.16;
        }
        if (lt >= TOUCHDOWN_T && !I.landed) {
            I.landed = true;
            playIntroSfx(INTRO_SFX.landed, false, 0.9);
            spawnImpact(LAND.x, LAND.y, terrainHeight(LAND.x, LAND.y) + 0.3, 0x9a7a5a, 2.5);
        }
        setShipThrusters(I.ship, !I.landed);
    }
    /* which briefing line is currently showing (relative to the landing start) */
    I.showIdx = -1;
    for (let i = 0; i < INTRO_TIMES.length; i++) {
        const st = INTRO_TIMES[i];
        if (lt >= st && lt < st + INTRO_DUR[i]) { I.showIdx = i; break; }
    }
    /* fade to black → hand over to gameplay */
    if (lt > INTRO_FADE_START) I.fade = clamp((lt - INTRO_FADE_START) / (INTRO_FADE_END - INTRO_FADE_START), 0, 1);
    if (lt >= INTRO_FADE_END + 0.25) { endIntro(); return; }
    /* cinematic camera: pick the active shot for this moment of the landing */
    const c = introShotCam(lt, I.ship);
    if (I.cabin) {
        I.cabin.group.visible = c.inside;
        I.cabin.holo.rotation.z = lt * 0.6;
        I.cabin.holoCore.rotation.z = -lt * 0.8;
    }
    I.cutFade = c.cutFade;
    camera.position.set(c.p[0], c.p[1], c.p[2]);
    camera.lookAt(c.t[0], c.t[1], c.t[2]);
    LJS.setCameraPos(LJS.vec2(LAND.x, LAND.y));
}
const INTRO_SHIP_ALT0 = 130;   // dropship starts high above the LZ
/* dropship altitude over the landing — one eased descent (smoothstep) so the
   ship comes in steadily and settles gently onto the ground exactly at TOUCHDOWN_T */
function shipZAt(lt, landZ) {
    if (lt >= TOUCHDOWN_T) return landZ;
    const u = smooth(clamp(lt / TOUCHDOWN_T, 0, 1));   // soft start, gentle deceleration into touchdown
    return lerp(INTRO_SHIP_ALT0, landZ, u);
}
/* camera for the landing cutscene — one framed shot per time segment */
function introShotCam(lt, ship) {
    const sx = ship ? ship.position.x : LAND.x;
    const sy = ship ? ship.position.y : LAND.y;
    const sz = ship ? ship.position.z : 4;
    let si = 0;
    for (let i = 0; i < SHOT_TIMES.length; i++) if (lt >= SHOT_TIMES[i]) si = i;
    let p, t, inside = false;
    const cabin = (x, y, z) => [CABIN_SET.x + x, CABIN_SET.y + y, z];
    switch (si) {
        case 0: p = [sx + 8, sy - 31, sz + 58]; t = [sx, sy, sz]; break;                                      // top-down approach
        case 1: p = cabin(-5.8, -3.25, 3.15); t = cabin(0.15, 0, 2.15); inside = true; break;                   // full squad meeting
        case 2: p = [sx - 66, sy - 58, sz + 31]; t = [sx, sy, sz - 2]; break;                                    // high exterior sweep
        case 3: p = cabin(4.9, -3.35, 2.65); t = cabin(-0.6, 0.15, 1.9); inside = true; break;                   // over the holo-table
        case 4: p = [sx + 30, sy - 46, sz + 10]; t = [sx, sy, sz]; break;                                        // close ship profile
        case 5: p = cabin(-0.8, 3.15, 2.9); t = cabin(0.1, -0.1, 1.95); inside = true; break;                    // reverse cabin angle
        default:
            p = [sx - 8, sy - 15, terrainHeight(sx - 8, sy - 15) + 1.35];
            t = [sx, sy, Math.max(sz + 1.2, terrainHeight(sx, sy) + 5.4)]; break;                                // final bottom-to-top shot
    }
    const sinceCut = lt - SHOT_TIMES[si];
    return { p, t, inside, cutFade: clamp(1 - sinceCut / 0.22, 0, 1) * 0.48 };
}
function endIntro() {
    stopIntroSfx();
    if (intro && intro.ship) {
        /* the squad's dropship parks at the LZ — it is also the extraction ship */
        intro.ship.position.set(LZ.x, LZ.y - 6, terrainHeight(LZ.x, LZ.y - 6) + SHIP_LAND_OFF);
        intro.ship.rotation.z = 0;
        for (const gear of (intro.ship.userData.landingGear || [])) gear.position.y = 0;   // gear fully extended when parked
        ship.group = intro.ship;
        ship.state = 'landed';
    }
    if (intro && intro.cabin) {
        intro.cabin.group.visible = false;
        scene.remove(intro.cabin.group);
    }
    if (introSkipFn) {
        window.removeEventListener('keydown', introSkipFn);
        window.removeEventListener('pointerdown', introSkipFn);
        introSkipFn = null;
    }
    intro = null;
    viewModel.visible = true;
    beginGameplay();
}
/* hand the player control (called at the end of the intro cutscene) */
function beginGameplay() {
    const startEl = document.getElementById('start-screen');
    if (startEl) startEl.classList.add('hidden');
    ensureSfxCtx();                       // also a user gesture → start the SFX context now
    warmFileSfx();                        // pre-decode fallback elements (only if XHR was blocked)
    LJS.setInputPreventDefault(true);   // gameplay → block browser defaults (space/arrow scroll)
    gameActive = true;
    started = true;
    startTime = LJS.time;
    music.play('safe', 0.7);
    deployT = 0;
    gameplayFade = 1;   // fade in from black into gameplay
    viewModel.visible = true;
    for (const m of squadMembers) m.mesh.visible = true;   // squad deploys once gameplay starts
    notify('SQUAD DEPLOYED — 4 operators on the ground', '#d6a6ff');
    notify('Move out to Relay Alpha', '#d6a6ff');
    /* pointer lock must happen inside a user gesture — the intro ended from the game
       loop (not a click), so grab the lock on the next pointer/keydown instead */
    lockOnNextGesture();
}
/* request pointer lock on the next user gesture (the cutscene ends without one) */
function lockOnNextGesture() {
    if (LJS.pointerLockIsActive && LJS.pointerLockIsActive()) return;
    const tryLock = () => {
        requestLock();
        window.removeEventListener('pointerdown', tryLock);
        window.removeEventListener('keydown', tryLock);
    };
    window.addEventListener('pointerdown', tryLock);
    window.addEventListener('keydown', tryLock);
}
/* wrap long briefing lines so they fit the subtitle box (max 3 short lines) */
let introMeasureCtx = null;
function wrapBriefing(text, maxPx, size) {
    if (!introMeasureCtx) introMeasureCtx = document.createElement('canvas').getContext('2d');
    introMeasureCtx.font = `${Math.round(size)}px ${HFONT()}`;
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) {
        const test = cur ? `${cur} ${w}` : w;
        if (cur && introMeasureCtx.measureText(test).width > maxPx) { lines.push(cur); cur = w; }
        else cur = test;
    }
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
}

function gameInit() {
    initFileSfx();
    initWorld();
    window.chargefrontDebug = Object.assign(window.chargefrontDebug || {}, { toggleVisualLighting: toggleVisualDebugLighting });
    buildMapGrid();
    buildRelays();
    buildFacility();
    buildMenuBackdrop();
    buildDecor();   // after relays/facility so tree & rock collision can avoid their solids
    buildViewmodel();
    viewModel.visible = false;  // menu framing uses the nearby squadmate instead of a first-person weapon
    spawnPickups();
    spawnInitialFacilityDrones();

    /* squad */
    for (let i = 0; i < SQUAD_DEFS.length; i++) new SquadMember(SQUAD_DEFS[i], i);

    /* player start */
    player.zPos = terrainHeight(player.pos.x, player.pos.y);
    camera.position.set(player.pos.x, player.pos.y, player.zPos + player.eye);
    camera.lookAt(player.pos.x + Math.cos(player.yaw), player.pos.y + Math.sin(player.yaw), player.zPos + player.eye);

    if (PREVIEW) {
        phase = P.PREVIEW;
        cameraAlign2D(false);
    }
    /* preload music silently */
    for (const k in MUSIC) { const a = new Audio(MUSIC[k]); a.preload = 'auto'; }
}

function gameUpdate() {
    const dt = LJS.timeDelta;
    if (gameplayFade > 0) gameplayFade = Math.max(0, gameplayFade - dt * 1.3);
    if (started && phase !== P.DEAD && phase !== P.DONE) missionTime += dt;   // freeze the clock on the result screen
    music.update();
    updateImpacts(dt);
    updateSparks(dt);
    updateElectricArcs(dt);
    updateGrenades(dt);
    updateShots(dt);
    updateShip(dt);
    if (LJS.keyWasPressed('F8')) toggleVisualDebugLighting();
    if (gameActive && LJS.keyWasPressed('KeyM')) cycleSoundMode();

    for (let i = acid.length - 1; i >= 0; i--) acid[i].update(dt);
    for (let i = acidPools.length - 1; i >= 0; i--) acidPools[i].update(dt);
    for (let i = enemyShots.length - 1; i >= 0; i--) enemyShots[i].update(dt);

    if (PREVIEW) {
        updatePreviewCamera(dt);
        return;
    }
    if (intro) {
        updateIntro(dt);
        return;
    }
    if (!gameActive) {
        updateMenuBackdrop(dt);
        return;
    }

    if (phase === P.DEAD) {
        if (doneT > 2 && LJS.mouseWasPressed(0)) location.reload();
        doneT += dt;
        return;
    }
    if (phase === P.DONE) {
        if (doneT > 3 && LJS.mouseWasPressed(0)) location.reload();
        doneT += dt;
        updateRelays(dt);
        return;
    }
    if (!gameActive) return;

    movePlayer(dt);
    updateWeapon(dt);

    /* squad commands */
    if (LJS.keyWasPressed('Digit1')) issueCommand('assist');
    if (LJS.keyWasPressed('Digit2')) issueCommand('spread');
    if (LJS.keyWasPressed('Digit3')) issueCommand('hold');

    /* crafting: C = craft medkit, H = use medkit (aim at a hurt squadmate to heal them), V = ammo, B = grenade */
    if (LJS.keyWasPressed('KeyC')) craftMedkit();
    if (LJS.keyWasPressed('KeyH')) { const aimed = squadAimInfo(); if (aimed && !aimed.m.downed && aimed.m.hp < aimed.m.maxHp) useMedkitOn(aimed.m); else useMedkit(); }
    if (LJS.keyWasPressed('KeyV')) craftAmmo();
    if (LJS.keyWasPressed('KeyB')) craftGrenade();
    /* grenade (G) + squad ammo share (T — aim at a squadmate to give to them) */
    if (LJS.keyWasPressed('KeyG')) throwGrenade();
    if (LJS.keyWasPressed('KeyT')) { const aimed = squadAimInfo(); if (aimed) giveSquadAmmo(aimed.m); else shareAmmo(); }
    /* debug hotkey: ` teleports the whole squad to the current objective */
    if (LJS.keyWasPressed('Backquote')) debugTeleportToObjective();
    if (player.grenadeCd > 0) player.grenadeCd -= dt;

    /* interact (hold E) */
    heldInteract = LJS.keyIsDown('KeyE') ? heldInteract + dt : 0;
    updateInteract(dt);

    updateHorde(dt);
    updateAmbient(dt);
    updateDrones(dt);
    updateFinaleDrones(dt);
    updateRelays(dt);
    updatePickups(dt);
    updateRevives(dt);
    updateRegen(dt);
    updateFacilityDoors(dt);

    /* muzzle flash */
    if (player.muzzleT > 0) {
        player.muzzleT -= dt;
        muzzleFlash.material.opacity = player.muzzleT > 0 ? 1 : 0;
        muzzleLight.intensity = player.muzzleT > 0 ? 3 : 0;
    }

    /* sun follows player for crisp nearby shadows */
    const px = player.pos.x, py = player.pos.y;
    sun.position.set(px + 260, py - 320, 380);
    sun.target.position.set(px, py, 0);
    sun.target.updateMatrixWorld();

    /* timers */
    damageFlashT = Math.max(0, damageFlashT - dt);
    hitMarkerT = Math.max(0, hitMarkerT - dt);
    wildAlertT = Math.max(0, wildAlertT - dt);
    lastAttackerT = Math.max(0, lastAttackerT - dt);

    /* phase logic */
    updateObjectives(dt);
}

function updateInteract(dt) {
    /* relay activation */
    const rel = relayByPhase();
    if (rel && (phase === P.MOVE_R1 || phase === P.MOVE_R2 || phase === P.MOVE_R3)) {
        if (!rel.powered && !rel.powering) {
            const d = Math.hypot(player.pos.x - rel.pos.x, player.pos.y - rel.pos.y);
            if (d < 7) {
                interactPrompt = 'HOLD [E] — ACTIVATE ' + rel.R.name;
                if (heldInteract > 1.0) startDefense(rel);
                interactProgress = clamp(heldInteract / 1.0, 0, 1);
                return;
            }
        }
    }
    /* vial pickup */
    if (phase === P.SEARCH && vial.group && !vial.picked) {
        const d = Math.hypot(player.pos.x - vial.group.position.x, player.pos.y - vial.group.position.y);
        if (d < 3.0) {
            interactPrompt = 'HOLD [E] — RECOVER CLONE DNA VIAL';
            if (heldInteract > 1.0) pickupVial();
            interactProgress = clamp(heldInteract / 1.0, 0, 1);
            return;
        }
    }
    interactPrompt = null;
    interactProgress = 0;
}

let interactPrompt = null, interactProgress = 0;

function pickupVial() {
    vial.picked = true;
    scene.remove(vial.group);
    vial.light.intensity = 0;
    playSnd(sfx.vial, 0.9);
    music.play('combat', 0.85);
    phase = P.FINALE;
    finaleDroneWaveT = 20;                    // first drone wave comes after ~20s so the squad can leave
    /* one-time finale boss: the Harvester wakes as the vial leaves its pedestal */
    if (!bossSpawned) {
        bossSpawned = true;
        const be = new Infested('boss', LJS.vec2(FACILITY.x, FACILITY.y - 58), player);   // burrowed outside the south gate
        be.setSpawnScale(1.0);
        be.waitingForExit = true;
        notify('THE HARVESTER STIRS BEYOND THE GATE', '#ff55ff');
    }
    notify('CLONE DNA VIAL RECOVERED — evacuate to the landing zone!', '#ffaa44');
    notify('Security drones will hunt you in waves — move out!', '#ffaa44');
}

function updateRevives(dt) {
    for (const m of squadMembers) {
        if (!m.downed) continue;
        const d = Math.hypot(player.pos.x - m.pos.x, player.pos.y - m.pos.y);
        if (d < 2.4 && LJS.keyIsDown('KeyE')) {
            m.reviveT += dt;
            interactPrompt = 'REVIVING ' + m.def.name + '...';
            interactProgress = clamp(m.reviveT / 1.6, 0, 1);
            if (m.reviveT >= 1.6) { m.revive(); m.reviveT = 0; playSnd(sfx.revive, 0.8); notify(m.def.name + ' revived', '#66ffcc'); }
            return;
        }
        m.reviveT = 0;
    }
}

/* shield & low-HP regeneration — player and squad share the same rules:
   - the shield recharges to 100% after SHIELD_REGEN_DELAY s without taking a hit
   - HP below HP_REGEN_CAP slowly recovers up to that cap after HP_REGEN_DELAY s of no damage */
function updateRegen(dt) {
    /* player shield */
    if (player.shieldDelayT > 0) player.shieldDelayT -= dt;
    else if (player.shield < player.maxShield) player.shield = Math.min(player.maxShield, player.shield + SHIELD_REGEN_RATE * dt);
    /* player low-HP regen */
    if (player.hpDelayT > 0) player.hpDelayT -= dt;
    else if (player.hp < HP_REGEN_CAP) player.hp = Math.min(HP_REGEN_CAP, player.hp + HP_REGEN_RATE * dt);
    /* squad — same two mechanisms (downed squadmates wait until revived) */
    for (const m of squadMembers) {
        if (m.downed) { m.shieldDelayT = SHIELD_REGEN_DELAY; m.hpDelayT = HP_REGEN_DELAY; continue; }
        if (m.shieldDelayT > 0) m.shieldDelayT -= dt;
        else if (m.shield < m.maxShield) m.shield = Math.min(m.maxShield, m.shield + SHIELD_REGEN_RATE * dt);
        if (m.hpDelayT > 0) m.hpDelayT -= dt;
        else if (m.hp < HP_REGEN_CAP) m.hp = Math.min(HP_REGEN_CAP, m.hp + HP_REGEN_RATE * dt);
    }
}

function updateObjectives(dt) {
    switch (phase) {
        case P.DEPLOY:
            deployT += dt;
            if (deployT > 3.5) { phase = P.MOVE_R1; notify('Move out — ' + objectiveLine(), '#d6a6ff'); }
            break;
        case P.MOVE_R1: case P.MOVE_R2: case P.MOVE_R3: {
            const rel = relayByPhase();
            if (rel) {
                const d = Math.hypot(player.pos.x - rel.pos.x, player.pos.y - rel.pos.y);
                if (d < 9 && !rel.powered) { /* prompt handled in updateInteract */ }
            }
            break;
        }
        case P.MOVE_FAC:
            if (Math.hypot(player.pos.x - FACILITY.x, player.pos.y - FACILITY.y) < 26) {
                phase = P.SEARCH;
                music.play('facility', 0.7);
                notify('Entering facility — find the CLONE DNA vial', '#d6a6ff');
            }
            break;
        case P.SEARCH:
            vial.bobT += dt;
            animateSpecimenTube(vial.tube, vial.bobT);
            break;
        case P.FINALE: {
            /* the dropship is already parked at the LZ: board it to extract immediately */
            const extractPos = ship.group ? ship.group.position : LZ;
            const dLZ = Math.hypot(player.pos.x - extractPos.x, player.pos.y - extractPos.y);
            if (dLZ < 24) {
                phase = P.DONE;
                doneT = 0;
                music.play('facility', 0.8);
                notify('MISSION COMPLETE — vial secured', '#66ffcc');
                LJS.pointerLockExit();
                notify('Time: ' + formatClock(missionTime) + '  •  Kills: ' + kills, '#d6a6ff');
                enterResultScreen();   // pause the game + start the result screen count-up
            }
            break;
        }
    }
}

function formatClock(t) { const s = Math.floor(t); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* preview cinematic */
let previewT = 0;
function updatePreviewCamera(dt) {
    previewT += dt * 0.06;
    let total = 0;
    for (let i = 0; i < ROUTE.length - 1; i++) total += ROUTE[i].distance(ROUTE[i + 1]);
    let want = (previewT % 1) * total;
    let acc = 0, cx = 0, cy = 0, cwx = 0, cwy = 0;
    for (let i = 0; i < ROUTE.length - 1; i++) {
        const seg = ROUTE[i].distance(ROUTE[i + 1]);
        if (acc + seg >= want) {
            const t = (want - acc) / seg;
            cx = lerp(ROUTE[i].x, ROUTE[i + 1].x, t);
            cy = lerp(ROUTE[i].y, ROUTE[i + 1].y, t);
            cwx = lerp(ROUTE[i + 1].x, ROUTE[i].x, t);
            cwy = lerp(ROUTE[i + 1].y, ROUTE[i].y, t);
            break;
        }
        acc += seg;
    }
    const ang = LJS.time * 0.4;
    camera.position.set(cx + Math.cos(ang) * 70, cy + Math.sin(ang) * 70, terrainHeight(cx, cy) + 55);
    camera.lookAt(cx, cy, terrainHeight(cx, cy) + 4);
    LJS.setCameraPos(LJS.vec2(cx, cy));
    /* mild horde for the cinematic */
    hordeSpawnT -= dt;
    if (hordeSpawnT <= 0 && enemies.length < 24) {
        hordeSpawnT = 4;
        const rel = relays[randInt(relays.length)];
        spawnGroup(rel.pos, 30, 55, 3, 1, randInt(3));
    }
}

/* heading compass — thin strip with N/E/S/W + a center heading marker */
function drawCompass(W, H) {
    const y = 8, bw = Math.min(300, W * 0.4);
    const x0 = W / 2 - bw / 2, x1 = W / 2 + bw / 2;
    LJS.drawRect(LJS.vec2(W / 2, y), LJS.vec2(bw, 14), LJS.rgb(0.04, 0.02, 0.08, 0.62), 0, false, true);
    const dirs = [['N', Math.PI / 2], ['E', 0], ['S', -Math.PI / 2], ['W', Math.PI]];
    for (let k = 0; k < dirs.length; k++) {
        let off = dirs[k][1] - player.yaw;
        off = ((off % TAU) + TAU) % TAU;
        if (off > Math.PI) off -= TAU;
        const sx = W / 2 + (off / (Math.PI / 3)) * (bw / 2);
        if (sx > x0 + 8 && sx < x1 - 8) hudText(dirs[k][0], LJS.vec2(sx, y), 10, LJS.rgb(0.8, 0.9, 1, 0.9), 'center');
    }
    LJS.drawRect(LJS.vec2(W / 2, y), LJS.vec2(2, 14), LJS.rgb(1, 1, 1, 0.95), 0, false, true);
}

function hudBar(cx, y, w, h, pct, color, accent) {
    const ac = accent || LJS.rgb(0.55, 0.85, 1, 0.85);
    LJS.drawRect(LJS.vec2(cx, y), LJS.vec2(w, h), LJS.rgb(0.04, 0.02, 0.08, 0.82), 0, false, true);
    if (pct > 0.01) {
        const fw = Math.max(2, (w - 4) * clamp(pct, 0, 1));
        const fx = cx - w / 2 + 2 + fw / 2;
        LJS.drawRect(LJS.vec2(fx, y), LJS.vec2(fw, h - 4), color, 0, false, true);
        LJS.drawRect(LJS.vec2(fx, y - 1), LJS.vec2(fw, 2), LJS.rgb(1, 1, 1, 0.28), 0, false, true);
    }
    /* outlined frame */
    LJS.drawRect(LJS.vec2(cx, y - h / 2 + 1), LJS.vec2(w, 2), ac, 0, false, true);
    LJS.drawRect(LJS.vec2(cx, y + h / 2 - 1), LJS.vec2(w, 2), ac, 0, false, true);
    LJS.drawRect(LJS.vec2(cx - w / 2 + 1, y), LJS.vec2(2, h), ac, 0, false, true);
    LJS.drawRect(LJS.vec2(cx + w / 2 - 1, y), LJS.vec2(2, h), ac, 0, false, true);
}
/* outlined HUD text (dark stroke for sci-fi readability) */
function hudText(text, pos, size, color, align) {
    LJS.drawTextScreen(text, pos, size, color, Math.max(2, Math.round(size / 5)), LJS.rgb(0.02, 0.01, 0.05, 0.95), align, HFONT());
}
/* corner bracket for sci-fi frames */
function hudCorner(x, y, dx, dy, col) {
    const L = 9, T = 3;
    LJS.drawRect(LJS.vec2(x + dx * L / 2, y), LJS.vec2(L, T), col, 0, false, true);
    LJS.drawRect(LJS.vec2(x, y + dy * L / 2), LJS.vec2(T, L), col, 0, false, true);
}
/* framed sci-fi panel: dark body + accent frame + bright corner brackets */
function hudPanel(cx, cy, w, h, accent) {
    const ac = accent || LJS.rgb(0.4, 0.7, 1, 0.9);
    LJS.drawRect(LJS.vec2(cx, cy), LJS.vec2(w, h), LJS.rgb(0.03, 0.015, 0.06, 0.74), 0, false, true);
    LJS.drawRect(LJS.vec2(cx, cy - h / 2 + 1), LJS.vec2(w, 2), ac, 0, false, true);
    LJS.drawRect(LJS.vec2(cx, cy + h / 2 - 1), LJS.vec2(w, 2), ac, 0, false, true);
    LJS.drawRect(LJS.vec2(cx - w / 2 + 1, cy), LJS.vec2(2, h), ac, 0, false, true);
    LJS.drawRect(LJS.vec2(cx + w / 2 - 1, cy), LJS.vec2(2, h), ac, 0, false, true);
    const b = LJS.rgb(0.75, 0.95, 1, 1);
    hudCorner(cx - w / 2, cy - h / 2, 1, 1, b);
    hudCorner(cx + w / 2, cy - h / 2, -1, 1, b);
    hudCorner(cx - w / 2, cy + h / 2, 1, -1, b);
    hudCorner(cx + w / 2, cy + h / 2, -1, -1, b);
}
/* framed command pill */
function hudPill(cx, cy, w, h, active, accent) {
    const ac = accent || LJS.rgb(0.4, 0.7, 1, 0.9);
    LJS.drawRect(LJS.vec2(cx, cy), LJS.vec2(w, h), active ? LJS.rgb(0.22, 0.45, 0.28, 0.9) : LJS.rgb(0.06, 0.04, 0.12, 0.78), 0, false, true);
    LJS.drawRect(LJS.vec2(cx, cy - h / 2 + 1), LJS.vec2(w, 2), ac, 0, false, true);

    LJS.drawRect(LJS.vec2(cx - w / 2 + 1, cy), LJS.vec2(2, h), ac, 0, false, true);
    LJS.drawRect(LJS.vec2(cx + w / 2 - 1, cy), LJS.vec2(2, h), ac, 0, false, true);
    if (active) LJS.drawRect(LJS.vec2(cx, cy - h / 2 + 1), LJS.vec2(w - 4, 2), LJS.rgb(0.6, 1, 0.6, 0.55), 0, false, true);
}

/* returns the squadmate the player is currently aiming at (crosshair on them) */
function squadAimInfo() {
    const W = LJS.mainCanvasSize.x, H = LJS.mainCanvasSize.y;
    for (const m of squadMembers) {
        const d = Math.hypot(m.pos.x - player.pos.x, m.pos.y - player.pos.y);
        if (d > 5) continue;                                                      // interact only up close (5 m)
        if (!hasLOS(player.pos.x, player.pos.y, m.pos.x, m.pos.y, 0.6)) continue; // behind a hill/wall
        const v = new THREE.Vector3(m.pos.x, m.pos.y, m.z + 1.3).project(camera);
        if (v.z > 1) continue;                                                    // behind the camera
        const sx = (v.x * 0.5 + 0.5) * W, sy = (-v.y * 0.5 + 0.5) * H;
        if (Math.abs(sx - W / 2) < 34 && Math.abs(sy - H / 2) < 34) return { m, sx, sy };
    }
    return null;
}
/* floating nameplate + revive / heal / ammo prompt at the aimed-at squadmate */
function drawSquadAimPrompt(W, H) {
    const info = squadAimInfo();
    if (!info) return;
    const m = info.m, sx = info.sx, sy = info.sy;
    const hpPct = Math.round(m.hp / m.maxHp * 100);
    const shPct = Math.round(m.shield / m.maxShield * 100);
    /* nameplate — show a DOWN tag when they're lying on the ground */
    if (m.downed) {
        hudText(m.def.name + '  —  DOWN', LJS.vec2(sx, sy - 26), 15, LJS.rgb(1, 0.5, 0.5, 1), 'center');
    } else {
        hudText(m.def.name + '  ' + hpPct + '% HP  •  ' + shPct + '% SHLD  •  RES ' + m.reserve, LJS.vec2(sx, sy - 26), 15, LJS.rgb(0.72, 0.92, 1, 1), 'center');
    }
    /* the ammo give prompt (kept so ammo info stays visible under the heal prompt) */
    const needsAmmo = m.mag < m.magSize * 0.5 || m.reserve === 0;
    let ammoLabel, ammoCol;
    if (player.weapon.reserve <= 0) { ammoLabel = 'NO RESERVE'; ammoCol = LJS.rgb(1, 0.7, 0.6, 0.95); }
    else if (needsAmmo) { ammoLabel = '[T] GIVE CARTRIDGE'; ammoCol = LJS.rgb(0.6, 1, 0.6, 1); }
    else { ammoLabel = 'FULLY LOADED'; ammoCol = LJS.rgb(0.62, 0.64, 0.82, 0.95); }
    if (m.downed) {
        /* downed — prompt the revive action (hold E near them) */
        hudText('HOLD [E] TO REVIVE', LJS.vec2(sx, sy + 6), 14, LJS.rgb(1, 0.55, 0.4, 1), 'center');
    } else if (m.hp < m.maxHp) {
        /* hurt — heal prompt first, ammo prompt underneath */
        if (craft.medkits > 0) hudText('[H] USE MEDKIT ON ' + m.def.name, LJS.vec2(sx, sy + 6), 13, LJS.rgb(0.6, 1, 0.6, 1), 'center');
        else hudText('NO MEDKITS — CRAFT WITH [C]', LJS.vec2(sx, sy + 6), 13, LJS.rgb(1, 0.7, 0.6, 0.95), 'center');
        hudText(ammoLabel, LJS.vec2(sx, sy + 20), 13, ammoCol, 'center');
    } else {
        /* full HP — ammo prompt as before */
        hudText(ammoLabel, LJS.vec2(sx, sy + 6), 13, ammoCol, 'center');
    }
}

/* ── combat log: records what the squad does / what happens around them ── */
const combatLog = [];
function logCombat(text, color) {
    combatLog.push({ text, color: color || '#cfe0ff' });   // persistent — only the newest-9 cap trims it
    if (combatLog.length > 9) combatLog.shift();
}
/* centre-left framed panel listing recent combat-log entries (newest on top) */
function drawCombatLog(W, H) {
    const pw = 320, ph = 208;   // fixed vertical sizing — panel always shown
    /* Keep the log between the squad panel and VITALS. On short canvases it contracts
       and shows fewer entries instead of covering the lower panel. */
    const logTop = 140, logBottom = H - 154;
    const logHeight = Math.min(208, Math.max(0, logBottom - logTop));

/* crosshair — drawn LAST so waypoints / markers never overlap it */
function drawCrosshair(W, H) {
    const cx = W / 2, cy = H / 2;
    const crossCols = [[0.9, 0.95, 1], [0.45, 0.9, 1], [1, 0.35, 0.4]];
    const ccA = crossCols[opts.crossColor || 0] || crossCols[0];
    const cs = clamp(opts.crossSize || 1, 0.6, 2);
    const cc = LJS.rgb(ccA[0], ccA[1], ccA[2], 0.9);
    const g = 9 * cs;
    LJS.drawLine(LJS.vec2(cx - g, cy), LJS.vec2(cx - g * 0.33, cy), 2, cc, LJS.vec2(), 0, false, true);
    LJS.drawLine(LJS.vec2(cx + g * 0.33, cy), LJS.vec2(cx + g, cy), 2, cc, LJS.vec2(), 0, false, true);
    LJS.drawLine(LJS.vec2(cx, cy - g), LJS.vec2(cx, cy - g * 0.33), 2, cc, LJS.vec2(), 0, false, true);
    LJS.drawLine(LJS.vec2(cx, cy + g * 0.33), LJS.vec2(cx, cy + g), 2, cc, LJS.vec2(), 0, false, true);
    LJS.drawRect(LJS.vec2(cx, cy), LJS.vec2(3 * cs, 3 * cs), LJS.rgb(ccA[0], ccA[1], ccA[2], 0.6), 0, false, true);
    if (hitMarkerT > 0) {
        LJS.drawLine(LJS.vec2(cx - 12, cy - 12), LJS.vec2(cx - 6, cy - 6), 2.5, LJS.rgb(1, 1, 1, 0.9), LJS.vec2(), 0, false, true);
        LJS.drawLine(LJS.vec2(cx + 12, cy - 12), LJS.vec2(cx + 6, cy - 6), 2.5, LJS.rgb(1, 1, 1, 0.9), LJS.vec2(), 0, false, true);
        LJS.drawLine(LJS.vec2(cx - 12, cy + 12), LJS.vec2(cx - 6, cy + 6), 2.5, LJS.rgb(1, 1, 1, 0.9), LJS.vec2(), 0, false, true);
        LJS.drawLine(LJS.vec2(cx + 12, cy + 12), LJS.vec2(cx + 6, cy + 6), 2.5, LJS.rgb(1, 1, 1, 0.9), LJS.vec2(), 0, false, true);
    }
}

    /* ── BOTTOM-RIGHT: weapon panel — BUL-117 + cartridge count on one row,
         grenade count on the second row, medkit count on the last row ── */
    const w = player.weapon;
    const ax1 = W - 16, weaponPanelTop = H - 122;
    const weaponLabelX = ax1 - 230, weaponValueX = ax1 - 12;
    hudPanel(ax1 - 128, weaponPanelTop + 55, 244, 110, ACCENT);
    /* Each row keeps its label left-aligned and its capacity value right-aligned. */

    hudText(w.reloading ? 'RELOAD' : w.mag + ' / ' + w.magSize, LJS.vec2(weaponValueX, weaponPanelTop + 18), 17, w.reloading ? LJS.rgb(1, 0.8, 0.3) : LJS.rgb(0.55, 0.9, 1), 'right');
    hudText('CARTRIDGES', LJS.vec2(weaponLabelX, weaponPanelTop + 43), 12, LJS.rgb(0.72, 0.72, 0.88), 'left');
    hudText(w.reserve + ' / ' + MAX_PLAYER_RESERVE, LJS.vec2(weaponValueX, weaponPanelTop + 43), 12, LJS.rgb(0.95, 0.85, 0.6), 'right');
    hudText('ESG-180', LJS.vec2(weaponLabelX, weaponPanelTop + 64), 12, LJS.rgb(0.72, 0.72, 0.88), 'left');
    hudText(player.grenades + ' / ' + MAX_GRENADES, LJS.vec2(weaponValueX, weaponPanelTop + 64), 12, LJS.rgb(0.95, 0.85, 0.6), 'right');
    hudText('MEDKITS', LJS.vec2(weaponLabelX, weaponPanelTop + 85), 12, LJS.rgb(0.72, 0.72, 0.88), 'left');

    /* ── BOTTOM-CENTER: command pills + interact ───────────────────── */

        ['2', 'SPREAD', squadCommand === 'spread'],
        ['3', 'HOLD', squadCommand === 'hold'],

        const on = cmd[i][2];

    /* ── TOP-RIGHT: minimap ─────────────────────────────────────────── */

    /* ── objective markers (projected 3D) ───────────────────────────── */
    drawMarkers(W, H);

    /* ── horde markers (screen-space, during defenses) ─────────────── */
    drawEnemyMarkers(W, H);

    /* ── directional damage indicator — points at whoever just hit you ─ */
    if (lastAttackerT > 0) {
        const v = new THREE.Vector3(lastAttackerPos.x, lastAttackerPos.y, terrainHeight(lastAttackerPos.x, lastAttackerPos.y) + 1).project(camera);
        const sx = (v.x * 0.5 + 0.5) * W, sy = (-v.y * 0.5 + 0.5) * H;
        const a = clamp(lastAttackerT / 1.6, 0, 1);
        const col = LJS.rgb(1, 0.22, 0.22, 0.95 * a);
        if (v.z <= 1 && sx > 0 && sx < W && sy > 0 && sy < H) {
            /* attacker on screen — red hit-diamond marks its position */
            LJS.drawRect(LJS.vec2(sx, sy), LJS.vec2(16, 16), col, Math.PI / 4, false, true);
            LJS.drawRect(LJS.vec2(sx, sy), LJS.vec2(5, 5), LJS.rgb(1, 0.9, 0.9, 0.9 * a), 0, false, true);
        } else {
            /* attacker off-screen — red arrow at the screen edge pointing toward it */
            const dx = clamp(sx, 20, W - 20), dy = clamp(sy, 26, H - 26);
            const arrow = (sy < dy) ? '▲' : (sy > dy) ? '▼' : (sx < dx) ? '◀' : '▶';
            hudText(arrow, LJS.vec2(dx, dy), 32, col, 'center');
        }
    }

    /* ── aimed-at squadmate nameplate + ammo prompt ────────────────── */
    drawSquadAimPrompt(W, H);

    /* ── centre-left combat log + crosshair drawn LAST (always on top of waypoints) ── */
    drawCombatLog(W, H);
    drawCrosshair(W, H);
}

/* result screen state — counts up each stat, fading them in one by one with a chime */
let resultScreen = null;
function enterResultScreen() {
    resultScreen = { startMs: performance.now(), chimed: {} };
    LJS.setPaused(true);                       // the mission result screen pauses the game
    const minDelay = phase === P.DEAD ? 2000 : 3000;
    const startMs = performance.now();
    const onInput = () => { if (performance.now() - startMs >= minDelay) location.reload(); };
    document.addEventListener('pointerdown', onInput);
    document.addEventListener('keydown', onInput);
}
const RESULT_STATS = [
    { label: 'TIME',       fmt: (p) => formatClock(missionTime * p) },
    { label: 'KILLS',      fmt: (p) => Math.round(kills * p) },
    { label: 'CARTRIDGES', fmt: (p) => Math.round(totalAmmoCrafted * p) },
    { label: 'MEDKITS',    fmt: (p) => Math.round(totalMedkitsCrafted * p) },
];
function drawResultScreen(W, H) {
    LJS.drawRect(LJS.vec2(W / 2, H / 2), LJS.vec2(W, H), LJS.rgb(0.02, 0.01, 0.04, 0.88), 0, false, true);
    const title = phase === P.DEAD ? 'SQUAD WIPED OUT' : 'MISSION COMPLETE';
    hudText(title, LJS.vec2(W / 2, H / 2 - 34), 52, phase === P.DEAD ? LJS.rgb(1, 0.3, 0.35) : LJS.rgb(0.4, 1, 0.7), 'center');
    /* each stat fades in one by one and its score counts up; a chime plays as each count finishes */
    if (!resultScreen) resultScreen = { startMs: performance.now(), chimed: {} };
    const elapsed = (performance.now() - resultScreen.startMs) / 1000;
    const y0 = H / 2 + 14;
    for (let i = 0; i < RESULT_STATS.length; i++) {
        const appearAt = i * 0.6;                       // staggered fade-in
        const local = elapsed - appearAt;
        if (local <= 0) continue;
        const fade = smooth(clamp(local / 0.35, 0, 1));
        const p = clamp(local / 0.9, 0, 1);             // count-up progress
        const value = RESULT_STATS[i].fmt(p);
        if (p >= 1 && !resultScreen.chimed[i]) {
            resultScreen.chimed[i] = true;
            playFileSfx('resultCount', 0.55);           // chime when the count finishes
        }
        hudText(RESULT_STATS[i].label + '   ' + value, LJS.vec2(W / 2, y0 + i * 24), 18, LJS.rgb(0.9, 0.9, 1, fade), 'center');
    }
    if (phase === P.DONE) {
        hudText('CLONE DNA VIAL SECURED', LJS.vec2(W / 2, H / 2 + 122), 24, LJS.rgb(0.6, 1, 0.85), 'center');
    }
    hudText('CLICK TO RESTART', LJS.vec2(W / 2, H / 2 + 152), 18, LJS.rgb(1, 1, 1, 0.6), 'center');
}

function colorStr(c) { const m = /^#([0-9a-f]{6})$/i.exec(c); if (!m) return LJS.rgb(1, 1, 1); return LJS.rgb(parseInt(m[1].slice(0, 2), 16) / 255, parseInt(m[1].slice(2, 4), 16) / 255, parseInt(m[1].slice(4, 6), 16) / 255); }

function drawMarkers(W, H) {
    const targets = [];
    const rel = relayByPhase();
    if (rel && !rel.powered) targets.push({ pos: rel.pos, label: rel.R.name, color: 0xffcc44 });
    if (phase === P.MOVE_FAC) targets.push({ pos: FACILITY, label: 'FACILITY', color: 0x66ffcc });
    if (phase === P.SEARCH && vial.group) targets.push({ pos: LJS.vec2(vial.group.position.x, vial.group.position.y), label: 'CLONE DNA VIAL', color: 0x66ffcc });
    if (phase === P.FINALE) targets.push({ pos: LZ, label: 'LANDING ZONE', color: 0x66ffcc });
    for (const t of targets) {
        const h = terrainHeight(t.pos.x, t.pos.y);
        const v = new THREE.Vector3(t.pos.x, t.pos.y, h + 3).project(camera);
        if (v.z > 1) continue;
        const sx = (v.x * 0.5 + 0.5) * W, sy = (-v.y * 0.5 + 0.5) * H;
        if (sx < 0 || sx > W || sy < 0 || sy > H) {
            /* off-screen arrow */
            const dx = clamp(sx, 24, W - 24), dy = clamp(sy, 30, H - 40);
            hudText('▼ ' + t.label, LJS.vec2(dx, dy), 13, LJS.rgb(1, 0.85, 0.4), 'center');
            continue;
        }
        const c = LJS.rgb((t.color >> 16 & 255) / 255, (t.color >> 8 & 255) / 255, (t.color & 255) / 255, 0.95);
        LJS.drawRect(LJS.vec2(sx, sy), LJS.vec2(18, 18), LJS.rgb(0.03, 0.01, 0.06, 0.7), 0, false, true);
        LJS.drawRect(LJS.vec2(sx, sy), LJS.vec2(14, 14), c, 0, false, true);
        LJS.drawRect(LJS.vec2(sx, sy), LJS.vec2(6, 6), LJS.rgb(0.05, 0.05, 0.1, 0.9), 0, false, true);
        hudText(t.label, LJS.vec2(sx, sy + 18), 14, c, 'center');
    }
}

/* screen-space markers so the horde is clearly visible during defenses */
function drawEnemyMarkers(W, H) {
    if (opts.markers === false) return;
    const inDefense = isDefensePhase(phase) || phase === P.FINALE;
    const inTravel = !inDefense && (phase === P.DEPLOY || phase === P.MOVE_R1 || phase === P.MOVE_R2 || phase === P.MOVE_R3 || phase === P.MOVE_FAC || phase === P.SEARCH);
    if (!inDefense && !inTravel) return;
    let shown = 0;
    const range = inDefense ? 100 : 80;
    for (const e of enemies) {
        if (e.dead || e.dying) continue;
        const d = Math.hypot(e.pos.x - player.pos.x, e.pos.y - player.pos.y);
        if (inTravel) {
            if (!e.ambient) continue;                          // travel: only wild creatures get markers
            if (!(e.aggroT > 0 || d < 55)) continue;           // spooked OR close enough to spot
        }
        if (shown >= 28) break;
        if (d > range) continue;
        const v = new THREE.Vector3(e.pos.x, e.pos.y, e.z + 2.4).project(camera);
        if (v.z > 1) continue;
        const sx = (v.x * 0.5 + 0.5) * W, sy = (-v.y * 0.5 + 0.5) * H;
        shown++;
        const fade = 0.5 + 0.5 * clamp(1 - d / range, 0, 1);
        const mc = LJS.rgb(1, 0.3, 0.5, fade);
        if (sx < 12 || sx > W - 12 || sy < 14 || sy > H - 12) {
            /* off-screen: edge arrow pointing at the enemy */
            const dx = clamp(sx, 18, W - 18), dy = clamp(sy, 20, H - 20);
            hudText('▲', LJS.vec2(dx, dy), 15, mc, 'center');
        } else {
            /* on-screen: diamond over the enemy */
            LJS.drawRect(LJS.vec2(sx, sy), LJS.vec2(10, 10), mc, Math.PI / 4, false, true);
            LJS.drawRect(LJS.vec2(sx, sy), LJS.vec2(3, 3), LJS.rgb(1, 1, 1, 0.95 * fade), Math.PI / 4, false, true);
        }
    }
}

/* precomputed terrain grid for the minimap (fast lookups instead of sampling noise each frame) */
const MAP_RES = 200;                 // grid cells per WORLD axis (~4 m per cell)
const mapH = new Float32Array(MAP_RES * MAP_RES);
const mapCliff = new Uint8Array(MAP_RES * MAP_RES);
function buildMapGrid() {
    const step = WORLD / MAP_RES;
    for (let iy = 0; iy < MAP_RES; iy++) {
        for (let ix = 0; ix < MAP_RES; ix++) {
            mapH[iy * MAP_RES + ix] = terrainHeight((ix + 0.5) * step, (iy + 0.5) * step);
        }
    }
    for (let iy = 0; iy < MAP_RES; iy++) {
        for (let ix = 0; ix < MAP_RES; ix++) {
            const h = mapH[iy * MAP_RES + ix];
            let steep = 0;
            if (ix > 0 && Math.abs(h - mapH[iy * MAP_RES + ix - 1]) > 5) steep = 1;
            if (ix < MAP_RES - 1 && Math.abs(h - mapH[iy * MAP_RES + ix + 1]) > 5) steep = 1;
            if (iy > 0 && Math.abs(h - mapH[(iy - 1) * MAP_RES + ix]) > 5) steep = 1;
            if (iy < MAP_RES - 1 && Math.abs(h - mapH[(iy + 1) * MAP_RES + ix]) > 5) steep = 1;
            mapCliff[iy * MAP_RES + ix] = steep;
        }
    }
}
/* Liang-Barsky segment clip to an axis-aligned rect → [x0,y0,x1,y1] or null */
function clipSeg(ax, ay, bx, by, x0, y0, x1, y1) {
    let t0 = 0, t1 = 1;
    const dx = bx - ax, dy = by - ay;
    const p = [-dx, dx, -dy, dy], q = [ax - x0, x1 - ax, ay - y0, y1 - ay];
    for (let i = 0; i < 4; i++) {
        if (p[i] === 0) { if (q[i] < 0) return null; }
        else {
            const t = q[i] / p[i];
            if (p[i] < 0) { if (t > t1) return null; if (t > t0) t0 = t; }
            else { if (t < t0) return null; if (t < t1) t1 = t; }
        }
    }
    return [ax + t0 * dx, ay + t0 * dy, ax + t1 * dx, ay + t1 * dy];
}

function drawMinimap(W, H) {
    const size = 150, mx = W - size - 16, my = 18;
    const range = 120;                // meters shown from player
    const scale = (size / 2) / range;
    const ox = mx + size / 2, oy = my + size / 2;
    LJS.drawRect(LJS.vec2(ox, oy), LJS.vec2(size, size), LJS.rgb(0.04, 0.02, 0.08, 0.82), 0, false, true);
    /* terrain features: plains dark, hills purple, cliff faces bright magenta */
    const cell = 3;
    const wStep = WORLD / MAP_RES;
    for (let py = 0; py < size; py += cell) {
        for (let px = 0; px < size; px += cell) {
            const wx = player.pos.x + (px - size / 2) / scale;
            const wy = player.pos.y + (py - size / 2) / scale;
            if (wx < 0 || wy < 0 || wx >= WORLD || wy >= WORLD) continue;
            const idx = Math.floor(wy / wStep) * MAP_RES + Math.floor(wx / wStep);
            const h = mapH[idx];
            let c;
            if (mapCliff[idx]) c = LJS.rgb(0.85, 0.5, 0.95, 0.55);      // cliffs
            else if (h > 22) c = LJS.rgb(0.55, 0.35, 0.75, 0.5);        // hills
            else if (h > 8) c = LJS.rgb(0.35, 0.22, 0.5, 0.5);          // foothills
            else c = LJS.rgb(0.16, 0.10, 0.24, 0.5);                    // plains / valley floor
            LJS.drawRect(LJS.vec2(mx + px + cell / 2, my + py + cell / 2), LJS.vec2(cell + 1, cell + 1), c, 0, false, true);
        }
    }
    const toMini = (x, y) => LJS.vec2(ox + (x - player.pos.x) * scale, oy + (y - player.pos.y) * scale);
    /* exact route path (clipped to the radar bounds) */
    const pathCol = LJS.rgb(1, 0.82, 0.28, 0.95);
    for (let i = 0; i < ROUTE.length - 1; i++) {
        const a = toMini(ROUTE[i].x, ROUTE[i].y), b = toMini(ROUTE[i + 1].x, ROUTE[i + 1].y);
        const s = clipSeg(a.x, a.y, b.x, b.y, mx, my, mx + size, my + size);
        if (s) LJS.drawLine(LJS.vec2(s[0], s[1]), LJS.vec2(s[2], s[3]), 3, pathCol, LJS.vec2(), 0, false, true);
    }
    const dot = (x, y, c, s) => {
        const p = toMini(x, y);
        if (Math.abs(p.x - ox) > size / 2 || Math.abs(p.y - oy) > size / 2) return;
        LJS.drawRect(p, LJS.vec2(s, s), c, 0, false, true);
    };
    /* north-up radar: player is a dot with a heading line pointing where they face */
    const hx = ox + Math.cos(player.yaw) * 6, hy = oy - Math.sin(player.yaw) * 6;
    LJS.drawLine(LJS.vec2(ox, oy), LJS.vec2(hx, hy), 3, LJS.rgb(1, 1, 1, 0.9), LJS.vec2(), 0, false, true);
    LJS.drawRect(LJS.vec2(ox, oy), LJS.vec2(5, 5), LJS.rgb(1, 1, 1), 0, false, true);
    for (let i = 0; i < relays.length; i++) {
        const r = relays[i];
        if (r.powered) dot(r.pos.x, r.pos.y, LJS.rgb(0.4, 1, 0.7), 7);
        else if (r.powering) dot(r.pos.x, r.pos.y, LJS.rgb(1, 0.8, 0.3), 8);
        else dot(r.pos.x, r.pos.y, LJS.rgb(1, 0.75, 0.25), 6);
    }
    dot(FACILITY.x, FACILITY.y, LJS.rgb(0.6, 0.8, 1), 8);
    for (const e of enemies) {
        if (e.dead || e.dying) continue;
        if (e.ambient) dot(e.pos.x, e.pos.y, LJS.rgb(1, 1, 0.3), 5);      // wild creatures = bright yellow
        else dot(e.pos.x, e.pos.y, LJS.rgb(1, 0.25, 0.4), 4);              // horde = red
    }
    for (const m of squadMembers) dot(m.pos.x, m.pos.y, LJS.rgb(0.4, 1, 0.5), 5);
    /* sci-fi frame */
    const mAccent = LJS.rgb(0.42, 0.78, 1, 0.9);
    LJS.drawRect(LJS.vec2(mx + 1, my + size / 2), LJS.vec2(2, size), mAccent, 0, false, true);
    LJS.drawRect(LJS.vec2(mx + size - 1, my + size / 2), LJS.vec2(2, size), mAccent, 0, false, true);
    LJS.drawRect(LJS.vec2(mx + size / 2, my + 1), LJS.vec2(size, 2), mAccent, 0, false, true);
    LJS.drawRect(LJS.vec2(mx + size / 2, my + size - 1), LJS.vec2(size, 2), mAccent, 0, false, true);
    hudCorner(mx, my, 1, 1, LJS.rgb(0.75, 0.95, 1, 1));
    hudCorner(mx + size, my, -1, 1, LJS.rgb(0.75, 0.95, 1, 1));
    hudCorner(mx, my + size, 1, -1, LJS.rgb(0.75, 0.95, 1, 1));
    hudCorner(mx + size, my + size, -1, -1, LJS.rgb(0.75, 0.95, 1, 1));
    /* heading arrow */
    hudText('N', LJS.vec2(ox, my + 4), 11, LJS.rgb(1, 1, 1, 0.85), 'center');
}

function gameUpdatePost() {
    /* animate the facility dressing — drifting dust motes + flickering wall screens */
    if (facilityFx.dust && facilityFx.dustBase) {
        const pos = facilityFx.dust.geometry.attributes.position;
        const base = facilityFx.dustBase;
        for (let i = 0; i < pos.count; i++) {
            pos.setXYZ(i,
                base[i * 3] + Math.sin(LJS.time * 0.3 + i * 1.7) * 1.2,
                base[i * 3 + 1] + Math.cos(LJS.time * 0.25 + i * 2.3) * 1.2,
                base[i * 3 + 2] + Math.sin(LJS.time * 0.6 + i) * 0.8);
        }
        pos.needsUpdate = true;
    }
    for (const s of facilityFx.screens) {
        const flick = 0.72 + Math.sin(LJS.time * (6 + s.seed) + s.seed * 13) * 0.22 + (Math.random() < 0.05 ? 0.45 : 0);
        s.mat.emissiveIntensity = s.base * flick;
    }
}

async function boot() {
    const start = buildOverlays();
    try {
        await LJS.engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost, [], ROOT);
    } catch (e) {
        console.error('engineInit failed', e);
        ROOT.insertAdjacentHTML('beforeend', '<div style="position:fixed;z-index:99;color:#f99;background:#000;padding:12px;inset:0">ERROR: ' + (e && e.message || e) + '</div>');
        return;
    }
    if (PREVIEW) { start.classList.add('hidden'); return; }
    LJS.setInputPreventDefault(false);   // menu visible → allow HTML controls (sliders / checkboxes / selects)
    /* start ambient music on the first user gesture (browsers block autoplay before that) */
    const firstGesture = () => {
        ensureSfxCtx();                       // create/resume the SFX AudioContext inside this gesture
        warmFileSfx();                        // pre-decode fallback elements (only if XHR was blocked)
        if (!music.current) music.play('safe', 0.7);
        if (!windStarted) { windStarted = true; sfx.wind.play(undefined, 0.35, 1); }   // looping ambient wind (audio #20)
        window.removeEventListener('pointerdown', firstGesture);
        window.removeEventListener('keydown', firstGesture);
    };
    window.addEventListener('pointerdown', firstGesture);
    window.addEventListener('keydown', firstGesture);

    /* main menu navigation */
    const el = (id) => document.getElementById(id);
    const showPanel = (id) => {
        ['menu-buttons', 'sound-panel', 'options-panel', 'credits-panel', 'guide-panel', 'quit-note'].forEach((pid) => el(pid).classList.add('hidden'));
        start.querySelector('.cf-title').classList.toggle('hidden', id !== 'menu-buttons');   // title only on the main menu
        if (id) el(id).classList.remove('hidden');
    };
    el('btn-start').addEventListener('click', () => { refreshSoundModeButtons(); showPanel('sound-panel'); });
    document.querySelectorAll('[data-sound-mode]').forEach((button) => button.addEventListener('click', () => {
        setSoundMode(button.dataset.soundMode);
    }));
    el('btn-sound-back').addEventListener('click', () => showPanel('menu-buttons'));
    el('btn-sound-start').addEventListener('click', () => {
        if (opts.soundMode !== 'music') { activateSfxPlayback(); playFileSfx('accessOk', 0.5); }
        start.classList.add('hidden');
        /* fade to black over 2 s, then load the intro briefing cutscene */
        const fade = document.createElement('div');
        fade.style.cssText = 'position:fixed;inset:0;z-index:200;background:#000;opacity:0;pointer-events:none;transition:opacity 2s ease;';
        document.body.appendChild(fade);
        requestAnimationFrame(() => { fade.style.opacity = '1'; });
        setTimeout(() => { if (fade.parentNode) fade.parentNode.removeChild(fade); startIntro(); }, 2000);
    });
    el('btn-options').addEventListener('click', () => showPanel('options-panel'));
    el('btn-guide').addEventListener('click', () => showPanel('guide-panel'));
    el('btn-credits').addEventListener('click', () => showPanel('credits-panel'));
    el('btn-quit').addEventListener('click', () => { try { window.close(); } catch (e) { } showPanel('quit-note'); });
    el('btn-options-back').addEventListener('click', () => {
        showPanel('menu-buttons');
        if (gameActive) {   // came from the pause SETTINGS button → return to pause
            el('start-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.remove('hidden');
        }
    });
    el('btn-guide-back').addEventListener('click', () => {
        showPanel('menu-buttons');
        if (gameActive) {   // came from the pause CONTROLS & GUIDE button → return to pause
            el('start-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.remove('hidden');
        }
    });
    el('btn-credits-back').addEventListener('click', () => showPanel('menu-buttons'));

    /* UI click feedback on every menu button (Soundly interface tap) */
    document.addEventListener('click', (e) => {
        if (e.target && e.target.closest && e.target.closest('.cf-menu-btn')) playFileSfx('uiClick', 0.5);
    });

    /* options wiring (persisted) */
    const optMusic = el('opt-music'), optSfx = el('opt-sfx'), optSens = el('opt-sens'), optInvert = el('opt-invert');
    const optFov = el('opt-fov'), optCrossColor = el('opt-crosscolor'), optCrossSize = el('opt-crosssize'), optMarkers = el('opt-markers');
    optMusic.value = Math.round(opts.musicVol * 100);
    optSfx.value = Math.round(opts.sfxVol * 100);
    optSens.value = Math.round(opts.sens * 100);
    optInvert.checked = opts.invertY;
    optFov.value = Math.round(opts.fov);
    optCrossColor.value = String(opts.crossColor || 0);
    optCrossSize.value = Math.round((opts.crossSize || 1) * 100);
    optMarkers.checked = opts.markers !== false;
    optMusic.oninput = () => { opts.musicVol = optMusic.value / 100; saveOpts(); };
    optSfx.oninput = () => { opts.sfxVol = optSfx.value / 100; LJS.setSoundVolume(opts.soundMode === 'music' ? 0 : opts.sfxVol); saveOpts(); };
    optSens.oninput = () => { opts.sens = optSens.value / 100; saveOpts(); };
    optInvert.onchange = () => { opts.invertY = optInvert.checked; saveOpts(); };
    optFov.oninput = () => { opts.fov = +optFov.value; saveOpts(); };
    optCrossColor.onchange = () => { opts.crossColor = +optCrossColor.value; saveOpts(); };
    optCrossSize.oninput = () => { opts.crossSize = (+optCrossSize.value) / 100; saveOpts(); };
    optMarkers.onchange = () => { opts.markers = optMarkers.checked; saveOpts(); };
    /* pause menu controls */
    const pauseEl = document.getElementById('pause-screen');
    const resumeGame = () => {
        pauseEl.classList.add('hidden');
        el('start-screen').classList.add('hidden');
        LJS.setPaused(false);
        LJS.setSoundVolume(opts.soundMode === 'music' ? 0 : opts.sfxVol);
        LJS.setInputPreventDefault(true);
        requestLock();
    };
    const showPause = () => {
        if (phase === P.DEAD || phase === P.DONE) return;   // game-over overlay owns the screen — no pause buttons
        pauseEl.classList.remove('hidden');
        LJS.setPaused(true);
        LJS.setSoundVolume(0.18);
        LJS.setInputPreventDefault(false);   // menu visible → allow HTML controls
    };
    el('btn-resume').addEventListener('click', resumeGame);
    el('btn-restart').addEventListener('click', () => location.reload());
    el('btn-quit-to-menu').addEventListener('click', () => { gameActive = false; location.reload(); });
    el('btn-pause-options').addEventListener('click', () => {
        pauseEl.classList.add('hidden');
        el('start-screen').classList.remove('hidden');
        showPanel('options-panel');
    });
    el('btn-pause-guide').addEventListener('click', () => {
        pauseEl.classList.add('hidden');
        el('start-screen').classList.remove('hidden');
        showPanel('guide-panel');
    });
    /* pause when pointer lock is lost after starting */
    document.addEventListener('pointerlockchange', () => {
        if (PREVIEW) return;
        if (gameActive && !LJS.pointerLockIsActive()) showPause();
    });
    document.addEventListener('blur', () => {
        if (gameActive) LJS.pointerLockExit();
    });
}

boot().catch((e) => { console.error(e); document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;z-index:99;color:#f99;background:#000;padding:10px">' + e.message + '</div>'); });

/* debug/test hook (harmless — lets you inspect/drive the mission from the console) */
const CF_NAMES = ['PREVIEW', 'DEPLOY', 'MOVE_R1', 'DEFEND_R1', 'MOVE_R2', 'DEFEND_R2', 'MOVE_R3', 'DEFEND_R3', 'MOVE_FAC', 'SEARCH', 'FINALE', 'DONE', 'DEAD'];
window.__cf = {
    get player() { return player; },
    get enemies() { return enemies; },
    get squad() { return squadMembers; },
    get relays() { return relays; },
    get camera() { return camera; },
    getCamFwd() { const v = new THREE.Vector3(); camera.getWorldDirection(v); return [+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)]; },
    get phase() { return phase; },
    get phaseName() { return CF_NAMES[phase] || String(phase); },
    get command() { return squadCommand; },
    get craft() { return craft; },
    get scrap() { return craft.scraps; },
    get cells() { return craft.powerCells; },
    get combatLog() { return combatLog; },
    get sfxKeys() { return Object.keys(SFX_FILES); },
    get fileSfx() { return fileSfx; },
    playSfx(key, vol, pitch, px, py) { playFileSfx(key, vol, pitch, px, py); },
    get sfxDebug() {
        let webBufs = 0; for (const k in fileSfx) webBufs += fileSfx[k].length;
        let audioEls = 0; for (const k in fileSfxAudio) for (const pool of fileSfxAudio[k]) audioEls += pool.length;
        return {
            mode: webBufs > 0 ? 'web-audio' : 'fallback(audio)',
            webAudioBuffers: webBufs, fallbackAudioEls: audioEls, ctxState: sfxCtx ? sfxCtx.state : 'none',
            active: Object.assign({}, sfxActive),
        };
    },
    setPhase(p) { phase = p; },
    setInvulnerable(on = true) {
        player.debugImmortal = !!on;
        if (player.debugImmortal) { player.dead = false; player.hp = player.maxHp; player.shield = player.maxShield; }
        return player.debugImmortal;
    },
    setNoAggro(on = true) { debugNoAggro = !!on; return debugNoAggro; },
    setHud(on = true) { debugHideHud = !on; return !debugHideHud; },
    debugFacility(inside = true) {
        if (!gameActive) beginGameplay();
        phase = inside ? P.SEARCH : P.MOVE_FAC;
        player.debugImmortal = true;
        player.dead = false; player.hp = player.maxHp; player.shield = player.maxShield;
        debugTeleportToObjective();
        return { area: inside ? 'vault interior' : 'south gate exterior', invulnerable: true };
    },
    startGame() { beginGameplay(); },
    startIntroNow() { startIntro(); },
    get intro() { return intro; },
    spawnDrone() { const e = new Infested('drone', player.pos.copy().add(LJS.vec2(rand(-30, 30), rand(-30, 30))), player); e.ambient = true; return e.type; },
    startDefense(i) { const r = relays[i]; if (r) startDefense(r); },
    spawnGroup(n) { spawnGroup(RELAYS[0].pos, 26, 50, n, 1, 0); },
    fire() { fireWeapon(); },
    debugTeleport() { debugTeleportToObjective(); },
    get shots() { return shots; },
    get hits() { return debugHits; },
    craftMedkit() { craftMedkit(); },
    useMedkit() { useMedkit(); },
    craftAmmo() { craftAmmo(); },
    craftGrenade() { craftGrenade(); },
    shareAmmo() { shareAmmo(); },
    giveSquadAmmo(i) { const m = squadMembers[i]; if (m) giveSquadAmmo(m); },
    get medkits() { return craft.medkits; },
    weapon() { return player.weapon; },
    jump() { player.zVel = 7.2; player.grounded = false; },
    move(x, y) { player.pos.x = clamp(player.pos.x + x, 2, WORLD - 2); player.pos.y = clamp(player.pos.y + y, 2, WORLD - 2); player.zPos = terrainHeight(player.pos.x, player.pos.y); },
    insideSolid(x, y) { return isInsideSolid(x, y, 0.4); },
    terrainHeight(x, y) { return terrainHeight(x, y); },
    get solidCount() { return SOLIDS.length; },
    get sceneObjects() { return scene.children.length; },
    get scene() { return scene; },   // debug: full scene graph
    findTree() { for (const c of scene.children) { if (c.type === 'Group' && c.children.length >= 6 && c.children.some(ch => ch.isMesh && ch.geometry && ch.geometry.type === 'IcosahedronGeometry')) return { x: Math.round(c.position.x), y: Math.round(c.position.y), z: Math.round(c.position.z * 10) / 10, parts: c.children.length }; } return null; },
    project(x, y, z) { const v = new THREE.Vector3(x, y, z).project(camera); const W2 = LJS.mainCanvasSize.x, H2 = LJS.mainCanvasSize.y; return { x: Math.round((v.x * 0.5 + 0.5) * W2), y: Math.round((-v.y * 0.5 + 0.5) * H2), z: Math.round(v.z * 100) / 100 }; },
    treeDebug() {
        for (const c of scene.children) {
            if (c.type === 'Group' && c.children.some(ch => ch.isMesh && ch.geometry && ch.geometry.type === 'IcosahedronGeometry')) {
                const meshes = c.children.map(ch => ch.isMesh ? { g: ch.geometry.type, v: ch.visible, s: +ch.scale.x.toFixed(2), m: ch.material && ch.material.color ? '#' + ch.material.color.getHexString() : 'none', bs: ch.geometry.boundingSphere ? +ch.geometry.boundingSphere.radius.toFixed(2) : -1 } : { group: ch.children.length });
                return { pos: [Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z * 10) / 10], scale: +c.scale.x.toFixed(2), visible: c.visible, meshes };
            }
        }
        return null;
    },
    /* cover-art / screenshot staging hooks */
    get renderer() { return threeJS.renderer; },
    render() { if (threeJS && threeJS.renderer) threeJS.renderer.render(scene, camera); },
    pause(on) { LJS.setPaused(!!on); },
    setCoverPose(p) { coverPose = p ? [p[0], p[1], p[2], p[3], p[4], p[5]] : null; },
    hideViewmodel(on) { viewModel.visible = !on; },
};
</script>
</body>
</html>
