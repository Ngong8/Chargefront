<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1">
<title>CHARGE FRONT</title>
<style>
    @font-face { font-family: 'Glitch Slap'; src: url('Glitch Slap.otf') format('opentype'); }

    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0d0514; color:#e8dcf2; }
    #cf-root { position:fixed !important; inset:0 !important; }
    #cf-root canvas { z-index:1 !important; }

    /* ── Overlays ─────────────────────────────── */
    .cf-overlay {
        position:fixed; inset:0; z-index:20;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        background: radial-gradient(ellipse at 50% 30%, rgba(70,20,90,.55), rgba(8,3,14,.96) 70%);
        text-align:center; font-family:'Segoe UI', Arial, sans-serif; user-select:none;
        overflow-y:auto; padding:20px 0;
    }
    .cf-overlay.hidden { display:none; }

    .cf-title {
        font-family:'Glitch Slap','Segoe UI',Arial,sans-serif;
        font-size: clamp(42px, 9vw, 120px);
        letter-spacing:.12em; color:#d6a6ff; text-shadow:0 0 24px rgba(160,60,255,.8), 0 0 60px rgba(120,20,220,.5);
        margin:0 0 6px; line-height:1;
    }
    .cf-sub { font-family:'Glitch Slap','Segoe UI',Arial,sans-serif; letter-spacing:.5em; color:#9c6ad6; font-size:clamp(11px,2vw,18px); margin-bottom:26px; }
    .cf-brief { max-width:640px; margin:0 22px 26px; color:#c9b8d8; font-size:clamp(12px,1.7vw,16px); line-height:1.6; text-shadow:0 2px 8px #000; }
    .cf-brief b { color:#e6c8ff; }
    .cf-briefing { min-height:120px; margin:6px 0 16px; color:#e6d0ff; font-size:clamp(14px,2vw,18px); line-height:1.7; font-style:italic; text-shadow:0 2px 8px #000; }
    .cf-briefing-sub { color:#8a7aa0; font-size:12px; letter-spacing:.25em; margin-bottom:12px; }
    .cf-credit { position:absolute; bottom:10px; width:100%; font-size:11px; color:#7c6a90; pointer-events:none; }

    .hidden { display:none !important; }

    /* ── Main menu ────────────────────────────── */
    .cf-menu { display:flex; flex-direction:column; align-items:stretch; gap:13px; width:320px; margin-top:20px; }
    .cf-menu-btn {
        font-family:'Glitch Slap','Segoe UI',Arial,sans-serif; letter-spacing:.18em;
        font-size:clamp(14px,2vw,20px); color:#e6d0ff; background:rgba(60,24,110,.35);
        box-sizing:border-box; width:320px; min-width:320px; height:48px; padding:0 24px; cursor:pointer;
        border:1px solid rgba(160,100,255,.45); border-radius:8px; transition:background .12s, transform .12s, box-shadow .12s;
    }
    .cf-menu-btn:hover { background:rgba(120,60,220,.5); transform:translateY(-1px); box-shadow:0 0 22px rgba(150,70,255,.55); }
    .cf-menu-btn.danger { color:#ffc9c9; border-color:rgba(255,90,110,.5); }
    .cf-menu-btn.danger:hover { background:rgba(150,30,60,.45); box-shadow:0 0 22px rgba(255,70,100,.45); }
    .cf-menu-btn.back { width:320px; min-width:320px; margin:22px auto 0; display:block; }

    .cf-panel-box {
        background:rgba(12,6,22,.9); border:1px solid rgba(150,90,255,.4); border-radius:12px;
        padding:22px 30px; max-width:560px; width:92%; text-align:left; color:#c9b8d8;
    }
    .cf-panel-box h2 { font-family:'Glitch Slap','Segoe UI',Arial,sans-serif; letter-spacing:.18em; color:#d6a6ff; margin:0 0 14px; text-align:center; }
    .cf-panel-box .row { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:12px 0; font-size:14px; }
    .cf-panel-box input[type=range] { width:220px; accent-color:#9c4dff; }
    .cf-panel-box input[type=checkbox] { width:20px; height:20px; accent-color:#9c4dff; }
    .cf-credits { font-size:13px; line-height:1.7; }
    .cf-credits a { color:#d6a6ff; }
    .cf-quit-note { color:#e6d0ff; font-size:14px; max-width:420px; text-align:center; margin-top:14px; }

    /* ── Controls & Guide panel ───────────────── */
    .cf-guide { display:grid; grid-template-columns:1fr 1fr; gap:0 32px; font-size:13px; line-height:1.75; }
    .cf-guide h3 { font-family:'Glitch Slap','Segoe UI',Arial,sans-serif; letter-spacing:.14em; color:#d6a6ff; margin:16px 0 8px; font-size:15px; }
    .cf-guide h3:first-child { margin-top:0; }
    .cf-guide .key { display:inline-block; min-width:96px; color:#9adcff; font-family:Consolas,'Courier New',monospace; font-size:12px; }
    .cf-guide .sub { color:#9a8ab0; font-size:12px; }
    .cf-guide .cost { color:#e6c8ff; }
    .cf-guide b { color:#e6c8ff; }
    #guide-panel { max-width:780px; width:94%; }

    /* main menu: the Three.js vault scene remains visible behind a quiet UI gradient */
    #start-screen {
        align-items:flex-start;
        text-align:left;
        background:linear-gradient(90deg, rgba(8,3,15,.92) 0%, rgba(12,5,23,.76) 34%, rgba(13,5,24,.28) 65%, rgba(8,3,15,.14) 100%);
    }
    #start-screen .cf-title { align-self:flex-start; margin:10vh 0 0 8vw; text-align:left; transform:translateY(-4vh); }
    #start-screen #menu-buttons { align-self:flex-start; align-items:stretch; margin:3vh 0 0 8vw; }
    #start-screen .cf-panel-box, #start-screen .cf-quit-note { align-self:center; }
    #start-screen .cf-credit { text-align:center; }

    /* pause menu: fully opaque so the frozen gameplay HUD is hidden behind it */
    #pause-screen { background: rgba(7,3,13,0.97); }

    #pause-screen .cf-panel { background:rgba(12,6,22,.92); border:1px solid rgba(150,90,255,.4); border-radius:12px; padding:38px 52px 42px; }
    #pause-screen h2 { font-family:'Glitch Slap','Segoe UI',Arial,sans-serif; letter-spacing:.2em; color:#d6a6ff; margin:0 0 22px; text-align:center; }
    #pause-screen p { color:#c9b8d8; margin:4px 0; }
    #pause-screen .cf-pause-sub { color:#a99cc0; font-size:13px; margin:0 0 18px; }
    #pause-screen .cf-pause-buttons { display:flex; flex-direction:column; align-items:stretch; gap:13px; width:320px; }
    #pause-screen .cf-pause-buttons .cf-menu-btn { min-width:320px; padding:0 24px; }
    @media (max-width: 520px) {
        .cf-menu, #pause-screen .cf-pause-buttons { width:min(320px, calc(100vw - 40px)); }
        .cf-menu-btn, .cf-menu-btn.back, #pause-screen .cf-pause-buttons .cf-menu-btn { width:100%; min-width:0; }
        #start-screen .cf-title, #start-screen #menu-buttons { margin-left:20px; }
    }
    .cf-panel-box select { background:#1a0e2e; color:#e6d0ff; border:1px solid rgba(160,100,255,.45); border-radius:6px; padding:6px 10px; font-size:14px; width:220px; }
    .cf-sound-panel { max-width:700px; text-align:center; }
    .cf-sound-panel p { margin:0 0 18px; line-height:1.55; color:#c9b8d8; }
    .cf-sound-choices { display:flex; gap:10px; justify-content:center; }
    .cf-sound-choices .cf-menu-btn { width:auto; min-width:0; flex:1; padding:0 12px; font-size:clamp(11px,1.5vw,16px); }
    .cf-sound-actions { display:flex; gap:12px; justify-content:center; margin-top:22px; }
    .cf-sound-actions .cf-menu-btn { width:auto; min-width:0; flex:1; margin:0; }
    .cf-menu-btn.selected { background:rgba(120,60,220,.55); border-color:#d6a6ff; box-shadow:0 0 18px rgba(150,70,255,.45); }
    @media (max-width: 520px) { .cf-sound-choices { flex-direction:column; } .cf-sound-choices .cf-menu-btn { width:100%; } }

    /* ── Vignette (cheap post-processing, perf #18) ────────────────── */
    #cf-vignette { position:fixed; inset:0; z-index:10; pointer-events:none;
        box-shadow: inset 0 0 26vmin rgba(5,2,12,.62), inset 0 0 9vmin rgba(20,5,40,.32); }
</style>
</head>
<body>
<div id="cf-root"></div>
<div id="cf-vignette"></div>

<!-- The module script runs first (appends the canvases), then these overlays
     are appended to #cf-root afterwards so they sit on top of the canvas. -->

   CHARGE FRONT
   First-person tactical shooter — LittleJS (engine/input/audio/HUD) +
   Three.js (3D world & models) via the official LittleJS Three.js plugin.

   Mission:  recover a lost clone-DNA vial-pendrive from an abandoned facility
             on a purple-spotted infested planet. Advance a 4-man squad
             (you + ROOK / VEX / KADE), power 3 relays (each power-up draws
             the horde — hold the ground), then extract the vial.

   Music:    "Corrupt Data Stream" / "Safe Space" / "Dreams of a Silver Tower"
             by Tsorthan Grove (opengameart.org) — see Credits.txt
   ═══════════════════════════════════════════════════════════════════════════ */

'use strict';
const PREVIEW = location.search.includes('preview');   // ?preview=1 → cinematic flyover, no input
const ROOT = document.getElementById('cf-root');

/* ─── options (persisted) ──────────────────────────────────────────────── */
const opts = Object.assign({ musicVol: 0.7, sfxVol: 0.55, soundMode: 'full', sens: 1, invertY: false, fov: 75, crossColor: 0, crossSize: 1, markers: true }, (() => { try { return JSON.parse(localStorage['cf_opts'] || '{}'); } catch (e) { return {}; } })());
function saveOpts() { try { localStorage['cf_opts'] = JSON.stringify(opts); } catch (e) { } }

/* ─── engine settings (must run before engineInit) ─────────────────────── */
LJS.setGLEnable(false);            // let three.js own the only WebGL context
LJS.setShowSplashScreen(false);
LJS.setSoundVolume(opts.soundMode === 'music' ? 0 : opts.sfxVol);

const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
const randInt = (a, b = 0) => Math.floor(rand(a, b));
function gaussWeight(x, y, cx, cy, s) { const dx = x - cx, dy = y - cy; return Math.exp(-(dx * dx + dy * dy) / (2 * s * s)); }

const LZ      = LJS.vec2(450,  80);
const FACILITY = LJS.vec2(360, 650);
const RELAYS = [
    { id: 1, name: 'RELAY ALPHA', pos: LJS.vec2(430, 250), dur: 55,  budget: 24, hp: 620, diff: 0 },
    { id: 2, name: 'RELAY BETA',  pos: LJS.vec2(330, 410), dur: 78,  budget: 40, hp: 760, diff: 1 },
    { id: 3, name: 'RELAY GAMMA', pos: LJS.vec2(430, 530), dur: 100, budget: 55, hp: 920, diff: 2 },
];
const ROUTE = [LZ, RELAYS[0].pos, RELAYS[1].pos, RELAYS[2].pos, FACILITY];
const MAX_STEP = 2.6;              // cliff climb limit (metres)

function distToRoute(x, y) {
    let best = 1e9;
    for (let i = 0; i < ROUTE.length - 1; i++) {
        const ax = ROUTE[i].x, ay = ROUTE[i].y, bx = ROUTE[i + 1].x, by = ROUTE[i + 1].y;
        const dx = bx - ax, dy = by - ay;
        const l2 = dx * dx + dy * dy;
        const t = l2 ? clamp(((x - ax) * dx + (y - ay) * dy) / l2, 0, 1) : 0;
        const d = Math.hypot(x - (ax + dx * t), y - (ay + dy * t));
        if (d < best) best = d;
    }
    return best;
}

/* terrain elevation: rolling hills + gentle flanking slopes + a narrow canyon at relay 2.
   The landing zone gets a wide flattened apron so there is no "invisible wall" ring
   boxing the player in at spawn. */
const FLATS = [[450, 80, 62, 0], [430, 250, 30, 0], [330, 410, 30, 0], [430, 530, 30, 0], [360, 650, 48, 0]];
function terrainHeight(x, y) {
    let h = 0;
    h += LJS.noise2D(x * 0.005, y * 0.005) * 4.4;
    h += LJS.noise2D(x * 0.014 + 7, y * 0.014 + 3) * 1.9;
    h += LJS.noise2D(x * 0.05 + 20, y * 0.05 + 11) * 0.6;
    const d = distToRoute(x, y);
    const canyon = gaussWeight(x, y, 330, 410, 70);
    const half = lerp(96, 40, canyon);
    if (d > half) {
        const e = d - half;
        h += Math.min(85, e * 0.9 + e * e * 0.028);   // long gradual climb, not a sheer wall
    }
    for (let i = 0; i < FLATS.length; i++) {
        const w = gaussWeight(x, y, FLATS[i][0], FLATS[i][1], FLATS[i][2]);
        if (w > 0.01) h = h * (1 - w) + FLATS[i][3] * w;
    }
    /* wide landing-zone apron — pull everything near spawn down to level ground */
    const lzw = gaussWeight(x, y, LZ.x, LZ.y, 110);
    if (lzw > 0.01) h *= (1 - lzw);
    return clamp(h, 0, 120);
}

/* ─── materials / geometry helpers (z-up world) ────────────────────────── */
function mat(color, opts) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0.08 }, opts)); }
/* vertical box: w=width(x) d=depth(y) h=height(z) */
function box(w, d, h, color, opts) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
    m.rotation.x = Math.PI / 2;
    return m;
}
function part(g, w, d, h, x, y, z, color, opts) {   // add a vertical box to a group (facing +x)
    const m = box(w, d, h, color, opts);
    m.position.set(x, y, z);
    g.add(m);
    return m;
}
function addTo(group, mesh, x, y, z) { mesh.position.set(x, y, z); group.add(mesh); return mesh; }
const EMISSIVE = (c, i = 1) => ({ emissive: c, emissiveIntensity: i });

    facility:'Music/Dreams of a Silver Tower.ogg',

const music = {
    current: null, el: null, target: 0, fading: [],
    play(name, vol = 1) {
        if (this.current === name && this.el) { this.target = vol; return; }
        if (this.el) this.fading.push(this.el);
        const el = new Audio(MUSIC[name]);
        el.loop = true; el.volume = 0; el.preload = 'auto';
        el.play().catch(() => {});
        this.el = el; this.current = name; this.target = vol;
    },
    update() {
        if (this.el) {
            const t = this.target * opts.musicVol;
            const d = t - this.el.volume;
            if (Math.abs(d) > 0.004) this.el.volume = clamp(this.el.volume + Math.sign(d) * 0.018, 0, 1);
        }
        for (let i = this.fading.length - 1; i >= 0; i--) {
            const el = this.fading[i];
            el.volume = Math.max(0, el.volume - 0.03);
            if (el.volume <= 0.001 || el.paused) { el.pause(); this.fading.splice(i, 1); }
        }
    },
};

const SFX_FILES = {

/* file-based SFX.  Primary path: decode each WAV ONCE into an AudioBuffer (XHR) and play via
   Web Audio BufferSource nodes — near-zero start latency + unlimited overlapping polyphony.
   A pooled <audio>-element fallback is ALSO built eagerly (and PRE-WARMED after the first
   gesture) so SFX always plays even on file:// where Chromium may block/hang XHR; the Web
   Audio path simply takes over once its buffers finish decoding. */
let sfxCtx = null;
const fileSfx = {};                       // key -> AudioBuffer[]   (Web Audio path, preferred)
const sfxDecodeQueue = [];                // {key, data} waiting for the context to exist
const fileSfxAudio = {};                  // key -> Audio[]         (always-available fallback)
let sfxWarmStarted = false;

/* per-key max simultaneous plays — browsers choke on too many overlapping sounds at once.

const SFX_MAX_ACTIVE = { laserShot: 3, reload: 2, creature: 3, bossRoar: 3, enemyDie: 3, unburrow: 3 };
const SFX_MAX_ACTIVE_DEFAULT = 5;
const sfxActive = {};                      // key -> currently-playing count
function sfxReserve(key) {
    const max = SFX_MAX_ACTIVE[key] || SFX_MAX_ACTIVE_DEFAULT;
    const cur = sfxActive[key] || 0;
    if (cur >= max) return false;
    sfxActive[key] = cur + 1;
    return true;
}
function sfxRelease(key) { if ((sfxActive[key] || 0) > 0) sfxActive[key]--; }
function sfxReleaseAfter(key, ms) { setTimeout(() => sfxRelease(key), ms); }

/* distance-based volume falloff (2D world distance to the player); no position = player-local/UI = full volume */
const SFX_MAX_DIST = 130;
function sfxGainFrom(px, py) {
    if (px === undefined || py === undefined) return 1;
    const d = Math.hypot(player.pos.x - px, player.pos.y - py);
    if (d >= SFX_MAX_DIST) return 0;
    return 1 - d / SFX_MAX_DIST;
}

function ensureSfxCtx() {
    if (!sfxCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { sfxCtx = new AC(); } catch (e) { return null; }
        if (sfxDecodeQueue.length) {       // decode everything that finished loading before ctx existed
            for (const job of sfxDecodeQueue.splice(0)) decodeSfxBuffer(job.key, job.data);
        }
    }
    if (sfxCtx.state === 'suspended') sfxCtx.resume().catch(() => {});

}

    try {
        sfxCtx.decodeAudioData(data, (buf) => { if (buf) fileSfx[key].push(buf); }, () => {});
    } catch (e) { }
}
function buildSfxAudioPools() {           // pooled <audio> elements built EAGERLY so SFX always plays
    for (const key in SFX_FILES) {
        fileSfxAudio[key] = SFX_FILES[key].map((src) => {
            const pool = [];
            for (let i = 0; i < 3; i++) { const el = new Audio(src); el.preload = 'auto'; pool.push(el); }
            return pool;
        });

}
function warmFileSfx() {                  // force-decode every element once (silent) so later plays start instantly
    if (sfxWarmStarted) return;
    sfxWarmStarted = true;
    for (const key in fileSfxAudio) {
        for (const pool of fileSfxAudio[key]) {
            for (const el of pool) {
                try {
                    el.volume = 0;
                    const p = el.play();
                    if (p && p.catch) p.catch(() => {});
                    setTimeout(() => { try { el.pause(); el.currentTime = 0; } catch (e) { } }, 160);

    const xhr = new XMLHttpRequest();
    xhr.open('GET', src, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = () => {
        if (!xhr.response || !xhr.response.byteLength) return;

    };

}

    buildSfxAudioPools();                 // always-available fallback path
    for (const key in SFX_FILES) {

    }
}
function playFileSfxAudio(key, vol, pitch) {   // fallback: pooled <audio> elements (pre-warmed); vol is FINAL
    const pools = fileSfxAudio[key];
    if (!pools) return;
    const pool = pools[randInt(pools.length)];
    let el = null;
    for (const c of pool) { if (c.paused || c.ended) { el = c; break; } }

        el.volume = clamp(vol, 0, 1);
        el.playbackRate = pitch;
        if (el.readyState >= 1) { try { el.currentTime = 0; } catch (e) { } }

        if (p && p.catch) p.catch(() => {});
    } catch (e) { }
}
function playFileSfx(key, vol = 0.5, pitch = 1, px, py) {
    if (!soundModeAllows('file', key)) return;
    const gain = sfxGainFrom(px, py);
    if (gain <= 0.02) return;                 // too far to be heard
    if (!sfxReserve(key)) return;             // per-key simultaneous-play cap
    const finalVol = clamp(vol * opts.sfxVol * gain, 0, 1);
    const bufs = fileSfx[key];
    if (bufs && bufs.length > 0) {            // Web Audio path (low latency, polyphonic)
        const ctx = ensureSfxCtx();
        if (ctx) {
            const buf = bufs[randInt(bufs.length)];
            sfxReleaseAfter(key, ((buf.duration || 0.4) / Math.max(0.1, pitch)) * 1000 + 90);

                const src = ctx.createBufferSource();
                src.buffer = buf;
                src.playbackRate.value = pitch;

                g.gain.value = finalVol;

                g.connect(ctx.destination);

function boltImpactSfx(x, y) {

let threeJS, scene, camera, sun, playerLight, debugFillLight;

/* These two sets live far from the playable route.  They use the same renderer as

const MENU_SET = { x: -138, y: -116 };
const CABIN_SET = { x: -104, y: -92 };

function initWorld() {

    sun.shadow.normalBias = 0.02;

    sc.left = -170; sc.right = 170; sc.top = 170; sc.bottom = -170; sc.near = 30; sc.far = 900;
    scene.add(sun);

function cameraAlign2D(on) { threeJS.cameraAlign2D = on; }
function toggleVisualDebugLighting() {
    visualDebugLighting = !visualDebugLighting;
    threeJS.renderer.toneMappingExposure = visualDebugLighting ? 1.30 : 0.78;
    debugFillLight.intensity = visualDebugLighting ? 1.05 : 0;
    sun.intensity = visualDebugLighting ? 0.95 : 0.58;

    if (gameActive) notify(visualDebugLighting ? 'VISUAL DEBUG LIGHTING: ON' : 'VISUAL DEBUG LIGHTING: OFF', visualDebugLighting ? '#bdeaff' : '#aab0d2');

function buildSky() {
    const domeGeo = new THREE.SphereGeometry(1400, 32, 14);
    const pos = domeGeo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const cTop = new THREE.Color(0x241040), cHor = new THREE.Color(0x5a2a6e), cLow = new THREE.Color(0x351646);
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
        v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
        const t = clamp(v.y, -1, 1);
        const c = t > 0 ? cTop.clone().lerp(cHor, t * 0.8) : cLow.clone().lerp(cHor, t * -0.4);
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    domeGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const dome = new THREE.Mesh(domeGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
    dome.renderOrder = -10;
    scene.add(dome);

    scene.background = new THREE.Color(0x2a1440);
    scene.fog = new THREE.Fog(0x2a1440, 40, 280);   // dense haze — far terrain / horde fade out quickly

    /* stars */
    const starN = 900, starPos = new Float32Array(starN * 3), starCol = new Float32Array(starN * 3);
    const sc = new THREE.Color(0xcaa6ff);
    for (let i = 0; i < starN; i++) {
        const a = rand(TAU), e = rand(0.15, 1.25), r = 1350;
        starPos[i * 3] = r * Math.cos(a) * Math.cos(e);
        starPos[i * 3 + 1] = r * Math.sin(a) * Math.cos(e);
        starPos[i * 3 + 2] = r * Math.sin(e) * 0.9 + 60;
        const b = rand(0.5, 1);
        starCol[i * 3] = sc.r * b; starCol[i * 3 + 1] = sc.g * b; starCol[i * 3 + 2] = sc.b * b;
    }
    const stars = new THREE.Points(
        new THREE.BufferGeometry()
            .setAttribute('position', new THREE.BufferAttribute(starPos, 3))
            .setAttribute('color', new THREE.BufferAttribute(starCol, 3)),
        new THREE.PointsMaterial({ size: 2.4, vertexColors: true, fog: false, transparent: true, opacity: 0.85, depthWrite: false })
    );
    scene.add(stars);
}

function terrainColor(wx, wy, h) {
    const n = LJS.noise2D(wx * 0.08 + 5, wy * 0.08 + 9);           // broad region tone
    const n2 = LJS.noise2D(wx * 0.38 + 1, wy * 0.38 + 2);          // infestation blotches
    const n4 = LJS.noise2D(wx * 0.9 + 13, wy * 0.9 + 17);          // fine texture detail
    const n5 = LJS.noise2D(wx * 2.4 + 4, wy * 2.4 + 6);            // micro grain
    /* bright base tint so the purple-spot texture shows through instead of crushing it dark */
    let r = 0.82 + n * 0.12, g = 0.76 + n * 0.12, b = 0.9 + n * 0.1;
    const ht = clamp(h / 24, 0, 1);
    r += ht * 0.08; g += ht * 0.06; b += ht * 0.14;
    /* fine mottling — kept subtle so the texture detail reads */
    const det = (n4 - 0.5) * 0.16 + (n5 - 0.5) * 0.07;
    r += det; g += det * 0.85; b += det * 1.15;
    if (n2 > 0.40) {                                    // glowing infestation blotches
        const t = clamp((n2 - 0.40) / 0.60, 0, 1) * clamp(1.25 - Math.abs(h) / 24, 0, 1);
        r = lerp(r, 0.88, t); g = lerp(g, 0.22, t); b = lerp(b, 1.0, t);
    }
    const n3 = LJS.noise2D(wx * 0.15 + 30, wy * 0.15 + 40);   // dark craters
    if (n3 > 0.5) { const t = (n3 - 0.5) * 1.5; r *= 1 - 0.30 * t; g *= 1 - 0.26 * t; b *= 1 - 0.26 * t; }
    return new THREE.Color(clamp(r), clamp(g), clamp(b));
}

function buildTerrain() {
    /* 2.5 m quads keep point-light shading smooth near the player; the previous
       4 m grid made the terrain's triangle boundaries visible as large patches. */
    const seg = 320;
    const geo = new THREE.PlaneGeometry(WORLD, WORLD, seg, seg);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const uvs = new Float32Array(pos.count * 2);
    const c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
        const wx = pos.getX(i) + WORLD / 2, wy = pos.getY(i) + WORLD / 2;
        const h = terrainHeight(wx, wy);
        pos.setZ(i, h);
        c.copy(terrainColor(wx, wy, h));
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
        /* world-space UVs: u/v = world coords / tile size, so the seamless tile
           repeats evenly over the whole map with no per-chunk seams */
        uvs[i * 2] = wx / TERRAIN_TEXTURE_WORLD_SIZE;
        uvs[i * 2 + 1] = wy / TERRAIN_TEXTURE_WORLD_SIZE;
    }
    geo.computeVertexNormals();
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    /* The terrain tile is the source of the ground's visual pattern.  Do not
       multiply it by the low-frequency vertex colors: doing that creates broad

    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.96, metalness: 0.0 }));
    /* Purple-spot terrain texture.  The fallback is deliberately deterministic
       and uses many small spots, so a failed file:///blob: load never produces
       the old oversized random circles. */
    const configureTerrainTexture = (tex, repeat = 1) => {
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(repeat, repeat);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.magFilter = THREE.NearestFilter;
        /* The supplied PNG is not power-of-two.  Avoid mipmap generation so it
           remains valid on WebGL1 as well as WebGL2 while retaining the pixel
           look. */
        tex.generateMipmaps = false;
        tex.minFilter = THREE.NearestFilter;
        tex.anisotropy = 1;
        tex.needsUpdate = true;
        return tex;
    };
    /* The supplied artwork is a good terrain image but was not authored as a
       repeatable tile: its left/right and top/bottom borders do not match.
       Mirror it into a 2x2 texture.  The joins are now identical pixels, while
       every quadrant still shows the original art rather than a made-up blend.
       Sampling this texture at half repeat preserves the 10 m source-tile scale. */
    const makeSeamlessTerrainTexture = (image, sourceSize) => {
        const cv = document.createElement('canvas');
        cv.width = cv.height = sourceSize * 2;
        const g = cv.getContext('2d');
        g.imageSmoothingEnabled = false;
        g.drawImage(image, 0, 0, sourceSize, sourceSize);
        g.save(); g.translate(sourceSize * 2, 0); g.scale(-1, 1);
        g.drawImage(image, 0, 0, sourceSize, sourceSize); g.restore();
        g.save(); g.translate(0, sourceSize * 2); g.scale(1, -1);
        g.drawImage(image, 0, 0, sourceSize, sourceSize); g.restore();
        g.save(); g.translate(sourceSize * 2, sourceSize * 2); g.scale(-1, -1);
        g.drawImage(image, 0, 0, sourceSize, sourceSize); g.restore();

    };

        const cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        const g = cv.getContext('2d');
        /* Match the supplied tile's bright purple ground and dense dark spots. */
        g.fillStyle = '#8b4eb0';
        g.fillRect(0, 0, 256, 256);
        let seed = 0x4f1a2d;
        const next = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 0x100000000; };
        const blob = (x, y, rx, ry, color) => {
            const sides = 5 + Math.floor(next() * 5);

            for (let j = 0; j < sides; j++) {
                const a = rot + j * TAU / sides;
                /* Uneven radial lengths create lumpy, squashed spot silhouettes
                   instead of the perfectly circular fallback that was visible. */
                const wobble = 0.62 + next() * 0.48;
                const px = x + Math.cos(a) * rx * wobble;
                const py = y + Math.sin(a) * ry * wobble;
                if (j) g.lineTo(px, py); else g.moveTo(px, py);
            }
            g.closePath(); g.fillStyle = color; g.fill();

            const ry = rx * (0.45 + next() * 0.80);
            const x = next() * 256, y = next() * 256;
            blob(x, y, rx, ry, i % 3 === 0 ? 'rgba(70,37,115,0.74)' : 'rgba(91,47,139,0.62)');
            /* A few joined blobs keep the fallback close to the supplied terrain
               texture's organic, merged spot clusters. */
            if (i % 5 === 0) blob(x + rx * (0.45 + next() * 0.3), y + ry * (next() - 0.5), rx * 0.58, ry * 0.52, 'rgba(70,37,115,0.64)');
        }
        for (let i = 0; i < 150; i++) {
            const w = 1 + Math.floor(next() * 4), h = 1 + Math.floor(next() * 3);
            const x = Math.floor(next() * 256), y = Math.floor(next() * 256);
            g.fillStyle = 'rgba(67,33,112,0.58)';
            if (i % 4 === 0) {
                g.fillRect(x - w, y, w * 2 + 1, h);

           feeds the mirrored seamless-tile construction above. */
        tex.dispose();

    const fallbackTexture = makeSpotTexture();
    m.material.map = fallbackTexture;
    m.material.needsUpdate = true;
    const terrainTextureUrl = TERRAIN_TEXTURE_EMBEDDED_URL;
    new THREE.TextureLoader().load(
        terrainTextureUrl,
        (terrainTex) => {
            fallbackTexture.dispose();
            m.material.map = normalizeTerrainTexture(terrainTex);
            m.material.needsUpdate = true;
        },
        undefined,
        () => { /* PNG failed to load on file:// — keep the procedural spot texture already applied */ }
    );
    m.position.set(WORLD / 2, WORLD / 2, 0);
    m.receiveShadow = true;
    scene.add(m);
    terrain = m;
}

/* procedural low-poly models */
function makeSoldier(accent, role) {
    const g = new THREE.Group();                 // feet at local z=0, FRONT = +x, LEFT/RIGHT = ±y
    const armor = 0x2a2c38, dark = 0x1b1d26, suit = 0x343a4a;
    const squadLegs = [];
    const addSquadLeg = (side) => {
        const pivot = new THREE.Group();
        pivot.position.set(0, side * 0.15, 0.78);
        part(pivot, 0.16, 0.34, 0.78, 0, 0, -0.39, dark);
        part(pivot, 0.34, 0.22, 0.10, 0, 0, -0.72, 0x101219);
        g.add(pivot); squadLegs.push(pivot);
    };
    /* legs side-by-side along ±y (left/right), so the model faces +x (visor) as it walks */
    addSquadLeg(-1); addSquadLeg(1);
    part(g, role === 'rifle' ? 0.30 : 0.34, role === 'heavy' ? 0.66 : 0.56, 0.60, 0, 0, 1.02, armor);
    part(g, 0.10, 0.44, 0.44, 0.15, 0, 1.02, accent);    // chest plate (front +x)
    part(g, role === 'medic' ? 0.30 : 0.20, role === 'medic' ? 0.38 : 0.30, role === 'medic' ? 0.66 : 0.5, -0.26, 0, 1.10, dark);
    if (role === 'medic') {
        part(g, 0.12, 0.12, 0.10, -0.26, 0, 1.28, 0xff5577, EMISSIVE(0xcc2244, 1.2));
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.72, 5), mat(0x8ea7c4, { metalness: 0.65, roughness: 0.3 }));
        antenna.rotation.x = Math.PI / 2; antenna.position.set(-0.28, -0.15, 1.65); g.add(antenna);
        part(g, 0.07, 0.07, 0.09, -0.28, -0.15, 2.0, 0xff6688, EMISSIVE(0xff3355, 1.6));
    }
    g.userData.legs = squadLegs;
    const shoulderW = role === 'heavy' ? 0.36 : 0.22, shoulderD = role === 'heavy' ? 0.38 : 0.26, shoulderH = role === 'heavy' ? 0.34 : 0.24;
    part(g, shoulderW, shoulderD, shoulderH, 0, -0.36, 1.28, dark);
    part(g, shoulderW, shoulderD, shoulderH, 0,  0.36, 1.28, dark);
    if (role === 'heavy') {
        part(g, 0.18, 0.68, 0.12, 0.18, 0, 1.12, accent, EMISSIVE(accent, 0.35));
        for (let i = 0; i < 3; i++) part(g, 0.08, 0.10, 0.16, 0.30, -0.22 + i * 0.22, 0.88, 0xb89242);
    }
    part(g, 0.26, 0.30, 0.34, 0, 0, 1.46, 0x20222c);     // head (thin x / wide y)
    part(g, 0.04, 0.26, 0.10, 0.13, 0, 1.49, 0x66e0ff, EMISSIVE(0x2ab0d0, 0.8)); // visor strip on the +x face
    /* rifle held low-ready in front-right (muzzle down) + arms + hands so it looks HELD */
    const rifleG = new THREE.Group();
    rifleG.name = 'squadRifle';
    rifleG.position.set(0.30, 0.16, 1.0);
    part(rifleG, 0.55, 0.09, 0.11, 0.0, 0.0, 0.0, 0x101216);    // receiver
    part(rifleG, 0.20, 0.05, 0.08, 0.0, 0.0, 0.04, 0x1c1f29);   // top rail
    part(rifleG, 0.32, 0.055, 0.055, 0.32, 0.0, 0.0, 0x101216); // barrel
    part(rifleG, 0.06, 0.07, 0.07, 0.5, 0.0, 0.0, 0x22252e);    // muzzle brake
    part(rifleG, 0.10, 0.11, 0.17, -0.07, 0.0, -0.13, 0x22252e); // mag
    part(rifleG, 0.02, 0.04, 0.04, -0.04, 0.0, 0.07, 0x66e0ff, EMISSIVE(0x2ab0d0, 1.2)); // glowing ammo counter
    rifleG.rotation.y = Math.PI / 2;   // +x barrel → points down (-z), low ready
    g.add(rifleG);
    /* tactical flashlight — forward-pointing housing + bright lens (casts the squad light cone) */
    const torchG = new THREE.Group();
    torchG.position.set(0.30, 0.12, 1.02);
    part(torchG, 0.26, 0.10, 0.10, 0.0, 0.0, 0.0, 0x15171f);     // housing
    part(torchG, 0.04, 0.09, 0.09, 0.15, 0.0, 0.0, 0xfff6d8, EMISSIVE(0xbfe6ff, 3.2)); // lens (front +x)
    g.add(torchG);
    /* arms reaching forward to the rifle (right hand on grip, left hand on forend) */
    const handMat = mat(0x101216);
    const limb = (fx, fy, fz, tx, ty, tz, r, col) => {
        const from = new THREE.Vector3(fx, fy, fz), to = new THREE.Vector3(tx, ty, tz);
        const d = from.distanceTo(to);
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d, 6), mat(col));
        m.position.copy(from).add(to).multiplyScalar(0.5);
        const dir = new THREE.Vector3().subVectors(to, from).normalize();
        const up = new THREE.Vector3(0, 1, 0);
        if (Math.abs(up.dot(dir)) > 0.9999) m.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
        else m.quaternion.setFromUnitVectors(up, dir);
        g.add(m);
        const hand = new THREE.Mesh(new THREE.SphereGeometry(r * 1.25, 6, 5), handMat);
        hand.position.set(tx, ty, tz);
        g.add(hand);
    };
    limb(0.0, 0.36, 1.22, 0.30, 0.18, 0.92, 0.07, armor);   // right arm → grip
    limb(0.0, -0.36, 1.22, 0.30, 0.06, 0.74, 0.07, armor);   // left arm → forend
    return g;
}

const INFESTED_PALETTES = {

/* shared geometry/material cache so the horde reuses GPU assets instead of rebuilding them per enemy (perf #17) */
const INFESTED_GEO = {}, INFESTED_MATS = {};
function ig(key, make) { return INFESTED_GEO[key] || (INFESTED_GEO[key] = make()); }
function im(key, make) { return INFESTED_MATS[key] || (INFESTED_MATS[key] = make()); }
function makeInfested(type) {
    const g = new THREE.Group();

function makeRelay() {
    const g = new THREE.Group();
    const metal = mat(0x3a3f52, { metalness: 0.6, roughness: 0.4 });
    const metalLight = mat(0x4b526b, { metalness: 0.55, roughness: 0.45 });
    const glow = mat(0x88ccff, { metalness: 0.7, roughness: 0.3, emissive: 0x2288cc, emissiveIntensity: 0.5 });

    /* wide octagonal base slab sitting on the pad */
    const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.9, 0.6, 8), metal);
    base.rotation.x = Math.PI / 2; base.position.set(0, 0, 0.3); g.add(base);

    /* 4 support pillars rising from the base corners up to the energy-ring platform */
    for (let i = 0; i < 4; i++) {
        const a = i / 4 * TAU + Math.PI / 4;
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.18, 2.6, 6), metalLight);
        pillar.rotation.x = Math.PI / 2;
        pillar.position.set(Math.cos(a) * 1.55, Math.sin(a) * 1.55, 1.3);

    /* tapered central pylon (taller + slimmer than before so parts don't clump) */
    const pylon = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.5, 4.4, 8), metal);
    pylon.rotation.x = Math.PI / 2; pylon.position.set(0, 0, 2.9); g.add(pylon);

    /* mid-level static energy fins radiating from the pylon */
    for (let i = 0; i < 3; i++) {
        const a = i / 3 * TAU + 0.35;
        const fin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.16), mat(0x66ccff, { metalness: 0.6, roughness: 0.3, emissive: 0x2288ff, emissiveIntensity: 1.0 }));
        fin.position.set(Math.cos(a) * 0.85, Math.sin(a) * 0.85, 3.5);
        fin.rotation.z = -a;

    /* energy ring + core (the ring spins via r.model.ring.rotation.z in updateRelays) */
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.16, 8, 32), glow);
    ring.rotation.x = Math.PI / 2; ring.position.set(0, 0, 5.0); g.add(ring);
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 12), mat(0xbb88ff, EMISSIVE(0x8833ff, 0.6)));
    core.position.set(0, 0, 5.0); g.add(core);

    /* antenna tip + beacon (kept clear of the ring so nothing overlaps) */
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.26, 1.1, 6), metal);
    tip.rotation.x = Math.PI / 2; tip.position.set(0, 0, 6.1); g.add(tip);
    const lightBeacon = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), mat(0xff6666, EMISSIVE(0xff2222, 1.4)));
    lightBeacon.position.set(0, 0, 6.8); g.add(lightBeacon);

    /* 3 feet spreading out from the base for a stable landed look */
    for (let i = 0; i < 3; i++) {

/* ─── world objects & collision ─────────────────────────────────────────── */
const SOLIDS = [];   // {x0,y0,x1,y1}
function addSolid(x0, y0, x1, y1) { SOLIDS.push({ x0, y0, x1, y1 }); }
function resolveCircle(p, r) {
    for (let i = 0; i < SOLIDS.length; i++) {
        const s = SOLIDS[i];
        if (s.disabled) continue;   // sliding doors toggle their solid on/off
        const cx = clamp(p.x, s.x0, s.x1), cy = clamp(p.y, s.y0, s.y1);
        let dx = p.x - cx, dy = p.y - cy;
        const d2 = dx * dx + dy * dy;
        if (d2 < r * r) {
            if (d2 > 1e-6) { const d = Math.sqrt(d2); dx /= d; dy /= d; }
            else { dx = p.x - (s.x0 + s.x1) / 2; dy = p.y - (s.y0 + s.y1) / 2; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d; }
            p.x += dx * (r - Math.sqrt(d2)); p.y += dy * (r - Math.sqrt(d2));
        }
    }
}
function isInsideSolid(x, y, r = 0.4) {
    for (let i = 0; i < SOLIDS.length; i++) {
        const s = SOLIDS[i];
        if (s.disabled) continue;   // sliding doors toggle their solid on/off
        const cx = clamp(x, s.x0, s.x1), cy = clamp(y, s.y0, s.y1);
        if ((x - cx) * (x - cx) + (y - cy) * (y - cy) < r * r) return true;
    }
    return false;
}

function addWallPanel(cx, cy, w, d, h, color) {
    const m = box(w, d, h, color || 0x565a6e, { metalness: 0.3, roughness: 0.7 });
    m.position.set(cx, cy, h / 2);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    addSolid(cx - w / 2, cy - d / 2, cx + w / 2, cy + d / 2);
    return m;
}

/* ─── sliding blast doors (open when the squad approaches, close behind) ── */
const facilityDoors = [];   // { base:[x,y], axis:'x'|'y', openT, solid, panels:[{g,s,offC,offO}] }
function addSlidingDoor(x, y, axis, gapHalf, panelW, panelH) {
    const door = { base: [x, y], axis, openT: 0, lastTarget: 0, panels: [] };
    for (const s of [-1, 1]) {
        const w = axis === 'x' ? panelW : 0.32;   // panel size along the slide axis vs across it
        const d = axis === 'x' ? 0.32 : panelW;
        const g = new THREE.Group();
        const panel = box(w, d, panelH, 0x3e4658, { metalness: 0.72, roughness: 0.34 });
        panel.castShadow = true; panel.receiveShadow = true;
        g.add(panel);
        /* glowing leading-edge seam faces the doorway centre */
        const seam = box(axis === 'x' ? 0.14 : d + 0.06, axis === 'x' ? d + 0.06 : 0.14, panelH - 0.9, 0xff9e42, EMISSIVE(0xff6b24, 1.4));
        seam.position.set(axis === 'x' ? -s * (w * 0.5 - 0.1) : 0, axis === 'x' ? 0 : -s * (d * 0.5 - 0.1), 0);
        g.add(seam);
        g.position.z = panelH / 2;
        const offC = s * (gapHalf * 0.55);
        const offO = s * (gapHalf + panelW * 0.5 + 0.4);
        if (axis === 'x') { g.position.x = x + offC; g.position.y = y; }
        else { g.position.x = x; g.position.y = y + offC; }
        scene.add(g);
        door.panels.push({ g, s, offC, offO });
    }
    /* collision strip across the doorway — disabled while the door is open */
    const solid = axis === 'x'
        ? { x0: x - gapHalf, y0: y - 0.5, x1: x + gapHalf, y1: y + 0.5, disabled: false }
        : { x0: x - 0.5, y0: y - gapHalf, x1: x + 0.5, y1: y + gapHalf, disabled: false };
    SOLIDS.push(solid);
    door.solid = solid;
    facilityDoors.push(door);
    return door;
}
function updateFacilityDoors(dt) {
    for (const door of facilityDoors) {
        let near = Math.hypot(player.pos.x - door.base[0], player.pos.y - door.base[1]) < 4.2;
        if (!near) {
            for (const m of squadMembers) {
                if (!m.downed && Math.hypot(m.pos.x - door.base[0], m.pos.y - door.base[1]) < 4.2) { near = true; break; }
            }
        }
        const target = near ? 1 : 0;
        if (target !== door.lastTarget) {                  // door starts opening/closing → whoosh
            playFileSfx('slidingDoor', 0.55, 1, door.base[0], door.base[1]);
            door.lastTarget = target;
        }
        door.openT = clamp(door.openT + (target - door.openT) * Math.min(1, dt * 3.2), 0, 1);
        door.solid.disabled = door.openT > 0.35;   // open wide enough → walkable
        const t = smooth(door.openT);
        for (const p of door.panels) {
            const off = lerp(p.offC, p.offO, t);
            if (door.axis === 'x') { p.g.position.x = door.base[0] + off; p.g.position.y = door.base[1]; }
            else { p.g.position.x = door.base[0]; p.g.position.y = door.base[1] + off; }
        }
    }
}

/* weird lumpy alien rocks — displaced polyhedron + glowing crystal shard */
function makeWeirdRock(s) {
    const g = new THREE.Group();
    const geo = new THREE.DodecahedronGeometry(1, 0);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
        const r = 1 + rand(-0.4, 0.5);
        pos.setXYZ(i, v.x * r, v.y * r, v.z * r);
    }
    geo.computeVertexNormals();
    const rock = new THREE.Mesh(geo, mat(0x5a3a6a, { roughness: 0.9, metalness: 0.05 }));
    rock.scale.set(1.15, 1.15, 0.85);
    g.add(rock);
    const shard = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.7, 5), mat(0x8a4ac2, { emissive: 0x7722ff, emissiveIntensity: 0.9, roughness: 0.5 }));
    shard.position.set(rand(-0.6, 0.6), rand(-0.6, 0.6), 1.15);
    shard.rotation.z = rand(-0.45, 0.45);
    g.add(shard);
    g.scale.setScalar(s);
    return g;
}
/* strange purple infested tree — twisted trunk, spiky glowing canopy, hanging spore pods */
function makeInfestedTree(s) {
    const g = new THREE.Group();
    const bark = mat(0x3a2044, { roughness: 0.85, metalness: 0.05, emissive: 0x2a002a, emissiveIntensity: 0.4 });
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.38, 3.6, 6), bark);
    trunk.rotation.x = Math.PI / 2; trunk.rotation.z = rand(-0.22, 0.22);
    trunk.position.set(0, 0, 1.8); g.add(trunk);
    const branch = (bx, by, bz, ex, ey, ez, r) => {
        const from = new THREE.Vector3(bx, by, bz), to = new THREE.Vector3(ex, ey, ez);
        const d = from.distanceTo(to);
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.6, r, d, 5), bark);
        m.position.copy(from).add(to).multiplyScalar(0.5);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), to.clone().sub(from).normalize());
        g.add(m);
    };
    for (let i = 0; i < 3; i++) {
        const a = i / 3 * TAU + rand(0.5);
        const len = rand(1.2, 1.9);
        branch(0, 0, 2.9, Math.cos(a) * len, Math.sin(a) * len, 3.3 + rand(0.5), 0.09);
    }
    const crownMat = mat(0x6e2a8c, { emissive: 0x8a22ba, emissiveIntensity: 1.05, roughness: 0.55 });
    const crownOffsets = [[0, 0, 4.2, 1.1], [0.72, 0.18, 3.95, 0.76], [-0.58, 0.45, 4.05, 0.72], [0.12, -0.72, 3.92, 0.68], [-0.62, -0.40, 3.72, 0.52]];
    for (const c of crownOffsets) {
        const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(c[3], 1), crownMat);
        crown.position.set(c[0], c[1], c[2]); crown.scale.set(1.05, 0.92, 1.22); g.add(crown);
    }
    for (let i = 0; i < 4; i++) {
        const cyan = i % 2 === 0;
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 6, 5), mat(cyan ? 0x66eaff : 0xff55ff, { emissive: cyan ? 0x22bfff : 0xff33ff, emissiveIntensity: 2.6 }));
        bulb.position.set(rand(-1.15, 1.15), rand(-1.15, 1.15), 2.7 + rand(1.0));
        g.add(bulb);
    }
    g.scale.setScalar(s);
    return g;
}

function buildDecor() {
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    let n = 0, tries = 0;
    /* weird jagged rocks with exact (solid) collision */
    const weirdCount = 50;
    while (n < weirdCount && tries++ < weirdCount * 24) {
        const wx = rand(0, WORLD), wy = rand(0, WORLD);
        const d = distToRoute(wx, wy), h = terrainHeight(wx, wy);
        if (h > 60 || h < 2) continue;
        if (d < 26 || d > 150) continue;               // scatter on the slopes, off the path
        if (Math.hypot(wx - FACILITY.x, wy - FACILITY.y) < 75) continue;   // keep the facility clear
        if (isInsideSolid(wx, wy, 1)) continue;
        const sc = rand(0.9, 2.4);
        const rock = makeWeirdRock(sc);
        rock.position.set(wx, wy, h - 0.2);
        rock.rotation.z = rand(TAU);
        rock.castShadow = true;
        scene.add(rock);
        addSolid(wx - sc * 0.75, wy - sc * 0.75, wx + sc * 0.75, wy + sc * 0.75);
        n++;
    }
    /* strange purple infested trees with exact (solid) collision */
    const treeCount = 36;
    n = 0; tries = 0;
    while (n < treeCount && tries++ < treeCount * 28) {
        const t = rand(0, 1);
        const idx = Math.min(ROUTE.length - 2, Math.floor(t * (ROUTE.length - 1)));
        const a = ROUTE[idx], b = ROUTE[idx + 1];
        const px = lerp(a.x, b.x, t), py = lerp(a.y, b.y, t);
        const ang = rand(TAU), rad = rand(18, 95);
        const wx = px + Math.cos(ang) * rad, wy = py + Math.sin(ang) * rad;
        const d = distToRoute(wx, wy), h = terrainHeight(wx, wy);
        if (d < 14 || d > 105) continue;
        if (h < 0.5 || h > 45) continue;
        if (isInsideSolid(wx, wy, 1)) continue;
        if (Math.hypot(wx - LZ.x, wy - LZ.y) < 16) continue;              // keep the landing apron open
        if (Math.hypot(wx - LAND.x, wy - LAND.y) < 22) continue;          // keep the intro landing spot clear
        if (Math.hypot(wx - FACILITY.x, wy - FACILITY.y) < 75) continue;  // keep the facility clear
        const sc = rand(0.8, 1.5);
        const tree = makeInfestedTree(sc);
        tree.position.set(wx, wy, h);
        tree.rotation.z = rand(TAU);
        tree.castShadow = true;
        scene.add(tree);
        addSolid(wx - 0.55 * sc, wy - 0.55 * sc, wx + 0.55 * sc, wy + 0.55 * sc);
        n++;
    }
    /* small loose pebbles — visual only, no collision */
    const pebbleGeo = new THREE.DodecahedronGeometry(0.6, 0);
    const pebbleMat = mat(0x4a3a5e, { roughness: 0.95, metalness: 0.0 });
    const pebbleCount = 90;
    const pebbles = new THREE.InstancedMesh(pebbleGeo, pebbleMat, pebbleCount);
    n = 0; tries = 0;
    while (n < pebbleCount && tries++ < pebbleCount * 8) {
        const wx = rand(0, WORLD), wy = rand(0, WORLD);
        const d = distToRoute(wx, wy), h = terrainHeight(wx, wy);
        if (h > 60 || h < 2) continue;
        if (d < 26 || d > 150) continue;
        if (Math.hypot(wx - FACILITY.x, wy - FACILITY.y) < 75) continue;   // keep the facility clear
        p.set(wx, wy, h - 0.35);
        q.setFromEuler(new THREE.Euler(rand(TAU), rand(TAU), rand(TAU)));
        s.setScalar(rand(0.5, 1.3));
        m4.compose(p, q, s);
        pebbles.setMatrixAt(n++, m4);
    }
    pebbles.count = n;
    pebbles.castShadow = true;
    scene.add(pebbles);

    const sporeGeo = new THREE.SphereGeometry(0.5, 7, 6);
    const sporeMat = mat(0xcc44ff, { emissive: 0xaa22ff, emissiveIntensity: 1.6, roughness: 0.3 });
    const sporeCount = 340;
    const spores = new THREE.InstancedMesh(sporeGeo, sporeMat, sporeCount);
    n = 0; tries = 0;
    while (n < sporeCount && tries++ < sporeCount * 10) {
        const wx = rand(0, WORLD), wy = rand(0, WORLD);
        const h = terrainHeight(wx, wy);
        if (h < 0.2 || h > 40) continue;
        if (distToRoute(wx, wy) < 18) continue;
        if (Math.hypot(wx - FACILITY.x, wy - FACILITY.y) < 75) continue;   // keep the facility clear
        p.set(wx, wy, h + 0.3);
        q.setFromEuler(new THREE.Euler(rand(TAU), rand(TAU), rand(TAU)));
        s.setScalar(rand(0.5, 1.6));
        m4.compose(p, q, s);
        spores.setMatrixAt(n++, m4);
    }
    spores.count = n;
    scene.add(spores);

    /* distant facility glow beacon */
    const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 26, 6), mat(0xcc66ff, { emissive: 0xaa44ff, emissiveIntensity: 0.7, transparent: true, opacity: 0.5 }));
    beacon.rotation.x = Math.PI / 2; beacon.position.set(FACILITY.x + 24, FACILITY.y + 18, 13);
    scene.add(beacon);

    /* spore vents near the route */
    for (let i = 0; i < 8; i++) {
        const t = i / 7;
        const idx = Math.min(ROUTE.length - 2, Math.floor(t * (ROUTE.length - 1)));
        const a = ROUTE[idx], b = ROUTE[idx + 1];
        const wx = lerp(a.x, b.x, t), wy = lerp(a.y, b.y, t);
        const ang = rand(TAU), rad = rand(30, 55);
        const vx = wx + Math.cos(ang) * rad, vy = wy + Math.sin(ang) * rad;
        if (distToRoute(vx, vy) < 30) continue;
        if (Math.hypot(vx - FACILITY.x, vy - FACILITY.y) < 90) continue;   // keep the facility clear
        const h = terrainHeight(vx, vy);
        const vent = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.4, 3, 7), mat(0x3a2a4e, { roughness: 0.8 }));
        vent.rotation.x = Math.PI / 2; vent.position.set(vx, vy, h + 1.5); scene.add(vent);
        const glow = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 6), mat(0xbb44ff, { emissive: 0x9933ff, emissiveIntensity: 1.3 }));
        glow.position.set(vx, vy, h + 3.4); scene.add(glow);
        const light = new THREE.PointLight(0xbb44ff, 16, 40, 1.8);
        light.position.set(vx, vy, h + 5); scene.add(light);
    }

    /* ── artificial guide beacons along the route (light the way to relays + facility) ── */
    let routeTotal = 0;
    for (let i = 0; i < ROUTE.length - 1; i++) routeTotal += ROUTE[i].distance(ROUTE[i + 1]);
    const routePointAt = (tt) => {
        const want = tt * routeTotal;
        let acc = 0;
        for (let i = 0; i < ROUTE.length - 1; i++) {
            const seg = ROUTE[i].distance(ROUTE[i + 1]);
            if (acc + seg >= want) {
                const f = seg ? (want - acc) / seg : 0;
                return { x: lerp(ROUTE[i].x, ROUTE[i + 1].x, f), y: lerp(ROUTE[i].y, ROUTE[i + 1].y, f), ax: ROUTE[i].x, ay: ROUTE[i].y, bx: ROUTE[i + 1].x, by: ROUTE[i + 1].y };
            }
            acc += seg;
        }
        const L = ROUTE[ROUTE.length - 1];
        return { x: L.x, y: L.y, ax: L.x, ay: L.y, bx: L.x, by: L.y };
    };
    for (let i = 1; i <= 8; i++) {
        const rp = routePointAt(i / 9);
        const dx = rp.bx - rp.ax, dy = rp.by - rp.ay;
        const len = Math.hypot(dx, dy) || 1;
        const gx = rp.x + (-dy / len) * 10, gy = rp.y + (dx / len) * 10;
        if (Math.hypot(gx - FACILITY.x, gy - FACILITY.y) < 60) continue;   // the facility has its own lights
        const gh = terrainHeight(gx, gy);
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.16, 4.6, 6), mat(0x3a3f52, { metalness: 0.5, roughness: 0.5 }));
        pole.rotation.x = Math.PI / 2; pole.position.set(gx, gy, gh + 2.3); pole.castShadow = true; scene.add(pole);
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), mat(0x66e0ff, EMISSIVE(0x2ab0d0, 2.4)));
        lamp.position.set(gx, gy, gh + 4.7); scene.add(lamp);
        const gLight = new THREE.PointLight(0x66e0ff, 30, 80, 1.8);
        gLight.position.set(gx, gy, gh + 5.3); scene.add(gLight);
    }

    /* ── strange alien light plants — glowing bulbs on thin stems, scattered around ── */
    const lightPlantCount = 170;
    const stemGeo = new THREE.CylinderGeometry(0.05, 0.12, 1.5, 5);
    stemGeo.rotateX(Math.PI / 2);   // cylinder axis → +Z (vertical in z-up world)
    const stemMat = mat(0x2a1638, { roughness: 0.9, emissive: 0x1a0a24, emissiveIntensity: 0.35 });
    const stems = new THREE.InstancedMesh(stemGeo, stemMat, lightPlantCount);
    const bulbGeo = new THREE.SphereGeometry(0.26, 8, 6);
    const bulbMat = mat(0xffffff, { roughness: 0.4, emissive: 0xffffff, emissiveIntensity: 2.6, vertexColors: true });
    const bulbs = new THREE.InstancedMesh(bulbGeo, bulbMat, lightPlantCount);
    const plantPositions = [];
    let lpN = 0, lpTry = 0;
    while (lpN < lightPlantCount && lpTry++ < lightPlantCount * 8) {
        const wx = rand(0, WORLD), wy = rand(0, WORLD);
        const h = terrainHeight(wx, wy);
        if (h < 0.3 || h > 34) continue;
        if (distToRoute(wx, wy) < 20) continue;               // don't clutter the path
        if (Math.hypot(wx - FACILITY.x, wy - FACILITY.y) < 80) continue;   // keep the facility clear
        if (isInsideSolid(wx, wy, 0.6)) continue;
        const plantForm = lpN % 3; // tall stalk, hanging pod, puffball
        /* stem */
        p.set(wx, wy, h + (plantForm === 0 ? 1.05 : plantForm === 1 ? 0.78 : 0.52));
        q.setFromEuler(new THREE.Euler(rand(0.28) - 0.14, rand(TAU), rand(0.28) - 0.14));
        s.set(plantForm === 0 ? 0.78 : 0.95, plantForm === 1 ? 0.72 : 1.12, plantForm === 0 ? 1.5 : plantForm === 1 ? 0.9 : 0.65);
        m4.compose(p, q, s);
        stems.setMatrixAt(lpN, m4);
        /* bulb */
        p.set(wx, wy, h + (plantForm === 0 ? 2.20 : plantForm === 1 ? 1.46 : 1.10));
        q.setFromEuler(new THREE.Euler(rand(TAU), rand(TAU), rand(TAU)));
        s.set(plantForm === 0 ? 0.72 : plantForm === 1 ? 0.58 : 1.45, plantForm === 2 ? 1.45 : 0.72, plantForm === 1 ? 1.45 : plantForm === 2 ? 0.72 : 0.92);
        m4.compose(p, q, s);
        bulbs.setMatrixAt(lpN, m4);
        bulbs.setColorAt(lpN, new THREE.Color(plantForm === 1 ? 0x66eaff : plantForm === 2 ? 0xc77aff : 0xff55ee));
        plantPositions.push([wx, wy, h]);
        lpN++;
    }
    stems.count = lpN; bulbs.count = lpN;
    if (bulbs.instanceColor) bulbs.instanceColor.needsUpdate = true;
    stems.castShadow = true;
    scene.add(stems); scene.add(bulbs);
    /* varied point lights so the plants illuminate the ground around them */
    const plantLightCount = Math.min(18, plantPositions.length);
    for (let i = 0; i < plantLightCount; i++) {
        const idx = Math.floor(i * plantPositions.length / plantLightCount);
        const pp = plantPositions[idx];
        const col = i % 3 === 0 ? 0x66e0ff : i % 3 === 1 ? 0xff55ee : 0xbb44ff;
        const pl = new THREE.PointLight(col, 6 + rand(0, 8), 22 + rand(0, 12), 1.8);
        pl.position.set(pp[0], pp[1], pp[2] + 1.7);
        scene.add(pl);
    }
}

function gpart(g, w, h, d, x, y, z, color, opts) {   // w=x, h=y (up), d=z (barrel axis, forward = -z)
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
    m.position.set(x, y, z);
    g.add(m);
    return m;
}

function movePlayer(dt) {
    let ix = (LJS.keyIsDown('KeyD') ? 1 : 0) - (LJS.keyIsDown('KeyA') ? 1 : 0);
    let iy = (LJS.keyIsDown('KeyW') ? 1 : 0) - (LJS.keyIsDown('KeyS') ? 1 : 0);
    const fwdX = Math.cos(player.yaw), fwdY = Math.sin(player.yaw);
    const sprinting = iy > 0 && LJS.keyIsDown('ShiftLeft') && player.stamina > 0;
    const speed = sprinting ? 8.4 : player.speed;
    player.lastSpeed = speed;   // squadmates use this to keep pace (incl. sprint)
    const ads = LJS.mouseIsDown(2);   // right mouse = aim down sights
    player.ads = ads;
    // forward * W/S  +  camera-right * A/D  (camera-right = forward × up = (fwdY, -fwdX))
    let mx = fwdX * iy + (fwdY) * ix;
    let my = fwdY * iy - (fwdX) * ix;
    const ml = Math.hypot(mx, my);
    if (ml > 0.01) { mx /= ml; my /= ml; }
    if (sprinting) player.stamina = Math.max(0, player.stamina - 22 * dt);
    else player.stamina = Math.min(100, player.stamina + 14 * dt);

    if (ml > 0.01) {
        const nx = clamp(player.pos.x + mx * speed * dt, 2, WORLD - 2);
        const ny = clamp(player.pos.y + my * speed * dt, 2, WORLD - 2);
        const curZ = terrainHeight(player.pos.x, player.pos.y);
        const nz = terrainHeight(nx, ny);
        if (nz <= curZ + MAX_STEP) {   // cannot climb cliff faces
            player.pos.x = nx; player.pos.y = ny;
            resolveCircle(player.pos, 0.5);
            player.walkCycle += speed * dt * 1.35;
            player.lastMoveYaw = Math.atan2(my, mx);   // record where we're walking (squad forms up behind)
        }
    }
    /* footsteps — metal plates inside the facility, pebbles out in the wastes */
    player.stepT -= dt;
    if (ml > 0.01 && player.grounded && player.stepT <= 0) {
        player.stepT = sprinting ? 0.3 : 0.42;
        const onMetal = Math.hypot(player.pos.x - FACILITY.x, player.pos.y - FACILITY.y) < 55;
        playFileSfx(onMetal ? 'stepMetal' : 'step', 0.25, rand(0.92, 1.08));
    }
    /* vertical physics */
    const groundH = terrainHeight(player.pos.x, player.pos.y);
    if (player.grounded) {
        if (LJS.keyWasPressed('Space')) {
            player.zVel = 7.2; player.grounded = false;
            const onMetal = Math.hypot(player.pos.x - FACILITY.x, player.pos.y - FACILITY.y) < 55;
            playFileSfx(onMetal ? 'stepMetal' : 'step', 0.12, rand(0.9, 1.1));   // soft jump-off footstep
        }
    } else {
        player.zVel -= 24 * dt;
        player.zPos += player.zVel * dt;
        if (player.zPos <= groundH && player.zVel <= 0) {
            const fall = groundH - player.fallStart;
            player.zPos = groundH; player.zVel = 0; player.grounded = true;
            if (fall > 8) playerTakeDamage((fall - 8) * 4, false);
            const onMetal = Math.hypot(player.pos.x - FACILITY.x, player.pos.y - FACILITY.y) < 55;
            playFileSfx(onMetal ? 'stepMetal' : 'step', 0.3, rand(0.9, 1.1));    // landing footstep
        }
    }
    if (player.grounded) { player.zPos = groundH; player.fallStart = groundH; }

    /* look — deltas clamped per-frame to kill the pointer-lock engage snap & input spikes */
    const sens = 0.0021 * opts.sens;
    const mdx = clamp(LJS.mouseDeltaScreen.x, -260, 260);
    const mdy = clamp(LJS.mouseDeltaScreen.y, -260, 260);
    LJS.mouseDeltaScreen.set(0, 0);
    player.yaw -= mdx * sens;
    player.pitch = clamp(player.pitch - mdy * sens * (opts.invertY ? -1 : 1), -1.25, 1.25);
    player.yaw = mod2pi(player.yaw);
    if (sprinting) player.kick = lerp(player.kick, 0.05, 0.1);

    /* eye height + head bob */
    const bob = ml > 0.01 ? Math.sin(player.walkCycle) * 0.05 * clamp(speed / 5.2, 1, 1.6) : 0;
    const eyeZ = player.zPos + player.eye + (player.grounded ? bob : 0);
    const baseFov = opts.fov || 75;
    const fovT = sprinting ? 1 : 0;
    const targetFov = ads ? baseFov * 0.6 : lerp(baseFov, baseFov + 7, fovT);   // ADS zoom + sprint kick
    if (Math.abs(camera.fov - targetFov) > 0.01) { camera.fov = lerp(camera.fov, targetFov, 0.1); camera.updateProjectionMatrix(); }
    camera.position.set(player.pos.x, player.pos.y, eyeZ);
    const lookX = Math.cos(player.yaw) * Math.cos(player.pitch);
    const lookY = Math.sin(player.yaw) * Math.cos(player.pitch);
    const lookZ = Math.sin(player.pitch);
    camera.lookAt(camera.position.x + lookX, camera.position.y + lookY, camera.position.z + lookZ);
    LJS.setCameraPos(player.pos);
    LJS.setCameraAngle(player.yaw);

    /* viewmodel bob + recovery — hip-fire position is KEPT when zooming (ADS = FOV zoom only) */
    const bobY = (ml > 0.01 ? Math.sin(player.walkCycle) * 0.018 : 0) - player.kick;
    const bobX = ml > 0.01 ? Math.cos(player.walkCycle * 0.5) * 0.010 : 0;
    const vmX = 0.34;
    const vmY = -0.30;
    /* reloading = slowly holster the rifle (down + centered + tilted), then unholster when done */
    const hol = player.holsterT || 0;
    viewModel.position.set(vmX + bobX - 0.06 * hol, vmY + bobY - 0.46 * hol, -0.62 - 0.04 * hol);
    viewModel.rotation.x = 0.55 * hol;
    player.kick = lerp(player.kick, 0, 0.12);
}

function mod2pi(a) { a = a % TAU; if (a < 0) a += TAU; return a; }

function fireWeapon() {
    const w = player.weapon;
    if (w.reloading) return;
    if (w.mag <= 0) {
        if (w.reserve > 0) { startReload(); }
        else playFileSfx('empty', 0.5);
        return;
    }
    w.mag--;
    player.muzzleT = 0.06;
    player.kick += 0.028 + rand(0.012);
    player.pitch = clamp(player.pitch + 0.010 + rand(0.008), -1.25, 1.25);
    playFileSfx('laserShot', 0.5, rand(0.96, 1.04));

    const spread = w.spread * (player.grounded ? 1 : 1.9) * (LJS.mouseIsDown(2) ? 0.4 : 1);   // ADS tightens spread
    const sy = player.yaw + rand(-spread, spread);
    const sp = player.pitch + rand(-spread, spread) * 0.55;
    const ox = camera.position.x, oy = camera.position.y, oz = camera.position.z - 0.1;
    const dx = Math.cos(sy) * Math.cos(sp), dy = Math.sin(sy) * Math.cos(sp), dz = Math.sin(sp);
    spawnShot(ox, oy, oz, dx, dy, dz, w.dmg * w.dmgMult, 0x66e0ff, 'player');
}

/* terrain raycast helper removed — projectiles now collide with solids directly */

function startReload() {
    const w = player.weapon;
    if (w.reloading || w.mag >= w.magSize || w.reserve <= 0) return;
    w.reloading = true; w.reloadT = 1.7;
    playFileSfx('reload', 0.7, rand(0.95, 1.05));
}

function updateWeapon(dt) {
    const w = player.weapon;
    /* slowly raise/lower the gun: 1 = fully holstered (reloading), 0 = hip ready */
    const holT = w.reloading ? 1 : 0;
    player.holsterT = holT === 1
        ? Math.min(1, (player.holsterT || 0) + dt * 2.4)
        : Math.max(0, (player.holsterT || 0) - dt * 2.4);
    if (w.reloading) {
        w.reloadT -= dt;
        if (w.reloadT <= 0) {
            if (w.reserve > 0) { w.reserve--; w.mag = w.magSize; }
            w.reloading = false;
        }
        return;
    }
    if (LJS.mouseIsDown(0)) {
        player.fireT -= dt;
        if (player.fireT <= 0) { fireWeapon(); player.fireT = w.cd / w.rateMult; }
    }
    if (LJS.keyWasPressed('KeyR')) startReload();
}

/* debug hotkey: ` (backquote) — teleport the whole squad to the current objective
   (unpowered relay / abandoned facility / extraction pad) so you can test each beat */
function debugTeleportToObjective() {
    if (intro) return;
    let tx, ty;
    switch (phase) {
        case P.DEPLOY: case P.MOVE_R1: case P.DEFEND_R1: { const r = RELAYS[0]; tx = r.pos.x; ty = r.pos.y; break; }
        case P.MOVE_R2: case P.DEFEND_R2: { const r = RELAYS[1]; tx = r.pos.x; ty = r.pos.y; break; }
        case P.MOVE_R3: case P.DEFEND_R3: { const r = RELAYS[2]; tx = r.pos.x; ty = r.pos.y; break; }
        case P.MOVE_FAC: tx = FACILITY.x; ty = FACILITY.y - 40; break;   // just outside the south gate
        case P.SEARCH: tx = FACILITY.x; ty = FACILITY.y; break;          // inside the hall, near the vault door
        case P.FINALE: tx = LZ.x; ty = LZ.y; break;                      // evacuate to the landing zone
        default: return;
    }
    /* pick a clear landing spot near the target (not inside a solid / wall) */
    let px = tx, py = ty;
    for (let a = 0; a < 36; a++) {
        const r = a < 6 ? 5 : 6 + (a % 12) * 1.2;
        const ang = a * 0.73;
        const sx = tx + Math.cos(ang) * r, sy = ty + Math.sin(ang) * r;
        if (sx < 4 || sy < 4 || sx > WORLD - 4 || sy > WORLD - 4) continue;
        if (!isInsideSolid(sx, sy, 0.6)) { px = sx; py = sy; break; }
    }
    /* teleport the player */
    player.pos.x = px; player.pos.y = py;
    player.zPos = terrainHeight(px, py);
    player.zVel = 0; player.grounded = true; player.fallStart = player.zPos;
    resolveCircle(player.pos, 0.5);
    camera.position.set(px, py, player.zPos + player.eye);
    /* bring the squad along in a small wedge behind the player */
    const squadOff = [[-2, 2], [-2, -2], [-4, 0]];
    for (let i = 0; i < squadMembers.length; i++) {
        const m = squadMembers[i];
        const o = squadOff[i] || [0, 0];
        m.pos.x = px + o[0]; m.pos.y = py + o[1];
        m.z = terrainHeight(m.pos.x, m.pos.y);
        m.holdPos.copy(m.pos);
        m.target = null;
        m.reviveT = 0;
        if (m.downed) m.mesh.rotation.x = 1.35;
        resolveCircle(m.pos, 0.4);
    }
    notify('DEBUG: squad teleported to objective', '#88ccff');
    playFileSfx('accessOk', 0.5);
}

/* attacker tracking for the directional damage indicator + debug hit log */
let lastAttackerPos = null, lastAttackerT = 0;
const debugHits = [];
function noteAttacker(x, y, kind) {
    lastAttackerPos = { x, y };
    lastAttackerT = 1.6;
    debugHits.push({ t: Math.round(LJS.time * 10) / 10, x: Math.round(x), y: Math.round(y), kind });
    if (debugHits.length > 60) debugHits.shift();
}

function playerTakeDamage(dmg, fromEnemy) {
    if (player.dead) return;
    if (player.debugImmortal) { player.hp = player.maxHp; player.shield = player.maxShield; return; }
    /* the energy shield absorbs 100% of incoming damage while it lasts; only the
       leftover that reaches the body is dealt, and it is 40% reduced (60% impactful) */
    const absorbed = Math.min(player.shield, dmg);
    player.shield -= absorbed;
    player.hp -= (dmg - absorbed) * 0.6;
    /* a hit interrupts both regen timers — shield waits 10 s, low-HP regen waits 15 s */
    player.shieldDelayT = SHIELD_REGEN_DELAY;
    player.hpDelayT = HP_REGEN_DELAY;
    damageFlashT = Math.max(damageFlashT, 0.35);
    if (fromEnemy) playFileSfx('unitHit', 0.7, rand(0.9, 1.1));
    if (player.hp <= 0) {
        player.hp = 0;
        player.dead = true;
        phase = P.DEAD;
        LJS.pointerLockExit();
        music.play('safe', 0.6);
        enterResultScreen();   // pause the game + start the result screen count-up
    }
}

const ENEMY_STATS = {
    skitter:   { hp: 40,   speed: 10.0, dmg: 9,  meleeRange: 1.4, meleeCd: 0.55 },
    runner:    { hp: 34,   speed: 16.5, dmg: 8,  meleeRange: 1.1, meleeCd: 0.48 },
    brute:     { hp: 280,  speed: 5.7,  dmg: 30, meleeRange: 4.2, meleeCd: 1.85 },
    spitter:   { hp: 100,  speed: 6.2,  dmg: 13, meleeRange: 0,   meleeCd: 1.30, rangedRange: 25 },
